<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taetaego 편집실</title>
<style>
  :root {
    --bg-app: #f4f5f6;
    --bg-surface: #ffffff;
    --bg-surface-raised: #f0f1f3;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --text: #1a1b1e;
    --text-secondary: #62646c;
    --text-tertiary: #8b8d95;
    --accent: #2f8a52;
    --accent-strong: #256b40;
    --accent-soft: rgba(47,138,82,0.12);
    --progress: #3f6ea8;
    --progress-soft: rgba(63,110,168,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-app);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .topRow {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .topic {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge.in_progress { background: var(--progress-soft); color: var(--progress); }
  .badge.completed { background: var(--accent-soft); color: var(--accent-strong); }
  .stage {
    font-size: 13.5px;
    color: var(--accent-strong);
    margin-top: 2px;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 18px 0;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 15px;
    font-weight: 600;
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 20px 0;
  }

  /* pipeline checklist */
  .pipeline-group + .pipeline-group { margin-top: 16px; }
  .pipeline-group-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .pipeline-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pipeline-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--bg-surface-raised);
    color: var(--text-tertiary);
  }
  .pipeline-item.done {
    background: var(--accent-soft);
    border-color: rgba(111,174,124,0.35);
    color: var(--accent-strong);
  }
  .pipeline-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .pipeline-item.done .dot { opacity: 1; }

  /* work log timeline */
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    padding-bottom: 10px;
    margin-bottom: 2px;
    border-bottom: 1px solid var(--border-strong);
  }
  .log-header-col {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .log-header-mid {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }
  .log-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    font-size: 13px;
  }
  .log-row + .log-row { border-top: 1px solid var(--border); }
  .log-category {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-weight: 600;
    color: var(--text);
  }
  .log-category .icon { font-size: 12px; flex-shrink: 0; }
  .log-category .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-category.none { color: var(--text-tertiary); font-weight: 500; }
  .log-mid {
    display: flex;
    gap: 10px;
    align-items: baseline;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .log-length,
  .log-header-length {
    font-variant-numeric: tabular-nums;
    width: 82px;
    text-align: right;
    flex-shrink: 0;
  }
  .log-time,
  .log-header-time {
    color: var(--text-tertiary);
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
    width: 148px;
    text-align: right;
  }

  /* 대부분 모바일에서 볼 걸 기준으로, 좁은 화면에서는 카테고리를 한 줄로 두고
     영상 길이/시각은 그 아래 한 줄로 내려서 잘리지 않게 한다. */
  @media (max-width: 420px) {
    body { padding: 20px 12px; }
    .card { padding: 16px; }
    .topic { font-size: 20px; }
    .log-header,
    .log-row {
      flex-wrap: wrap;
    }
    .log-category { flex-basis: 100%; }
    .log-header-mid,
    .log-mid {
      width: 100%;
      justify-content: space-between;
      padding-left: 20px;
    }
    .log-length, .log-header-length,
    .log-time, .log-header-time {
      width: auto;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="eyebrow">🎬 지금 편집 중인 영상</div>
    <div class="card" id="summaryCard">
      <div class="empty">불러오는 중…</div>
    </div>
    <div class="card" id="pipelineCard" style="display:none">
      <div class="card-title">전체 진행 단계</div>
      <div id="pipelineBody"></div>
    </div>
    <div class="card" id="logCard" style="display:none">
      <div class="card-title">작업 기록</div>
      <div class="log-header">
        <div class="log-header-col">카테고리</div>
        <div class="log-header-mid">
          <div class="log-header-col log-header-length">편집 시작 지점</div>
          <div class="log-header-col log-header-time">작업 시작 시간</div>
        </div>
      </div>
      <div id="logBody"></div>
    </div>
  </div>

<script>
async function main() {
  const summaryCard = document.getElementById('summaryCard');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    const data = await res.json();
    renderSummary(summaryCard, data);
    renderPipeline(data);
    renderLog(data);
  } catch (e) {
    summaryCard.innerHTML = '<div class="empty">아직 기록된 작업이 없어요</div>';
  }
}

function normalizeLength(s) {
  if (s === null || s === undefined || s === '') return null;
  const str = String(s);
  // "1:05" 같은 시:분 표기는 이미 명확하니 그대로, "23" 같은 순수 숫자는
  // 분 단위라는 걸 바로 알 수 있게 "분"을 붙인다.
  return str.includes(':') ? str : `${str}분`;
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMin = Math.round((now - then) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  const diffDay = Math.round(diffHour / 24);
  return diffDay + '일 전';
}

const WEEKDAYS = ['일','월','화','수','목','금','토'];

function formatDateTime(iso) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]}) ${hh}:${mi}`;
}

// 앱의 SF Symbol 이름 → 웹에서 바로 그릴 수 있는 이모지. 앱에 새 카테고리가
// 추가돼서 목록에 없는 심볼이 오면 generic 아이콘으로 대체한다.
const SYMBOL_EMOJI = {
  'scissors': '✂️',
  'captions.bubble': '💬',
  'photo.on.rectangle': '🎞️',
  'text.badge.checkmark': '✅',
  'paintpalette': '🎨',
  'star.bubble': '⭐',
  'map': '🗺️',
  'music.note': '🎵',
  'checkmark.seal': '🔎',
  'text.below.photo': '🖼️',
  'flag': '🚩',
};

function categoryIcon(symbolName) {
  return SYMBOL_EMOJI[symbolName] || '🔧';
}

function statRow(label, value, sub) {
  if (value === null || value === undefined) return '';
  return `<div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

function renderSummary(cardEl, data) {
  const statusLabel = data.status === 'completed' ? '완료' : '진행중';
  const statusClass = data.status === 'completed' ? 'completed' : 'in_progress';

  let stats = '';
  stats += statRow('원본 길이', normalizeLength(data.originalLength));
  stats += statRow(
    '정편집 후',
    normalizeLength(data.detailCutLength) ?? '—',
    data.detailCutRatio != null ? `원본 대비 ${Math.round(data.detailCutRatio)}%` : null
  );
  stats += statRow(
    '완성 길이',
    normalizeLength(data.finalLength) ?? '—',
    data.finalRatioVsOriginal != null ? `원본 대비 ${Math.round(data.finalRatioVsOriginal)}%` : null
  );
  stats += statRow('작업 기록', data.entryCount != null ? `${data.entryCount}개` : null);

  cardEl.innerHTML = `
    <div class="topRow">
      <div>
        <div class="topic">${escapeHtml(data.projectTopic ?? '제목 없음')}</div>
        ${data.currentStage ? `<div class="stage">현재 단계 · ${escapeHtml(data.currentStage)}</div>` : ''}
      </div>
      <div class="badge ${statusClass}">${statusLabel}</div>
    </div>
    <div class="divider"></div>
    <div class="stats">${stats}</div>
    <div class="divider"></div>
    <div class="stat-sub">마지막 업데이트 · ${data.lastUpdate ? relativeTime(data.lastUpdate) : '알 수 없음'}</div>
  `;
}

function renderPipeline(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return;

  // allCategories is already in pipeline order (컷 편집 그룹 다음 후반 작업 그룹).
  // 가장 나중 단계까지 작업했으면 그 앞 단계들은 실제로 개별 기록이 없어도
  // 당연히 다 지나온 걸로 보고 체크 표시한다 — "BGM 삽입"까지 왔으면
  // "맞춤법 검사"도 이미 끝난 게 당연하니까.
  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => {
    if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i);
  });

  const groups = {};
  cats.forEach((c, i) => {
    (groups[c.group] = groups[c.group] || []).push({ name: c.name, index: i });
  });

  let html = '';
  for (const groupName of Object.keys(groups)) {
    const items = groups[groupName].map(c => {
      const isDone = c.index <= lastTouchedIndex;
      return `<div class="pipeline-item ${isDone ? 'done' : ''}"><span class="dot"></span>${escapeHtml(c.name)}</div>`;
    }).join('');
    html += `
      <div class="pipeline-group">
        <div class="pipeline-group-title">${escapeHtml(groupName)}</div>
        <div class="pipeline-list">${items}</div>
      </div>
    `;
  }

  document.getElementById('pipelineBody').innerHTML = html;
  document.getElementById('pipelineCard').style.display = '';
}

function renderLog(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  // 카테고리 정렬 기준 = 파이프라인 순서(allCategories). 카테고리가 없는
  // "체크포인트" 기록은 맨 뒤로 보낸다.
  const catOrder = {};
  (data.allCategories || []).forEach((c, i) => { catOrder[c.name] = i; });
  const noCategoryOrder = (data.allCategories || []).length;

  // 날짜(일 단위)로 묶어서 정렬한다 — 날짜는 오래된 날부터(작업 진행 순서대로
  // 읽히도록), 같은 날 안에서는 실제 시간이 아니라 파이프라인 단계 순서로.
  // 화면에는 그룹 헤더 없이 각 행에 날짜+시각을 그대로 붙여서 한 줄로 보여준다.
  const byDay = new Map();
  for (const e of entries) {
    const key = new Date(e.timestamp).toDateString();
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  const sortedDayKeys = Array.from(byDay.keys()).sort((a, b) => new Date(a) - new Date(b));

  const orderedEntries = [];
  for (const dayKey of sortedDayKeys) {
    const dayEntries = byDay.get(dayKey).slice();
    dayEntries.sort((a, b) => {
      const ai = a.category != null ? (catOrder[a.category] ?? noCategoryOrder) : noCategoryOrder;
      const bi = b.category != null ? (catOrder[b.category] ?? noCategoryOrder) : noCategoryOrder;
      return ai - bi;
    });
    orderedEntries.push(...dayEntries);
  }

  const rows = orderedEntries.map(e => {
    const catLabel = e.category ? escapeHtml(e.category) : '체크포인트';
    const catClass = e.category ? '' : 'none';
    const icon = categoryIcon(e.categorySymbol);
    return `
      <div class="log-row">
        <div class="log-category ${catClass}"><span class="icon">${icon}</span><span class="name">${catLabel}</span></div>
        <div class="log-mid">
          <div class="log-length">${escapeHtml(normalizeLength(e.videoLength) ?? '')}</div>
          <div class="log-time">${formatDateTime(e.timestamp)}</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('logBody').innerHTML = rows;
  document.getElementById('logCard').style.display = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

main();
</script>
</body>
</html>
