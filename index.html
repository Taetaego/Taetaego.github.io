<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taetaego 편집실</title>
<style>
  :root {
    --bg-app: #131316;
    --bg-surface: #1e1f24;
    --bg-surface-raised: #25262c;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --text: #f4f4f5;
    --text-secondary: #9b9ca4;
    --text-tertiary: #68696f;
    --accent: #6fae7c;
    --accent-strong: #8fc79e;
    --accent-soft: rgba(111,174,124,0.14);
    --progress: #89a0c4;
    --progress-soft: rgba(137,160,196,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-app);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .page {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .topRow {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .topic {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge.in_progress { background: var(--progress-soft); color: var(--progress); }
  .badge.completed { background: var(--accent-soft); color: var(--accent-strong); }
  .stage {
    font-size: 13.5px;
    color: var(--accent-strong);
    margin-top: 2px;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 18px 0;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 15px;
    font-weight: 600;
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 20px 0;
  }

  /* pipeline checklist */
  .pipeline-group + .pipeline-group { margin-top: 16px; }
  .pipeline-group-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .pipeline-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pipeline-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--bg-surface-raised);
    color: var(--text-tertiary);
  }
  .pipeline-item.done {
    background: var(--accent-soft);
    border-color: rgba(111,174,124,0.35);
    color: var(--accent-strong);
  }
  .pipeline-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .pipeline-item.done .dot { opacity: 1; }

  /* work log timeline */
  .log-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    font-size: 13px;
  }
  .log-row + .log-row { border-top: 1px solid var(--border); }
  .log-category {
    font-weight: 600;
    color: var(--text);
  }
  .log-category.none { color: var(--text-tertiary); font-weight: 500; }
  .log-mid {
    display: flex;
    gap: 12px;
    align-items: baseline;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .log-length { font-variant-numeric: tabular-nums; }
  .log-time {
    color: var(--text-tertiary);
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="eyebrow">🎬 지금 편집 중인 영상</div>
    <div class="card" id="summaryCard">
      <div class="empty">불러오는 중…</div>
    </div>
    <div class="card" id="pipelineCard" style="display:none">
      <div class="card-title">전체 진행 단계</div>
      <div id="pipelineBody"></div>
    </div>
    <div class="card" id="logCard" style="display:none">
      <div class="card-title">작업 기록</div>
      <div id="logBody"></div>
    </div>
  </div>

<script>
async function main() {
  const summaryCard = document.getElementById('summaryCard');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    const data = await res.json();
    renderSummary(summaryCard, data);
    renderPipeline(data);
    renderLog(data);
  } catch (e) {
    summaryCard.innerHTML = '<div class="empty">아직 기록된 작업이 없어요</div>';
  }
}

function normalizeLength(s) {
  if (s === null || s === undefined || s === '') return null;
  return String(s);
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMin = Math.round((now - then) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  const diffDay = Math.round(diffHour / 24);
  return diffDay + '일 전';
}

function formatDateTime(iso) {
  const d = new Date(iso);
  const weekdays = ['일','월','화','수','목','금','토'];
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const wd = weekdays[d.getDay()];
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${mm}월 ${dd}일 (${wd}) ${hh}:${mi}`;
}

function statRow(label, value, sub) {
  if (value === null || value === undefined) return '';
  return `<div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

function renderSummary(cardEl, data) {
  const statusLabel = data.status === 'completed' ? '완료' : '진행중';
  const statusClass = data.status === 'completed' ? 'completed' : 'in_progress';

  let stats = '';
  stats += statRow('원본 길이', normalizeLength(data.originalLength));
  stats += statRow(
    '정편집 후',
    normalizeLength(data.detailCutLength) ?? '—',
    data.detailCutRatio != null ? `원본 대비 ${Math.round(data.detailCutRatio)}%` : null
  );
  stats += statRow(
    '완성 길이',
    normalizeLength(data.finalLength) ?? '—',
    data.finalRatioVsOriginal != null ? `원본 대비 ${Math.round(data.finalRatioVsOriginal)}%` : null
  );
  stats += statRow('작업 기록', data.entryCount != null ? `${data.entryCount}개` : null);

  cardEl.innerHTML = `
    <div class="topRow">
      <div>
        <div class="topic">${escapeHtml(data.projectTopic ?? '제목 없음')}</div>
        ${data.currentStage ? `<div class="stage">현재 단계 · ${escapeHtml(data.currentStage)}</div>` : ''}
      </div>
      <div class="badge ${statusClass}">${statusLabel}</div>
    </div>
    <div class="divider"></div>
    <div class="stats">${stats}</div>
    <div class="divider"></div>
    <div class="stat-sub">마지막 업데이트 · ${data.lastUpdate ? relativeTime(data.lastUpdate) : '알 수 없음'}</div>
  `;
}

function renderPipeline(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return;

  const done = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  const groups = {};
  for (const c of cats) {
    (groups[c.group] = groups[c.group] || []).push(c);
  }

  let html = '';
  for (const groupName of Object.keys(groups)) {
    const items = groups[groupName].map(c => {
      const isDone = done.has(c.name);
      return `<div class="pipeline-item ${isDone ? 'done' : ''}"><span class="dot"></span>${escapeHtml(c.name)}</div>`;
    }).join('');
    html += `
      <div class="pipeline-group">
        <div class="pipeline-group-title">${escapeHtml(groupName)}</div>
        <div class="pipeline-list">${items}</div>
      </div>
    `;
  }

  document.getElementById('pipelineBody').innerHTML = html;
  document.getElementById('pipelineCard').style.display = '';
}

function renderLog(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  const rows = entries.slice().reverse().map(e => {
    const catLabel = e.category ? escapeHtml(e.category) : '체크포인트';
    const catClass = e.category ? '' : 'none';
    return `
      <div class="log-row">
        <div class="log-category ${catClass}">${catLabel}</div>
        <div class="log-mid">
          <div class="log-length">${escapeHtml(normalizeLength(e.videoLength) ?? '')}</div>
          <div class="log-time">${formatDateTime(e.timestamp)}</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('logBody').innerHTML = rows;
  document.getElementById('logCard').style.display = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

main();
</script>
</body>
</html>
