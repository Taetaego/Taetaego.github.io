<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>태태고 편집실</title>
<style>
  html[data-theme="dark"] {
    --bg: #0a0e0f;
    --surface: #121a1b;
    --surface2: #1a2426;
    --ink: #eef5f2;
    --ink2: #9fb3ae;
    --ink3: #647672;
    --line: rgba(255,255,255,0.08);
    --line2: rgba(255,255,255,0.16);
    --accent: #34e0b0;
    --accent2: #8ff0d4;
    --soft: rgba(52,224,176,0.14);
    --on-accent: #08120c;
    --tg-on-bg: #24322a;
    --tg-on-ink: #8ceab7;
    --warn: #f2b84a;
    --warn-soft: rgba(242,184,74,0.16);
  }
  html[data-theme="light"] {
    --bg: #f2f6f5;
    --surface: #ffffff;
    --surface2: #e9efed;
    --ink: #0b1615;
    --ink2: #4a615c;
    --ink3: #6f8580;
    --line: rgba(11,22,21,0.08);
    --line2: rgba(11,22,21,0.18);
    --accent: #0f9b78;
    --accent2: #076b52;
    --soft: rgba(15,155,120,0.12);
    --on-accent: #ffffff;
    --tg-on-bg: #ffffff;
    --tg-on-ink: #0b5c36;
    --warn: #a3690c;
    --warn-soft: rgba(163,105,12,0.14);
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      --bg: #0a0e0f;
      --surface: #121a1b;
      --surface2: #1a2426;
      --ink: #eef5f2;
      --ink2: #9fb3ae;
      --ink3: #647672;
      --line: rgba(255,255,255,0.08);
      --line2: rgba(255,255,255,0.16);
      --accent: #34e0b0;
      --accent2: #8ff0d4;
      --soft: rgba(52,224,176,0.14);
      --on-accent: #08120c;
      --tg-on-bg: #24322a;
      --tg-on-ink: #8ceab7;
      --warn: #f2b84a;
      --warn-soft: rgba(242,184,74,0.16);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; padding: 24px 12px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .page { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 12px; }
  .colLeft, .colRight { display: contents; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px 16px; cursor: default; }
  #summaryCard.card, #doneCard.card, #pipelineCard.card, #statsWrap .card, #catCard.card, #logCard.card {
    opacity: 0; animation: cardIn .5s ease both;
  }
  #summaryCard.card { animation-delay: 0s; }
  #doneCard.card { animation-delay: .04s; }
  #pipelineCard.card { animation-delay: .08s; }
  #catCard.card { animation-delay: .12s; }
  #logCard.card { animation-delay: .18s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ringPing { 0% { transform: scale(0.7); opacity: 0.95; } 50%, 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes warnGlow { 0%, 100% { box-shadow: 0 0 0 3px var(--warn-soft), 0 0 10px 0 rgba(232,181,74,0.45); } 50% { box-shadow: 0 0 0 6px var(--warn-soft), 0 0 22px 4px rgba(232,181,74,0.75); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* 상단 바 */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .themeToggle { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); }
  .themeToggle button { border: none; cursor: pointer; font: 500 9px/1 'JetBrains Mono', monospace; letter-spacing: 0.1em; padding: 6px 8px; border-radius: 99px; background: transparent; color: var(--ink3); }
  .themeToggle button.active { background: var(--tg-on-bg); color: var(--tg-on-ink); }

  /* 히어로: 원형 게이지 */
  .hero { display: flex; align-items: center; gap: 18px; padding: 22px 18px; cursor: pointer; }
  .hero:active { transform: scale(0.995); }
  .donut { flex: none; width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .donut .in { width: 86px; height: 86px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .donut .pct { font: 700 25px/1 'JetBrains Mono', monospace; letter-spacing: -0.04em; }
  .donut .steps { font: 500 9px/1 'JetBrains Mono', monospace; letter-spacing: 0.1em; color: var(--ink3); }
  .heroRight { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .statusChip { align-self: flex-start; font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: var(--soft); color: var(--accent2); }
  .statusChip.wip { background: var(--warn-soft); color: var(--warn); animation: labelFade 1.8s ease-in-out infinite; }
  .topic { font-size: 16.5px; font-weight: 600; line-height: 1.35; letter-spacing: -0.02em; word-break: keep-all; }
  .stageLabel { font-size: 9.5px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink3); }
  .stageName { font-size: 12.5px; font-weight: 600; color: var(--accent2); }

  /* 프로젝트 완료 요약 */
  .doneCard { display: flex; flex-direction: column; gap: 12px; }
  .doneTitle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--accent2); }
  .doneTitle .doneIcon { width: 20px; height: 20px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .doneList { display: flex; flex-direction: column; gap: 6px; }
  .doneList div { font-size: 12.5px; color: var(--ink); line-height: 1.5; }
  .doneList div.strong { font-weight: 700; }

  /* 전체 진행 단계 */
  .cardHead { display: flex; align-items: baseline; justify-content: space-between; }
  .cardTitle { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--ink3); }
  .cardMeta { font: 500 9.5px/1 'JetBrains Mono', monospace; color: var(--ink3); }
  .pipeCard { display: flex; flex-direction: column; gap: 16px; }
  #pipelineBody { display: flex; flex-direction: column; gap: 22px; }
  .pipeGroup { display: flex; flex-direction: column; gap: 8px; }
  .pipeGroupTitle { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent2); }
  .pipeList { position: relative; display: flex; flex-direction: column; }
  .pipeList::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: 16px; width: 1px; background: var(--line2); }
  .pipeItem { position: relative; display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .pipeItem .dot { z-index: 1; flex: none; width: 17px; height: 17px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
  .pipeItem.todo .dot { background: var(--surface2); border: 1.5px solid var(--line2); color: transparent; }
  .pipeItem.current .dot {
    position: relative; background: var(--surface); border: 2px solid var(--warn); color: transparent;
    animation: labelFade 1.8s ease-in-out infinite, warnGlow 1.8s ease-in-out infinite;
  }
  .pipeItem.current .dot::before {
    content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--warn);
    animation: ringPing 1.8s cubic-bezier(0,0,0.2,1) infinite;
    animation-delay: -0.45s;
  }
  .pipeItem .n { font: 500 9.5px/1 'JetBrains Mono', monospace; color: var(--ink3); }
  .pipeItem .name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .pipeItem.todo .name { color: var(--ink3); }
  .pipeItem.current .name { color: var(--ink); display: inline-flex; align-items: center; }
  .pipeItem.current .name::after {
    content: "진행중"; display: inline-flex; align-items: center; margin-left: 8px; font-size: 10px; font-weight: 700; color: var(--warn);
    background: var(--warn-soft); padding: 2px 8px; border-radius: 99px; line-height: 1.4;
    animation: labelFade 1.8s ease-in-out infinite;
  }
  @keyframes labelFade { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* 통계 타일 */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .statTile { display: flex; flex-direction: column; gap: 5px; padding: 13px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); border-left: 2px solid var(--accent); }
  .statTile .label { font-size: 10px; font-weight: 600; color: var(--ink3); }
  .statTile .value { font-size: 17px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .statTile .sub { font-size: 10px; line-height: 1.4; color: var(--ink2); }

  /* 카테고리별 기록 */
  .catCard { display: flex; flex-direction: column; gap: 12px; }
  .catChips { display: flex; flex-wrap: wrap; gap: 6px; }
  .catChip { display: flex; align-items: center; gap: 7px; padding: 6px 10px 6px 7px; border-radius: 99px; background: var(--surface2); font-size: 11.5px; font-weight: 500; }
  .catChip .mk { width: 18px; height: 18px; border-radius: 5px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; }
  .catChip .cnt { font: 500 9.5px/1 'JetBrains Mono', monospace; color: var(--ink3); }

  /* 작업 기록 */
  .logCard { display: flex; flex-direction: column; gap: 10px; }
  .logHead { display: grid; grid-template-columns: 1fr 42px 62px 58px; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line2); font-size: 9px; font-weight: 600; color: var(--ink3); }
  .logHead .c { position: relative; text-align: center; line-height: 1.25; }
  .logHead .infoBtn {
    position: absolute; top: -5px; right: -3px; width: 11px; height: 11px; border-radius: 50%;
    border: none; background: none; color: var(--ink3); font-size: 7px; font-weight: 700;
    cursor: pointer; padding: 0; line-height: 1;
  }
  .logHead .infoBtn:hover { color: var(--accent2); }
  .infoPopover {
    display: none; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 180px; z-index: 20;
    background: var(--surface); border: 1px solid var(--line2); border-radius: 14px; padding: 11px;
    font-size: 10.5px; line-height: 1.5; color: var(--ink2); text-align: left; font-weight: 400;
  }
  .infoPopover.open { display: block; }
  .logDay { padding: 13px 0 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent2); }
  .logDay:first-of-type { padding-top: 0; }
  .logRow { display: grid; grid-template-columns: 1fr 42px 62px 58px; gap: 6px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); transition: background-color .2s ease; }
  .logRow:hover { background: var(--soft); }
  .logRow .cat { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logRow .at { font-size: 11px; font-weight: 600; text-align: center; }
  .logRow .time { font: 400 10.5px/1 'JetBrains Mono', monospace; text-align: center; color: var(--ink3); }
  .logRow .gap { font-size: 9.5px; line-height: 1.2; text-align: center; color: var(--ink3); }
  .empty { text-align: center; color: var(--ink2); font-size: 14px; padding: 20px 0; }

  @media (max-width: 420px) {
    body { padding: 18px 10px 48px; }
    .card { padding: 16px 14px; border-radius: 20px; }
  }

  /* 웹(데스크톱) 버전: 모바일 카드 구성을 2열로 재배치 */
  @media (min-width: 900px) {
    body { padding: 48px 32px 80px; align-items: flex-start; }
    .page {
      max-width: 980px;
      display: grid;
      grid-template-columns: minmax(320px, 400px) 1fr;
      grid-template-areas:
        "topbar topbar"
        "left   right";
      align-items: start;
      gap: 16px;
    }
    .topbar { grid-area: topbar; padding: 0 4px 4px; }
    .colLeft { grid-area: left; display: flex; flex-direction: column; gap: 16px; }
    .colRight { grid-area: right; display: flex; flex-direction: column; gap: 16px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 20px; }
    .donut { width: 128px; height: 128px; }
    .donut .in { width: 98px; height: 98px; }
    .donut .pct { font-size: 28px; }
  }
</style>
</head>
<body>
  <canvas id="fxCanvas" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999"></canvas>
  <div class="page">
    <div class="topbar">
      <div class="brand">태태고 편집실</div>
      <div class="themeToggle" id="themeToggle">
        <button type="button" data-mode="light">LIGHT</button>
        <button type="button" data-mode="dark">DARK</button>
      </div>
    </div>

    <div class="colLeft">
      <div class="card hero" id="summaryCard" title="클릭하면 폭죽 한 번 더">
        <div class="empty">불러오는 중…</div>
      </div>

      <div class="card doneCard" id="doneCard" style="display:none">
        <div class="doneTitle"><span class="doneIcon">✓</span>프로젝트 완료</div>
        <div class="doneList" id="doneList"></div>
      </div>

      <div class="card pipeCard" id="pipelineCard" style="display:none">
        <div class="cardHead">
          <span class="cardTitle">전체 진행 단계</span>
          <span class="cardMeta mono" id="pipelineMeta"></span>
        </div>
        <div id="pipelineBody"></div>
      </div>
    </div>

    <div class="colRight">
      <div id="statsWrap">
        <div class="stats" id="statsBody"></div>
      </div>

      <div class="card catCard" id="catCard" style="display:none">
        <div class="cardHead">
          <span class="cardTitle">카테고리별 기록</span>
          <span class="cardMeta mono" id="catMeta"></span>
        </div>
        <div class="catChips" id="catBody"></div>
      </div>

      <div class="card logCard" id="logCard" style="display:none">
        <div id="logBody"></div>
      </div>
    </div>
  </div>

<script>
let reducedMotion = false;
let heroPct = 0;
let heroCompleted = false;

async function main() {
  reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const summaryCard = document.getElementById('summaryCard');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    const data = await res.json();
    renderSummary(summaryCard, data);
    renderCompletion(data);
    renderPipeline(data);
    renderStats(data);
    renderCategoryChips(data);
    renderLog(data);
    summaryCard.addEventListener('click', () => celebrate(heroPct, heroCompleted));
    setTimeout(() => celebrate(heroPct, heroCompleted), 150);
  } catch (e) {
    summaryCard.innerHTML = '<div class="empty">아직 기록된 작업이 없어요</div>';
  }
}

function normalizeLength(s) {
  if (s === null || s === undefined || s === '') return null;
  const str = String(s);
  let totalMinutes;
  if (str.includes(':')) {
    const [h, m] = str.split(':').map(Number);
    totalMinutes = h * 60 + m;
  } else {
    totalMinutes = Number(str);
  }
  if (!Number.isFinite(totalMinutes)) return str;
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (hours > 0) parts.push(`${hours}시간`);
  if (minutes > 0 || parts.length === 0) parts.push(`${minutes}분`);
  return parts.join(' ');
}

function formatDuration(ms) {
  const totalMinutes = Math.max(0, Math.round(ms / 60000));
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (days > 0) parts.push(`${days}일`);
  if (hours > 0) parts.push(`${hours}시간`);
  if (minutes > 0 || parts.length === 0) parts.push(`${minutes}분`);
  return parts.join(' ');
}

function renderCompletion(data) {
  if (data.status !== 'completed') return;

  const rows = [];
  rows.push({ text: `시작 시각: ${formatDateTime(data.createdAt)}` });
  if (data.completedAt) rows.push({ text: `완료 시각: ${formatDateTime(data.completedAt)}` });
  if (data.completedAt) {
    const dur = new Date(data.completedAt).getTime() - new Date(data.createdAt).getTime();
    rows.push({ text: `총 소요시간: ${formatDuration(dur)}`, strong: true });
  }
  const origLen = normalizeLength(data.originalLength);
  if (origLen != null) rows.push({ text: `촬영 원본 길이: ${origLen}`, gap: true });
  const finalLen = normalizeLength(data.finalLength);
  if (finalLen != null) rows.push({ text: `완성 영상 길이: ${finalLen}` });
  if (data.finalRatioVsOriginal != null) rows.push({ text: `원본 대비 완성 영상: ${Math.round(data.finalRatioVsOriginal)}%` });

  document.getElementById('doneList').innerHTML = rows
    .map(r => `<div class="${r.strong ? 'strong' : ''}"${r.gap ? ' style="margin-top:8px"' : ''}>${escapeHtml(r.text)}</div>`)
    .join('');
  document.getElementById('doneCard').style.display = '';
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMin = Math.round((now - then) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  const diffDay = Math.round(diffHour / 24);
  return diffDay + '일 전';
}

const WEEKDAYS = ['일','월','화','수','목','금','토'];

function formatTimeOnly(iso) {
  const d = new Date(iso);
  const h24 = d.getHours();
  const period = h24 < 12 ? '오전' : '오후';
  let h12 = h24 % 12;
  if (h12 === 0) h12 = 12;
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${period} ${h12}:${mi}`;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]}) ${formatTimeOnly(iso)}`;
}

function formatDayLabel(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
}

const SYMBOL_EMOJI = {
  'scissors': '✂️',
  'captions.bubble': '💬',
  'photo.on.rectangle': '🎞️',
  'text.badge.checkmark': '✅',
  'paintpalette': '🎨',
  'star.bubble': '⭐',
  'map': '🗺️',
  'music.note': '🎵',
  'checkmark.seal': '🔎',
  'text.below.photo': '🖼️',
  'flag': '🚩',
};

function categoryIcon(symbolName) {
  return SYMBOL_EMOJI[symbolName] || '🔧';
}

function pipelineProgress(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return null;
  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => { if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i); });
  const done = Math.max(lastTouchedIndex + 1, 0);
  return { done, total: cats.length, pct: Math.round((done / cats.length) * 100), lastTouchedIndex };
}

function renderSummary(cardEl, data) {
  const isCompleted = data.status === 'completed';
  const progress = pipelineProgress(data);
  const pct = progress ? progress.pct : 0;
  const statusLabel = isCompleted ? '완료' : '진행중';
  const stageText = isCompleted ? null : data.currentStage;
  heroPct = pct;
  heroCompleted = isCompleted;

  const entries = data.entries || [];
  const lastEntryTime = entries.length ? entries[entries.length - 1].timestamp : null;
  const chipTime = isCompleted ? data.lastUpdate : (lastEntryTime ?? data.lastUpdate);

  cardEl.innerHTML = `
    <div class="donut" id="donutGauge" style="background: conic-gradient(var(--accent) 0 0%, var(--surface2) 0% 100%)">
      <div class="in">
        <span class="pct mono" id="donutPct">0%</span>
        <span class="steps mono">${progress ? `${progress.done} / ${progress.total}` : '0 / 0'}</span>
      </div>
    </div>
    <div class="heroRight">
      <span class="statusChip${isCompleted ? '' : ' wip'}">${statusLabel}${chipTime ? ` · ${relativeTime(chipTime)}` : ''}</span>
      <span class="topic">${escapeHtml(data.projectTopic ?? '제목 없음')}</span>
      ${stageText ? `
        <div style="display:flex;flex-direction:column;gap:2px">
          <span class="stageLabel">현재 단계</span>
          <span class="stageName">${escapeHtml(stageText)}</span>
        </div>` : ''}
    </div>
  `;
}

function renderPipeline(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return;

  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => { if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i); });

  const groups = {};
  cats.forEach((c, i) => { (groups[c.group] = groups[c.group] || []).push({ name: c.name, index: i }); });

  let html = '';
  for (const groupName of Object.keys(groups)) {
    const items = groups[groupName].map(c => {
      const isDone = c.index < lastTouchedIndex || (c.index === lastTouchedIndex && data.status === 'completed');
      const isCurrent = c.index === lastTouchedIndex && data.status !== 'completed';
      const cls = isDone ? 'done' : (isCurrent ? 'current' : 'todo');
      const n = String(c.index + 1).padStart(2, '0');
      return `<div class="pipeItem ${cls}"><span class="dot">${isDone ? '✓' : ''}</span><span class="n mono">${n}</span><span class="name">${escapeHtml(c.name)}</span></div>`;
    }).join('');
    html += `
      <div class="pipeGroup">
        <div class="pipeGroupTitle">${escapeHtml(groupName)}</div>
        <div class="pipeList">${items}</div>
      </div>
    `;
  }

  document.getElementById('pipelineBody').innerHTML = html;
  const done = Math.max(lastTouchedIndex + 1, 0);
  document.getElementById('pipelineMeta').textContent = `${done} DONE`;
  document.getElementById('pipelineCard').style.display = '';
}

function statTile(label, value, subs) {
  if (value === null || value === undefined) return '';
  const subHtml = (subs || []).filter(Boolean).map(s => `<span class="sub">${s}</span>`).join('');
  return `<div class="statTile"><span class="label">${label}</span><span class="value">${value}</span>${subHtml}</div>`;
}

function renderStats(data) {
  let stats = '';
  stats += statTile('촬영 원본 길이', normalizeLength(data.originalLength));
  stats += statTile('컷편집 후 영상 길이', normalizeLength(data.detailCutLength) ?? '—', [data.detailCutRatio != null ? `원본 대비 ${Math.round(data.detailCutRatio)}%` : null]);
  const finalSubs = [];
  if (data.finalRatioVsOriginal != null) finalSubs.push(`원본 대비 ${Math.round(data.finalRatioVsOriginal)}%`);
  if (data.finalRatioVsDetailCut != null) finalSubs.push(`컷편집 대비 ${Math.round(data.finalRatioVsDetailCut)}%`);
  stats += statTile('완성 영상 길이', normalizeLength(data.finalLength) ?? '—', finalSubs);
  stats += statTile('작업 기록', data.entryCount != null ? `${data.entryCount}개` : null);

  document.getElementById('statsBody').innerHTML = stats;
}

function renderCategoryChips(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  const counts = new Map();
  const symbolByName = new Map();
  for (const e of entries) {
    const name = e.category || '체크포인트';
    counts.set(name, (counts.get(name) || 0) + 1);
    if (!symbolByName.has(name)) symbolByName.set(name, e.categorySymbol);
  }

  const html = Array.from(counts.entries()).map(([name, count]) => {
    const icon = categoryIcon(symbolByName.get(name));
    return `<span class="catChip"><span class="mk">${icon}</span>${escapeHtml(name)}<span class="cnt mono">${count}건</span></span>`;
  }).join('');

  document.getElementById('catBody').innerHTML = html;
  document.getElementById('catMeta').textContent = String(entries.length);
  document.getElementById('catCard').style.display = '';
}

function renderLog(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  const catOrder = {};
  (data.allCategories || []).forEach((c, i) => { catOrder[c.name] = i; });
  const noCategoryOrder = (data.allCategories || []).length;

  const byDay = new Map();
  for (const e of entries) {
    const key = new Date(e.timestamp).toDateString();
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  const sortedDayKeys = Array.from(byDay.keys()).sort((a, b) => new Date(a) - new Date(b));

  let html = `
    <div class="logHead">
      <span>카테고리</span>
      <span class="c">시작 시점
        <button type="button" class="infoBtn" aria-label="시작 시점 설명">ⓘ</button>
        <div class="infoPopover">이 작업을 시작했을 때 영상이 어디까지 편집되어 있었는지 (영상 길이 기준)</div>
      </span>
      <span class="c">시작 시간
        <button type="button" class="infoBtn" aria-label="시작 시간 설명">ⓘ</button>
        <div class="infoPopover">이 작업을 실제로 시작한 시각</div>
      </span>
      <span class="c">이전 기록<br>으로부터</span>
    </div>
  `;
  for (const dayKey of sortedDayKeys) {
    const dayEntries = byDay.get(dayKey).slice();
    dayEntries.sort((a, b) => {
      const ai = a.category != null ? (catOrder[a.category] ?? noCategoryOrder) : noCategoryOrder;
      const bi = b.category != null ? (catOrder[b.category] ?? noCategoryOrder) : noCategoryOrder;
      return ai - bi;
    });

    html += `<div class="logDay">${formatDayLabel(dayEntries[0].timestamp)}</div>`;

    for (const e of dayEntries) {
      const catLabel = e.category ? escapeHtml(e.category) : '체크포인트';
      const length = escapeHtml(normalizeLength(e.videoLength) ?? '');
      const time = formatTimeOnly(e.timestamp);
      const elapsed = escapeHtml(e.elapsed ?? '');

      html += `
        <div class="logRow">
          <span class="cat">${catLabel}</span>
          <span class="at">${length || '—'}</span>
          <span class="time mono">${time}</span>
          <span class="gap">${elapsed || '—'}</span>
        </div>
      `;
    }
  }
  document.getElementById('logBody').innerHTML = html;
  document.getElementById('logCard').style.display = '';
  initInfoPopover();
}

function initInfoPopover() {
  document.querySelectorAll('.infoBtn').forEach((btn) => {
    const popover = btn.nextElementSibling;
    if (!popover) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = popover.classList.contains('open');
      document.querySelectorAll('.infoPopover.open').forEach((p) => p.classList.remove('open'));
      if (!wasOpen) popover.classList.add('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.c')) {
      document.querySelectorAll('.infoPopover.open').forEach((p) => p.classList.remove('open'));
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  try { localStorage.setItem('theme', mode); } catch (e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved || 'dark');
  document.getElementById('themeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) applyTheme(btn.dataset.mode);
  });
})();

/* ===== 폭죽 (완료된 프로젝트일 때만) ===== */
const FX_HUES = [0, 25, 48, 140, 165, 195, 220, 275, 320];
let fx = null;
let fxTimer = null;

function initFx() {
  if (fx) return fx;
  const cv = document.getElementById('fxCanvas');
  if (!cv) return null;
  const ctx = cv.getContext('2d');
  fx = { cv, ctx, ps: [], rs: [], t: null, w: 0, h: 0 };

  fx.sizeFn = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.max(1, w * dpr);
    cv.height = Math.max(1, h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fx.w = w; fx.h = h;
  };
  fx.sizeFn();
  window.addEventListener('resize', fx.sizeFn);

  fx.boom = (x, y, big) => {
    const n = big ? 130 : 80;
    const hue = FX_HUES[Math.floor(Math.random() * FX_HUES.length)];
    const hue2 = Math.random() < 0.35 ? FX_HUES[Math.floor(Math.random() * FX_HUES.length)] : hue;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.25;
      const sp = (big ? 4.8 : 3.4) * (0.35 + Math.random() * 0.65);
      const h = (i % 2 === 0 ? hue : hue2) + Math.random() * 18 - 9;
      fx.ps.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: 0.0042 + Math.random() * 0.0046, hue: h, r: big ? 2.6 : 2.0, tw: Math.random() < 0.45 ? 6 + Math.random() * 7 : 0, ph: Math.random() * 6.28, t: 0 });
    }
    for (let i = 0; i < (big ? 22 : 12); i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 0.9;
      fx.ps.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: 0.0036 + Math.random() * 0.004, hue: 48 + Math.random() * 12, r: 1.6, tw: 9, ph: Math.random() * 6.28, t: 0 });
    }
    if (big) {
      [420, 780].forEach(t => setTimeout(() => {
        fx.boom(x + (Math.random() - 0.5) * 140, y + (Math.random() - 0.5) * 100, false);
        fx.kick();
      }, t));
    }
  };

  fx.rocket = () => {
    const page = document.querySelector('.page');
    const r = page ? page.getBoundingClientRect() : null;
    const cx = r ? r.left + r.width / 2 : fx.w / 2;
    const half = r ? Math.min(fx.w * 0.48, r.width * 0.75) : fx.w * 0.4;
    const x = Math.max(12, Math.min(fx.w - 12, cx + (Math.random() * 2 - 1) * half));
    fx.rs.push({ x, y: fx.h + 8, vx: (Math.random() - 0.5) * 1.0, vy: -(7.4 + Math.random() * 1.8), ty: fx.h * (0.1 + Math.random() * 0.24) });
  };

  const step = () => {
    ctx.clearRect(0, 0, fx.w, fx.h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = fx.rs.length - 1; i >= 0; i--) {
      const r = fx.rs[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.055;
      ctx.strokeStyle = 'rgba(140,234,183,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 2.6, r.y - r.vy * 2.6); ctx.stroke();
      if (r.vy > -1.6 || r.y <= r.ty) { fx.rs.splice(i, 1); fx.boom(r.x, r.y, Math.random() < 0.55); }
    }
    for (let i = fx.ps.length - 1; i >= 0; i--) {
      const p = fx.ps[i];
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.966; p.vy = p.vy * 0.966 + 0.022;
      p.life -= p.dec;
      p.t += 1;
      if (p.life <= 0) { fx.ps.splice(i, 1); continue; }
      const flick = p.tw ? (0.62 + 0.38 * Math.sin(p.t / p.tw * 6.28 + p.ph)) : 1;
      ctx.strokeStyle = 'hsla(' + p.hue + ',90%,' + (52 + p.life * 26) + '%,' + (p.life * flick) + ')';
      ctx.lineWidth = p.r * p.life + 0.4;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    if (fx.ps.length || fx.rs.length) fx.t = requestAnimationFrame(step);
    else { fx.t = null; ctx.clearRect(0, 0, fx.w, fx.h); }
  };
  fx.kick = () => { if (!fx.t) fx.t = requestAnimationFrame(step); };
  return fx;
}

function startAmbientFireworks() {
  if (fxTimer || reducedMotion) return;
  fxTimer = setInterval(() => {
    if (document.hidden) return;
    const f = initFx();
    if (!f) return;
    f.rocket(); f.kick();
    setTimeout(() => { f.rocket(); f.kick(); }, 500 + Math.random() * 500);
    if (Math.random() < 0.6) setTimeout(() => { f.rocket(); f.kick(); }, 1300 + Math.random() * 500);
  }, 2800);
}

function runGauge(target, fire) {
  const el = document.getElementById('donutPct');
  const dn = document.getElementById('donutGauge');
  if (!el || !dn) return;
  if (reducedMotion) {
    el.textContent = target + '%';
    dn.style.background = `conic-gradient(var(--accent) 0 ${target}%, var(--surface2) ${target}% 100%)`;
    return;
  }
  const t0 = performance.now(), dur = 1500;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const p = e * target;
    el.textContent = Math.round(p) + '%';
    dn.style.background = `conic-gradient(var(--accent) 0 ${p}%, var(--surface2) ${p}% 100%)`;
    if (k < 1) requestAnimationFrame(tick);
    else if (fire) {
      const f = initFx();
      if (f) {
        const r = dn.getBoundingClientRect();
        f.boom(r.left + r.width / 2, r.top + r.height / 2, true);
        f.kick();
      }
    }
  };
  requestAnimationFrame(tick);
}

function celebrate(targetPct, isCompleted) {
  const fire = !reducedMotion && isCompleted;
  if (fire) {
    const f = initFx();
    if (f) [0, 250, 550, 900, 1250, 1650, 2100, 2550, 3050, 3600, 4200, 4800].forEach(d => setTimeout(() => { f.rocket(); f.kick(); }, d));
    startAmbientFireworks();
  }
  runGauge(targetPct, fire);
}

main();
</script>
