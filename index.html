<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Taetaego 편집실</title>
<style>
  :root {
    --bg-app: #f4f5f6;
    --bg-surface: #ffffff;
    --bg-surface-raised: #f0f1f3;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --text: #000000;
    --text-secondary: #45474e;
    --text-tertiary: #63656d;
    --accent: #2f8a52;
    --accent-strong: #256b40;
    --accent-soft: rgba(47,138,82,0.12);
    --progress: #3f6ea8;
    --progress-soft: rgba(63,110,168,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-app: #17181b;
      --bg-surface: #1f2023;
      --bg-surface-raised: #2a2b2f;
      --border: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.16);
      --text: #ffffff;
      --text-secondary: #b7b9c1;
      --text-tertiary: #8b8d95;
      --accent: #4cb377;
      --accent-strong: #6fcf97;
      --accent-soft: rgba(76,179,119,0.18);
      --progress: #6ea3e0;
      --progress-soft: rgba(110,163,224,0.18);
    }
  }
  * { box-sizing: border-box; }
  html {
    background: var(--bg-app);
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-app);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .topRow {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .topic {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge.in_progress { background: var(--progress-soft); color: var(--progress); }
  .badge.completed { background: var(--accent-soft); color: var(--accent-strong); }
  .stage {
    font-size: 13.5px;
    color: var(--accent-strong);
    margin-top: 2px;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 18px 0;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 15px;
    font-weight: 600;
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 20px 0;
  }

  /* pipeline checklist */
  .pipeline-group + .pipeline-group { margin-top: 16px; }
  .pipeline-group-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .pipeline-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pipeline-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--bg-surface-raised);
    color: var(--text-tertiary);
  }
  .pipeline-item.done {
    background: var(--accent-soft);
    border-color: rgba(111,174,124,0.35);
    color: var(--accent-strong);
  }
  .pipeline-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .pipeline-item.done .dot { opacity: 1; }

  /* work log — 앱의 작업 기록 표와 같은 4열 구조:
     카테고리 · 편집 시작 지점 · 작업 시작 시간 · 이전 기록으로부터 */
  .log-table {
    display: grid;
    grid-template-columns: minmax(90px, 1.4fr) auto auto auto;
    column-gap: 12px;
  }
  .log-cell {
    padding: 10px 0;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    min-width: 0;
    border-top: 1px solid var(--border);
  }
  .log-cell.head {
    border-top: none;
    border-bottom: 1px solid var(--border-strong);
    padding: 0 0 9px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .log-cell.num {
    justify-content: center;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
  }
  .log-cell.time {
    justify-content: center;
    color: var(--text-secondary);
    font-size: 12px;
    white-space: nowrap;
  }
  .log-cell.elapsed {
    justify-content: center;
    color: var(--text-secondary);
    font-size: 12px;
    white-space: nowrap;
  }
  .log-cell.head.num,
  .log-cell.head.time,
  .log-cell.head.elapsed { justify-content: center; color: var(--text-secondary); }
  .log-day-head {
    grid-column: 1 / -1;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.02em;
    padding: 16px 0 6px;
  }
  .log-category {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }
  .log-category .icon { font-size: 12px; flex-shrink: 0; }
  .log-category .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-category.none { color: var(--text-tertiary); font-weight: 500; }

  /* 모바일: 4열을 그대로 욱여넣으면 좁아서, 한 기록을 2줄 카드로 편다.
     1줄: 카테고리 + 편집 시작 지점 / 2줄: 작업 시작 시간 + 이전 기록으로부터 */
  @media (max-width: 430px) {
    body { padding: 20px 12px; }
    .card { padding: 16px; }
    .topic { font-size: 20px; }
    .log-table { display: block; }
    .log-cell.head { display: none; }
    .log-entry {
      border-top: 1px solid var(--border);
      padding: 10px 0;
    }
    .log-entry:first-of-type { border-top: none; }
    .log-entry .row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .log-entry .row2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 3px;
      padding-left: 20px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .log-entry .num { font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
    .m-label { color: var(--text-tertiary); font-size: 11px; margin-right: 4px; }
  }
  .log-entry { display: none; }
  @media (max-width: 430px) {
    .log-entry { display: block; }
    .log-cell { display: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="eyebrow">🎬 지금 편집 중인 영상</div>
    <div class="card" id="summaryCard">
      <div class="empty">불러오는 중…</div>
    </div>
    <div class="card" id="pipelineCard" style="display:none">
      <div class="card-title">전체 진행 단계</div>
      <div id="pipelineBody"></div>
    </div>
    <div class="card" id="logCard" style="display:none">
      <div class="card-title">작업 기록</div>
      <div class="log-table" id="logBody"></div>
    </div>
  </div>

<script>
async function main() {
  const summaryCard = document.getElementById('summaryCard');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    const data = await res.json();
    renderSummary(summaryCard, data);
    renderPipeline(data);
    renderLog(data);
  } catch (e) {
    summaryCard.innerHTML = '<div class="empty">아직 기록된 작업이 없어요</div>';
  }
}

function normalizeLength(s) {
  if (s === null || s === undefined || s === '') return null;
  const str = String(s);
  // 앱의 TimeUtils.displayLength와 동일한 포맷: "13시간", "1시간 5분", "34분".
  let totalMinutes;
  if (str.includes(':')) {
    const [h, m] = str.split(':').map(Number);
    totalMinutes = h * 60 + m;
  } else {
    totalMinutes = Number(str);
  }
  if (!Number.isFinite(totalMinutes)) return str;
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (hours > 0) parts.push(`${hours}시간`);
  if (minutes > 0 || parts.length === 0) parts.push(`${minutes}분`);
  return parts.join(' ');
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMin = Math.round((now - then) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  const diffDay = Math.round(diffHour / 24);
  return diffDay + '일 전';
}

const WEEKDAYS = ['일','월','화','수','목','금','토'];

function formatTimeOnly(iso) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mi}`;
}

function formatDayLabel(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
}

// 앱의 SF Symbol 이름 → 웹에서 바로 그릴 수 있는 이모지. 앱에 새 카테고리가
// 추가돼서 목록에 없는 심볼이 오면 generic 아이콘으로 대체한다.
const SYMBOL_EMOJI = {
  'scissors': '✂️',
  'captions.bubble': '💬',
  'photo.on.rectangle': '🎞️',
  'text.badge.checkmark': '✅',
  'paintpalette': '🎨',
  'star.bubble': '⭐',
  'map': '🗺️',
  'music.note': '🎵',
  'checkmark.seal': '🔎',
  'text.below.photo': '🖼️',
  'flag': '🚩',
};

function categoryIcon(symbolName) {
  return SYMBOL_EMOJI[symbolName] || '🔧';
}

function statRow(label, value, sub) {
  if (value === null || value === undefined) return '';
  return `<div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

function renderSummary(cardEl, data) {
  const statusLabel = data.status === 'completed' ? '완료' : '진행중';
  const statusClass = data.status === 'completed' ? 'completed' : 'in_progress';

  let stats = '';
  stats += statRow('원본 영상 길이', normalizeLength(data.originalLength));
  stats += statRow(
    '정편집 후 영상 길이',
    normalizeLength(data.detailCutLength) ?? '—',
    data.detailCutRatio != null ? `원본 대비 ${Math.round(data.detailCutRatio)}%` : null
  );
  stats += statRow(
    '완성 영상 길이',
    normalizeLength(data.finalLength) ?? '—',
    data.finalRatioVsOriginal != null ? `원본 대비 ${Math.round(data.finalRatioVsOriginal)}%` : null
  );
  stats += statRow('작업 기록', data.entryCount != null ? `${data.entryCount}개` : null);

  cardEl.innerHTML = `
    <div class="topRow">
      <div>
        <div class="topic">${escapeHtml(data.projectTopic ?? '제목 없음')}</div>
        ${data.currentStage ? `<div class="stage">현재 단계 · ${escapeHtml(data.currentStage)}</div>` : ''}
      </div>
      <div class="badge ${statusClass}">${statusLabel}</div>
    </div>
    <div class="divider"></div>
    <div class="stats">${stats}</div>
    <div class="divider"></div>
    <div class="stat-sub">마지막 업데이트 · ${data.lastUpdate ? relativeTime(data.lastUpdate) : '알 수 없음'}</div>
  `;
}

function renderPipeline(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return;

  // allCategories is already in pipeline order (컷 편집 그룹 다음 후반 작업 그룹).
  // 가장 나중 단계까지 작업했으면 그 앞 단계들은 실제로 개별 기록이 없어도
  // 당연히 다 지나온 걸로 보고 체크 표시한다 — "BGM 삽입"까지 왔으면
  // "맞춤법 검사"도 이미 끝난 게 당연하니까.
  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => {
    if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i);
  });

  const groups = {};
  cats.forEach((c, i) => {
    (groups[c.group] = groups[c.group] || []).push({ name: c.name, index: i });
  });

  let html = '';
  for (const groupName of Object.keys(groups)) {
    const items = groups[groupName].map(c => {
      const isDone = c.index <= lastTouchedIndex;
      return `<div class="pipeline-item ${isDone ? 'done' : ''}"><span class="dot"></span>${escapeHtml(c.name)}</div>`;
    }).join('');
    html += `
      <div class="pipeline-group">
        <div class="pipeline-group-title">${escapeHtml(groupName)}</div>
        <div class="pipeline-list">${items}</div>
      </div>
    `;
  }

  document.getElementById('pipelineBody').innerHTML = html;
  document.getElementById('pipelineCard').style.display = '';
}

function renderLog(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  // 카테고리 정렬 기준 = 파이프라인 순서(allCategories). 카테고리가 없는
  // "체크포인트" 기록은 맨 뒤로 보낸다.
  const catOrder = {};
  (data.allCategories || []).forEach((c, i) => { catOrder[c.name] = i; });
  const noCategoryOrder = (data.allCategories || []).length;

  // 날짜(일 단위)로 묶는다 — 날짜는 오래된 날부터(작업 진행 순서대로 읽히도록),
  // 같은 날 안에서는 실제 시간이 아니라 파이프라인 단계 순서로 정렬한다.
  // 날짜는 그룹 헤더로 한 번만 보여주고, 각 행에는 시각만 표시한다.
  const byDay = new Map();
  for (const e of entries) {
    const key = new Date(e.timestamp).toDateString();
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  const sortedDayKeys = Array.from(byDay.keys()).sort((a, b) => new Date(a) - new Date(b));

  // 데스크톱: 앱과 동일한 4열 그리드. 모바일: 같은 데이터를 2줄 카드로.
  let html = `
    <div class="log-cell head">카테고리</div>
    <div class="log-cell head num">편집 시작 지점</div>
    <div class="log-cell head time">작업 시작 시간</div>
    <div class="log-cell head elapsed">이전 기록으로부터</div>
  `;

  for (const dayKey of sortedDayKeys) {
    const dayEntries = byDay.get(dayKey).slice();
    dayEntries.sort((a, b) => {
      const ai = a.category != null ? (catOrder[a.category] ?? noCategoryOrder) : noCategoryOrder;
      const bi = b.category != null ? (catOrder[b.category] ?? noCategoryOrder) : noCategoryOrder;
      return ai - bi;
    });

    html += `<div class="log-day-head">${formatDayLabel(dayEntries[0].timestamp)}</div>`;

    for (const e of dayEntries) {
      const catLabel = e.category ? escapeHtml(e.category) : '체크포인트';
      const catClass = e.category ? '' : 'none';
      const icon = categoryIcon(e.categorySymbol);
      const length = escapeHtml(normalizeLength(e.videoLength) ?? '');
      const time = formatTimeOnly(e.timestamp);
      const elapsed = escapeHtml(e.elapsed ?? '');

      html += `
        <div class="log-cell"><div class="log-category ${catClass}"><span class="icon">${icon}</span><span class="name">${catLabel}</span></div></div>
        <div class="log-cell num">${length}</div>
        <div class="log-cell time">${time}</div>
        <div class="log-cell elapsed">${elapsed}</div>
        <div class="log-entry">
          <div class="row1">
            <div class="log-category ${catClass}"><span class="icon">${icon}</span><span class="name">${catLabel}</span></div>
            <div class="num"><span class="m-label">편집 시작 지점</span>${length}</div>
          </div>
          <div class="row2">
            <div>${time}</div>
            <div>${elapsed ? `<span class="m-label">이전 기록으로부터</span>${elapsed}` : ''}</div>
          </div>
        </div>
      `;
    }
  }

  document.getElementById('logBody').innerHTML = html;
  document.getElementById('logCard').style.display = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

main();
</script>
</body>
</html>
