<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>태태고 편집실</title>
<style>
  :root {
    --bg-app: #eaf4ec;
    --bg-surface: #ffffff;
    --bg-surface-raised: #e2f1e5;
    --border: rgba(14,54,32,0.11);
    --border-strong: rgba(14,54,32,0.18);
    --text: #0e2116;
    --text-secondary: #40584a;
    --text-tertiary: #66806f;
    --accent: #15864f;
    --accent-strong: #0d5c37;
    --accent-soft: rgba(21,134,79,0.14);
    --accent-line: rgba(21,134,79,0.32);
    --progress: #a3690c;
    --progress-soft: rgba(163,105,12,0.15);
    --shadow-card: 0 1px 2px rgba(14,54,32,0.05), 0 12px 28px -14px rgba(14,54,32,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-app: #0d1611;
      --bg-surface: #131e17;
      --bg-surface-raised: #1b2820;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.15);
      --text: #edf4ef;
      --text-secondary: #a9bcae;
      --text-tertiary: #7c9084;
      --accent: #4fbf82;
      --accent-strong: #85e0ac;
      --accent-soft: rgba(79,191,130,0.16);
      --accent-line: rgba(79,191,130,0.35);
      --progress: #e0ac47;
      --progress-soft: rgba(224,172,71,0.16);
      --shadow-card: 0 1px 2px rgba(0,0,0,0.2), 0 10px 28px -14px rgba(0,0,0,0.5);
    }
  }
  html[data-theme="light"] {
    --bg-app: #eaf4ec;
    --bg-surface: #ffffff;
    --bg-surface-raised: #e2f1e5;
    --border: rgba(14,54,32,0.11);
    --border-strong: rgba(14,54,32,0.18);
    --text: #0e2116;
    --text-secondary: #40584a;
    --text-tertiary: #66806f;
    --accent: #15864f;
    --accent-strong: #0d5c37;
    --accent-soft: rgba(21,134,79,0.14);
    --accent-line: rgba(21,134,79,0.32);
    --progress: #a3690c;
    --progress-soft: rgba(163,105,12,0.15);
    --shadow-card: 0 1px 2px rgba(14,54,32,0.05), 0 12px 28px -14px rgba(14,54,32,0.16);
  }
  html[data-theme="dark"] {
    --bg-app: #0d1611;
    --bg-surface: #131e17;
    --bg-surface-raised: #1b2820;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #edf4ef;
    --text-secondary: #a9bcae;
    --text-tertiary: #7c9084;
    --accent: #4fbf82;
    --accent-strong: #85e0ac;
    --accent-soft: rgba(79,191,130,0.16);
    --accent-line: rgba(79,191,130,0.35);
    --progress: #e0ac47;
    --progress-soft: rgba(224,172,71,0.16);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.2), 0 10px 28px -14px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-app); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-app);
    background-image: radial-gradient(circle at 10% -6%, var(--accent-soft), transparent 45%),
      radial-gradient(circle at 100% 0%, var(--progress-soft), transparent 38%);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    padding: 36px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .page { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }

  .brandRow { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 2px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.02em; }
  .brand .mark {
    width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; font-size: 12px;
    box-shadow: 0 3px 8px -2px var(--accent-line);
  }
  .headerRight { display: flex; align-items: center; gap: 10px; }
  .infoWrap { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
  .infoBtn {
    width: 12px; height: 12px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--text-tertiary);
    font-size: 8px; font-weight: 700; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0;
  }
  .infoBtn:hover { color: var(--accent-strong); }
  .infoPopover {
    display: none; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 190px; z-index: 20;
    background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 12px;
    box-shadow: var(--shadow-card); font-size: 12px; line-height: 1.5; color: var(--text-secondary);
    white-space: normal; text-transform: none; font-weight: 400;
  }
  .infoPopover.open { display: block; }
  .themeToggle {
    display: flex; align-items: center; gap: 4px; background: var(--bg-surface-raised); border: 1px solid var(--border);
    border-radius: 99px; padding: 3px; cursor: pointer;
  }
  .themeToggle button {
    border: none; background: none; cursor: pointer; font-size: 13px; padding: 5px 9px; border-radius: 99px;
    color: var(--text-tertiary); line-height: 1;
  }
  .themeToggle button.active { background: var(--bg-surface); color: var(--accent-strong); box-shadow: var(--shadow-card); }
  .liveDot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--accent-strong); }
  .liveDot .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-soft);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,191,130,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(79,191,130,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,191,130,0); }
  }

  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-card); }
  .card-title { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 16px; }

  .topRow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .topic { font-size: 23px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; }
  .badge { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 99px; white-space: nowrap; }
  .badge.in_progress { background: var(--progress-soft); color: var(--progress); animation: labelFade 1.8s ease-in-out infinite; }
  .badge.completed { background: var(--accent-soft); color: var(--accent-strong); }
  .stage { font-size: 13.5px; color: var(--accent-strong); font-weight: 600; margin-top: 3px; }

  .progressWrap { margin-top: 16px; }
  .progressMeta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 6px; }
  .progressTrack { height: 6px; border-radius: 99px; background: var(--bg-surface-raised); overflow: hidden; }
  .progressFill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width 0.4s ease; }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; }
  .stat-tile { background: var(--bg-surface-raised); border-radius: 14px; padding: 12px 14px; }
  .stat-label { font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 5px; }
  .stat-value { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .lastUpdate { text-align: center; color: var(--text-tertiary); font-size: 12px; margin-top: 18px; }
  .empty { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 20px 0; }

  /* pipeline timeline */
  .pipeline-group + .pipeline-group { margin-top: 20px; }
  .pipeline-group-title { font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 12px; }
  .pipeline-list { display: flex; flex-direction: column; }
  .pipeline-item {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 0 8px 4px; font-size: 13.5px; font-weight: 600; color: var(--text-tertiary);
  }
  .pipeline-item::before {
    content: ""; position: absolute; left: 10px; top: -2px; bottom: -2px; width: 2px; background: var(--border);
  }
  .pipeline-item:first-child::before { top: 50%; }
  .pipeline-item:last-child::before { bottom: 50%; }
  .pipeline-dot {
    position: relative; z-index: 1; flex-shrink: 0; width: 21px; height: 21px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--bg-surface-raised); border: 2px solid var(--border-strong); font-size: 10px; color: transparent;
  }
  .pipeline-item.done .pipeline-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pipeline-item.current { color: var(--text); }
  .pipeline-item.current .pipeline-dot { background: var(--bg-surface); border-color: var(--progress); box-shadow: 0 0 0 4px var(--progress-soft); }
  .pipeline-item.current .pipeline-dot::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--progress);
    animation: ringPing 1.8s cubic-bezier(0,0,0.2,1) infinite;
  }
  @keyframes ringPing {
    0% { transform: scale(0.75); opacity: 0.9; }
    75%, 100% { transform: scale(1.9); opacity: 0; }
  }
  .pipeline-item.current .name::after {
    content: "진행 중"; margin-left: 8px; font-size: 10.5px; font-weight: 700; color: var(--progress); background: var(--progress-soft); padding: 2px 8px; border-radius: 99px;
    animation: labelFade 1.8s ease-in-out infinite;
  }
  @keyframes labelFade {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* work log */
  .log-head-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border-strong); }
  .log-head-row .cat-h { display: flex; align-items: center; gap: 3px; flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.03em; text-transform: uppercase; }
  .log-head-row .meta-h { display: flex; gap: 6px; flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.03em; text-transform: uppercase; }
  .log-head-row .meta-h span { position: relative; display: inline-flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; }
  .log-head-row .meta-h span:nth-child(1) { width: 68px; }
  .log-head-row .meta-h span:nth-child(2) { width: 60px; }
  .log-head-row .meta-h span:last-child { width: 80px; }
  .log-day-head { font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.02em; padding: 16px 0 8px; }
  .log-day-head:first-child { padding-top: 16px; }
  .log-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 0; border-top: 1px solid var(--border);
  }
  .log-row:first-of-type { border-top: none; }
  .log-cat { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
  .log-cat .icon {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .log-cat.none .icon { background: var(--bg-surface-raised); color: var(--text-tertiary); }
  .log-cat .name { font-size: 12.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-cat.none .name { color: var(--text-tertiary); font-weight: 500; }
  .log-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 11px; color: var(--text-secondary); }
  .log-meta .num { width: 60px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
  .log-meta .time { width: 50px; text-align: center; color: var(--text-tertiary); }
  .log-meta .elapsed { width: 80px; box-sizing: border-box; text-align: center; background: var(--bg-surface-raised); color: var(--text-tertiary); padding: 2px 6px; border-radius: 99px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 430px) {
    body { padding: 24px 12px 48px; }
    .card { padding: 18px; border-radius: 18px; }
    .topic { font-size: 20px; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="brandRow">
      <div class="brand"><span class="mark">🎬</span>태태고 편집실</div>
      <div class="headerRight">
        <div class="liveDot" id="liveDot" style="display:none"><span class="pulse"></span>실시간 업데이트</div>
        <div class="themeToggle" id="themeToggle">
          <button type="button" data-mode="light">☀️</button>
          <button type="button" data-mode="dark">🌙</button>
        </div>
      </div>
    </div>
    <div class="card" id="summaryCard">
      <div class="empty">불러오는 중…</div>
    </div>
    <div class="card" id="pipelineCard" style="display:none">
      <div class="card-title">전체 진행 단계</div>
      <div id="pipelineBody"></div>
    </div>
    <div class="card" id="statsCard" style="display:none">
      <div class="stats" id="statsBody"></div>
    </div>
    <div class="card" id="logCard" style="display:none">
      <div class="card-title">작업 기록</div>
      <div id="logBody"></div>
    </div>
  </div>

<script>
async function main() {
  const summaryCard = document.getElementById('summaryCard');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    const data = await res.json();
    renderSummary(summaryCard, data);
    renderPipeline(data);
    renderStats(data);
    renderLog(data);
    if (data.status !== 'completed') document.getElementById('liveDot').style.display = '';
  } catch (e) {
    summaryCard.innerHTML = '<div class="empty">아직 기록된 작업이 없어요</div>';
  }
}

function normalizeLength(s) {
  if (s === null || s === undefined || s === '') return null;
  const str = String(s);
  let totalMinutes;
  if (str.includes(':')) {
    const [h, m] = str.split(':').map(Number);
    totalMinutes = h * 60 + m;
  } else {
    totalMinutes = Number(str);
  }
  if (!Number.isFinite(totalMinutes)) return str;
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (hours > 0) parts.push(`${hours}시간`);
  if (minutes > 0 || parts.length === 0) parts.push(`${minutes}분`);
  return parts.join(' ');
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMin = Math.round((now - then) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  const diffDay = Math.round(diffHour / 24);
  return diffDay + '일 전';
}

const WEEKDAYS = ['일','월','화','수','목','금','토'];

function formatTimeOnly(iso) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mi}`;
}

function formatDayLabel(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
}

const SYMBOL_EMOJI = {
  'scissors': '✂️',
  'captions.bubble': '💬',
  'photo.on.rectangle': '🎞️',
  'text.badge.checkmark': '✅',
  'paintpalette': '🎨',
  'star.bubble': '⭐',
  'map': '🗺️',
  'music.note': '🎵',
  'checkmark.seal': '🔎',
  'text.below.photo': '🖼️',
  'flag': '🚩',
};

function categoryIcon(symbolName) {
  return SYMBOL_EMOJI[symbolName] || '🔧';
}

function statTile(label, value, sub) {
  if (value === null || value === undefined) return '';
  return `<div class="stat-tile"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

function pipelineProgress(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return null;
  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => { if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i); });
  const done = Math.max(lastTouchedIndex + 1, 0);
  return { done, total: cats.length, pct: Math.round((done / cats.length) * 100) };
}

function renderSummary(cardEl, data) {
  const statusLabel = data.status === 'completed' ? '완료' : '진행중';
  const statusClass = data.status === 'completed' ? 'completed' : 'in_progress';
  const progress = pipelineProgress(data);

  cardEl.innerHTML = `
    <div class="topRow">
      <div>
        <div class="topic">${escapeHtml(data.projectTopic ?? '제목 없음')}</div>
        ${data.currentStage ? `<div class="stage">현재 단계 · ${escapeHtml(data.currentStage)}</div>` : ''}
      </div>
      <div class="badge ${statusClass}">${statusLabel}</div>
    </div>
    ${progress ? `
      <div class="progressWrap">
        <div class="progressMeta"><span>편집 진행 상황</span><span>${progress.done}/${progress.total} 단계</span></div>
        <div class="progressTrack"><div class="progressFill" style="width:${progress.pct}%"></div></div>
      </div>` : ''}
    <div class="lastUpdate">마지막 작업 시작 시간 · ${data.lastUpdate ? relativeTime(data.lastUpdate) : '알 수 없음'}</div>
  `;
}

function renderStats(data) {
  let stats = '';
  stats += statTile('촬영 원본 길이', normalizeLength(data.originalLength));
  stats += statTile('컷편집 후 영상 길이', normalizeLength(data.detailCutLength) ?? '—', data.detailCutRatio != null ? `원본 대비 ${Math.round(data.detailCutRatio)}%` : null);
  const finalRatioParts = [];
  if (data.finalRatioVsOriginal != null) finalRatioParts.push(`원본 대비 ${Math.round(data.finalRatioVsOriginal)}%`);
  if (data.finalRatioVsDetailCut != null) finalRatioParts.push(`컷편집 대비 ${Math.round(data.finalRatioVsDetailCut)}%`);
  stats += statTile('완성 영상 길이', normalizeLength(data.finalLength) ?? '—', finalRatioParts.length ? finalRatioParts.join('<br>') : null);
  stats += statTile('작업 기록', data.entryCount != null ? `${data.entryCount}개` : null);

  document.getElementById('statsBody').innerHTML = stats;
  document.getElementById('statsCard').style.display = '';
}

function renderPipeline(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return;

  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => { if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i); });

  const groups = {};
  cats.forEach((c, i) => { (groups[c.group] = groups[c.group] || []).push({ name: c.name, index: i }); });

  let html = '';
  for (const groupName of Object.keys(groups)) {
    const items = groups[groupName].map(c => {
      const isDone = c.index < lastTouchedIndex || (c.index === lastTouchedIndex && data.status === 'completed');
      const isCurrent = c.index === lastTouchedIndex && data.status !== 'completed';
      const cls = isDone ? 'done' : (isCurrent ? 'current' : '');
      return `<div class="pipeline-item ${cls}"><span class="pipeline-dot">${isDone ? '✓' : ''}</span><span class="name">${escapeHtml(c.name)}</span></div>`;
    }).join('');
    html += `
      <div class="pipeline-group">
        <div class="pipeline-group-title">${escapeHtml(groupName)}</div>
        <div class="pipeline-list">${items}</div>
      </div>
    `;
  }

  document.getElementById('pipelineBody').innerHTML = html;
  document.getElementById('pipelineCard').style.display = '';
}

function renderLog(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  const catOrder = {};
  (data.allCategories || []).forEach((c, i) => { catOrder[c.name] = i; });
  const noCategoryOrder = (data.allCategories || []).length;

  const byDay = new Map();
  for (const e of entries) {
    const key = new Date(e.timestamp).toDateString();
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  const sortedDayKeys = Array.from(byDay.keys()).sort((a, b) => new Date(a) - new Date(b));

  let html = `
    <div class="log-head-row">
      <span class="cat-h">카테고리</span>
      <span class="meta-h">
        <span class="infoWrap">시작 시점
          <button type="button" class="infoBtn" aria-label="시작 시점 설명">ⓘ</button>
          <div class="infoPopover">이 작업을 시작했을 때 영상이 어디까지 편집되어 있었는지 (영상 길이 기준)</div>
        </span>
        <span class="infoWrap">시작 시간
          <button type="button" class="infoBtn" aria-label="시작 시간 설명">ⓘ</button>
          <div class="infoPopover">이 작업을 실제로 시작한 시각</div>
        </span>
        <span>이전 기록으로부터</span>
      </span>
    </div>
  `;
  for (const dayKey of sortedDayKeys) {
    const dayEntries = byDay.get(dayKey).slice();
    dayEntries.sort((a, b) => {
      const ai = a.category != null ? (catOrder[a.category] ?? noCategoryOrder) : noCategoryOrder;
      const bi = b.category != null ? (catOrder[b.category] ?? noCategoryOrder) : noCategoryOrder;
      return ai - bi;
    });

    html += `<div class="log-day-head">${formatDayLabel(dayEntries[0].timestamp)}</div>`;

    for (const e of dayEntries) {
      const catLabel = e.category ? escapeHtml(e.category) : '체크포인트';
      const catClass = e.category ? '' : 'none';
      const icon = categoryIcon(e.categorySymbol);
      const length = escapeHtml(normalizeLength(e.videoLength) ?? '');
      const time = formatTimeOnly(e.timestamp);
      const elapsed = escapeHtml(e.elapsed ?? '');

      html += `
        <div class="log-row">
          <div class="log-cat ${catClass}"><span class="icon">${icon}</span><span class="name">${catLabel}</span></div>
          <div class="log-meta">
            <span class="num">${length || '—'}</span>
            <span class="time">${time}</span>
            <span class="elapsed">${elapsed || '—'}</span>
          </div>
        </div>
      `;
    }
  }

  document.getElementById('logBody').innerHTML = html;
  document.getElementById('logCard').style.display = '';
  initInfoPopover();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  localStorage.setItem('theme', mode);
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  const mode = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(mode);
  document.getElementById('themeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) applyTheme(btn.dataset.mode);
  });
})();

function initInfoPopover() {
  document.querySelectorAll('.infoBtn').forEach((btn) => {
    const popover = btn.nextElementSibling;
    if (!popover) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = popover.classList.contains('open');
      document.querySelectorAll('.infoPopover.open').forEach((p) => p.classList.remove('open'));
      if (!wasOpen) popover.classList.add('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.infoWrap')) {
      document.querySelectorAll('.infoPopover.open').forEach((p) => p.classList.remove('open'));
    }
  });
}

main();
</script>
</body>
</html>
