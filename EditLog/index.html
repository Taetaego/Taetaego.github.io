/** 아직 안 한 단계를 누르면 흔들리며 여행 문구를 하나 보여준다. */
function initTodoPoke() {
  const body = document.getElementById('pipelineBody');
  if (!body) return;

  // 완료된 단계는 체크가 한 번 더 찍히는 느낌만 준다.
  body.addEventListener('click', (ev) => {
    const dot = ev.target.closest('.pipeItem.done')?.querySelector('.dot');
    if (!dot) return;
    sfx('tick');
    if (reducedMotion) return;
    dot.classList.remove('rechecked');
    void dot.offsetWidth;
    dot.classList.add('rechecked');
  });

  // 끝낸 단계에도 한마디 — 회고조 문구가 많아 완료 쪽에도 잘 맞는다.
  // (진행 중인 단계는 이름 옆 '편집 중' 표시와 겹쳐서 뺀다.)
  body.addEventListener('click', (ev) => {
    const item = ev.target.closest('.pipeItem.todo, .pipeItem.done');
    if (!item) return;
    if (item.classList.contains('todo')) sfx('boing');

    const name = item.querySelector('.name');
    let bubble = item.querySelector('.poke');
    if (!bubble) {
      bubble = document.createElement('span');
      bubble.className = 'poke';
      name.after(bubble);
    }
    bubble.textContent = TRAVEL_LINES[Math.floor(Math.random() * TRAVEL_LINES.length)];

    // 흔들림은 WAAPI로 준다. CSS animation으로 하면 등장 애니메이션(stepIn)의
    // animation 속성을 덮어써서, 흔들림이 끝난 뒤 항목이 사라져 버린다.
    item.getAnimations().filter(a => a.id === 'shake').forEach(a => a.cancel());
    const shake = item.animate([
      { transform: 'translateX(0)' }, { transform: 'translateX(-3px)' },
      { transform: 'translateX(3px)' }, { transform: 'translateX(-2px)' },
      { transform: 'translateX(2px)' }, { transform: 'translateX(0)' },
    ], { duration: 400, easing: 'ease' });
    shake.id = 'shake';

    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
  });
}

/** 0시~24시 하늘 그라데이션 위에 세션 시각을 점으로 찍는다.
    여러 날의 기록이 한 축에 겹치므로 "몇 시에 일하는 사람인지"가 드러난다. */
let dayNightPct = null;   // 해 진 뒤 시작한 기록 비율 — 머리글 '밤 작업 %'와 같은 값으로 유형 뱃지를 붙인다

function renderDayBand(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;
  const band = document.getElementById('dayBand');
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // 30분 간격으로 진짜 하늘색을 뽑아 잇는다 (자정 넘어가는 처리 없이 매끄럽다).
  const stops = [];
  for (let m = 0; m <= 1440; m += 30) {
    const t = new Date(base.getTime() + m * 60000);
    stops.push(`${sunTint(t.toISOString(), SKY_TRUE).color} ${(m / 14.4).toFixed(2)}%`);
  }
  band.style.background = `linear-gradient(90deg, ${stops.join(',')})`;

  const frac = (d) => (d.getHours() * 60 + d.getMinutes()) / 1440;
  // 프로젝트를 바꾸면 이 함수가 다시 불린다 — 앞 프로젝트의 점을 먼저 치워야
  // 새 점이 그 위에 얹혀 두 프로젝트가 섞인 채로 보이지 않는다.
  band.querySelectorAll('.daySpot').forEach(el => el.remove());
  band.insertAdjacentHTML('beforeend', entries.map((e, i) => {
    const d = new Date(e.timestamp);
    const label = `${e.category || '체크포인트'} · ${formatTimeOnly(e.timestamp)}`;
    return `<span class="daySpot" style="left:${(frac(d) * 100).toFixed(2)}%;animation-delay:${i * 45}ms" title="${escapeHtml(label)}"></span>`;
  }).join(''));

  // 해가 진 뒤~뜨기 전에 시작한 기록의 비율
  let night = 0;
  for (const e of entries) {
    const d = new Date(e.timestamp);
    const { at } = solarDay(d, SITE_LAT, SITE_LON);
    const rise = at(-0.833, true), set = at(-0.833, false);
    if (rise === null || set === null) continue;
    if (d.getTime() < rise || d.getTime() >= set) night++;
  }
  document.getElementById('dayMeta').textContent = `밤 작업 ${Math.round(night / entries.length * 100)}%`;
  dayNightPct = Math.round(night / entries.length * 100);

  updateDayNow();
  document.getElementById('dayCard').style.display = '';
}

/** 제목(태태고 편집실)을 누르면 슬레이트가 내려와 막대를 치고 사라진다.
    SCENE은 에피소드 번호, TAKE는 누를 때마다 하나씩 올라간다(이 기기에만 저장). */
function initSlate() {
  const brand = document.querySelector('.brand');
  if (!brand) return;
  brand.style.cursor = 'pointer';
  brand.addEventListener('click', () => {
    if (document.querySelector('.slate')) return;
    let take = 1;
    try { take = Number(localStorage.getItem('slateTake') || 0) + 1; localStorage.setItem('slateTake', String(take)); } catch (e) {}
    const scene = heatData && heatData.episodes ? heatData.episodes : 1;
    const d = new Date();
    const date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    const el = document.createElement('div');
    el.className = 'slate';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `
      <div class="slateStick"></div>
      <div class="slateBody mono">
        <div class="slateTitle">태태고 편집실</div>
        <div class="slateGrid">
          <span><i>SCENE</i>${String(scene).padStart(2, '0')}</span>
          <span><i>TAKE</i>${take}</span>
          <span><i>ROLL</i>${date}</span>
        </div>
      </div>`;
    document.body.appendChild(el);
    if (reducedMotion) { setTimeout(() => el.remove(), 1200); return; }
    const stick = el.querySelector('.slateStick');
    el.animate([
      { transform: 'translate(-50%, -140%) rotate(-8deg)' },
      { transform: 'translate(-50%, 0) rotate(2deg)', offset: 0.75 },
      { transform: 'translate(-50%, 0) rotate(0deg)' },
    ], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' });
    stick.animate([{ transform: 'rotate(-26deg)' }, { transform: 'rotate(-30deg)', offset: 0.85 }, { transform: 'rotate(0deg)' }],
      { duration: 620, delay: 380, easing: 'cubic-bezier(.7,0,1,.5)', fill: 'both' });
    setTimeout(() => {
      // 막대가 닫히는 순간 화면이 한 번 하얗게 번쩍이고 슬레이트가 떨린다.
      sfx('clap');
      const flash = document.createElement('div');
      flash.className = 'slateFlash';
      document.body.appendChild(flash);
      flash.animate([{ opacity: 0.32 }, { opacity: 0 }], { duration: 320, easing: 'ease-out' }).onfinish = () => flash.remove();
      el.animate([
        { transform: 'translate(-50%, 0) rotate(0)' }, { transform: 'translate(calc(-50% - 4px), 3px) rotate(-1.5deg)' },
        { transform: 'translate(calc(-50% + 3px), -2px) rotate(1deg)' }, { transform: 'translate(-50%, 0) rotate(0)' },
      ], { duration: 220, composite: 'replace' });
    }, 1000);
    setTimeout(() => {
      el.animate([
        { transform: 'translate(-50%, 0) rotate(0)', opacity: 1 },
        { transform: 'translate(-50%, 60px) rotate(6deg)', opacity: 0 },
      ], { duration: 380, easing: 'ease-in', fill: 'forwards' }).onfinish = () => el.remove();
    }, 1900);
  });
}

/** 작업 기록의 날짜 줄을 누르면 그날 행들이 VHS 테이프처럼 ◀◀ 되감겼다가 ▶ 다시 재생된다. */
function initRewind() {
  const body = document.getElementById('logBody');
  if (!body) return;
  body.addEventListener('click', (ev) => {
    const day = ev.target.closest('.logDay');
    if (!day || day._rewinding) return;
    const rows = [];
    for (let n = day.nextElementSibling; n && !n.classList.contains('logDay'); n = n.nextElementSibling) {
      if (n.classList.contains('logRow')) rows.push(n);
    }
    if (!rows.length) return;
    day._rewinding = true;
    const badge = document.createElement('span');
    badge.className = 'vhsBadge mono';
    badge.textContent = '◀◀ REW';
    day.appendChild(badge);
    if (reducedMotion) { setTimeout(() => { badge.remove(); day._rewinding = false; }, 900); return; }
    const STEP = 70;
    sfx('rewind', (rows.length * STEP + 420) / 1000);
    // 되감기니까 아래 행부터 위로 거슬러 올라간다.
    rows.slice().reverse().forEach((row, i) => {
      row.animate([
        { transform: 'none', filter: 'none', opacity: 1 },
        { transform: 'translateX(-22px) skewX(10deg)', filter: 'blur(1px) saturate(2.4) hue-rotate(60deg)', opacity: 0.45, offset: 0.35 },
        { transform: 'translateX(6px) skewX(-4deg)', filter: 'saturate(1.6) hue-rotate(-30deg)', opacity: 0.8, offset: 0.7 },
        { transform: 'none', filter: 'none', opacity: 1 },
      ], { duration: 420, delay: i * STEP, easing: 'steps(6, end)' });
    });
    const total = rows.length * STEP + 420;
    setTimeout(() => {
      badge.textContent = '▶ PLAY';
      sfx('play');
      badge.classList.add('play');
      rows.forEach((row, i) => {
        row.animate([{ opacity: 0.3, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }],
          { duration: 260, delay: i * 40, easing: 'ease-out', fill: 'backwards' });
      });
    }, total);
    setTimeout(() => { badge.remove(); day._rewinding = false; }, total + 1100);
  });
}

/** 작업 기록 행을 누르면 그 행이 한 번 번쩍인다. */
function initRowPulse() {
  const body = document.getElementById('logBody');
  if (!body) return;
  body.addEventListener('click', (ev) => {
    const row = ev.target.closest('.logRow');
    if (!row) return;
    sfx('tap');
    if (reducedMotion) return;
    row.classList.remove('pulsed');
    void row.offsetWidth;
    row.classList.add('pulsed');
  });
}

/** 카드를 누르면 카드는 그대로 두고 안의 점들만 다시 튀어오르게 한다. */
function initDayBandReplay() {
  const card = document.getElementById('dayCard');
  if (!card) return;
  card.addEventListener('click', () => {
    if (reducedMotion) return;
    const spots = [...card.querySelectorAll('.daySpot')];
    // 애니메이션을 껐다 켜면서 리플로우를 강제해야 처음부터 다시 돈다.
    spots.forEach(s => { s.style.animation = 'none'; });
    void card.offsetWidth;
    spots.forEach((s, i) => {
      s.style.animation = '';
      s.style.animationDelay = `${i * 45}ms`;
    });
    daySweep(card);
  });
}

/** 해·달이 0시에서 24시까지 띠 위를 호를 그리며 건너가고, 다 건너면 편집자 유형 뱃지가 뜬다. */
function daySweep(card) {
  const band = document.getElementById('dayBand');
  if (!band || card._sweeping) return;
  card._sweeping = true;
  sfx('whoosh');
  const DUR = 1700;
  const orb = document.createElement('span');
  orb.className = 'daySweeper';
  orb.textContent = '🌙';
  band.appendChild(orb);
  const frames = [];
  for (let k = 0; k <= 24; k++) {
    const f = k / 24;
    // 낮(6~19시)엔 위로 떠오르고, 밤엔 띠에 붙어 지나간다.
    const lift = f > 0.25 && f < 0.79 ? Math.sin((f - 0.25) / 0.54 * Math.PI) * 26 : 0;
    frames.push({ left: `${f * 100}%`, transform: `translate(-50%, calc(-50% - ${lift.toFixed(1)}px))`, offset: f });
  }
  frames[0].opacity = 0; frames[1].opacity = 1; frames[23].opacity = 1; frames[24].opacity = 0;
  orb.animate(frames, { duration: DUR, easing: 'linear', fill: 'forwards' });
  [[0.25, '☀️'], [0.79, '🌙']].forEach(([f, e]) => setTimeout(() => { orb.textContent = e; }, DUR * f));

  setTimeout(() => {
    orb.remove();
    const b = dayTypeBadge();
    if (b) {
      card.querySelectorAll('.dayType').forEach(x => x.remove());
      const el = document.createElement('span');
      el.className = 'dayType';
      sfx('chime');
      el.textContent = b;
      card.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }
    card._sweeping = false;
  }, DUR);
}

/** 머리글의 '밤 작업 %'(해 뜨고 지는 시각 기준)로 편집자 유형을 붙인다 — 두 곳이 어긋나지 않게. */
function dayTypeBadge() {
  if (dayNightPct === null) return null;
  const n = dayNightPct;
  if (n >= 60) return `🦉 올빼미형 편집자 · 밤 작업 ${n}%`;
  if (n > 40) return `🌗 밤낮 없는 편집자 · 밤 작업 ${n}%`;
  return `☀️ 햇살형 편집자 · 낮 작업 ${100 - n}%`;
}

/** 띠 위의 '지금' 표식을 현재 시각으로 옮긴다. */
function updateDayNow() {
  const marker = document.getElementById('dayNow');
  if (!marker) return;
  const now = new Date();
  marker.style.left = (((now.getHours() * 60 + now.getMinutes()) / 1440) * 100).toFixed(2) + '%';
  marker.title = `지금 · ${formatTimeOnly(now.toISOString())}`;
}

function renderLog(data) {
  const entries = data.entries || [];
  if (entries.length === 0) return;

  // 카테고리별 "시작 시점 기록" 여부. 예전 스냅샷엔 이 값이 없으므로 그때는 전부 기록으로 본다.
  const tracksByCat = {};
  (data.allCategories || []).forEach(c => { tracksByCat[c.name] = c.tracksLength !== false; });
  const tracksLength = (name) => tracksByCat[name] !== false;

  const catOrder = {};
  (data.allCategories || []).forEach((c, i) => { catOrder[c.name] = i; });
  const noCategoryOrder = (data.allCategories || []).length;

  const rowColorVar = makeGroupColorVar(data);

  const byDay = new Map();
  for (const e of entries) {
    const key = new Date(e.timestamp).toDateString();
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  const sortedDayKeys = Array.from(byDay.keys()).sort((a, b) => new Date(a) - new Date(b));

  // 메모가 하나도 없으면 열 자체를 접으므로 머리글도 같이 뺀다 (0폭에 글자만 남아 뭉개지지 않게).
  const hasMemo = entries.some(e => (e.memo ?? '').trim());

  let html = `
    <div class="logHead">
      <span>카테고리</span>
      <span class="c"><span class="lbl">시작 시점<button type="button" class="infoBtn" aria-label="시작 시점 설명">ⓘ</button><div class="infoPopover">이 작업을 시작했을 때 영상이 어디까지<br>편집되어 있었는지 (영상 길이 기준)</div></span></span>
      <span class="c"><span class="lbl">시작 시간<button type="button" class="infoBtn" aria-label="시작 시간 설명">ⓘ</button><div class="infoPopover">이 작업을 실제로 시작한 시각</div></span></span>
      <span class="c"><span class="lg">이전 기록<br>으로부터</span><span class="sm">간격</span></span>
      ${hasMemo ? '<span class="c memoHead">메모</span>' : '<span></span>'}
    </div>
  `;
  let rowIndex = 0;
  // 편집 중인 회차의 가장 최근 기록 — '지금 여기'라고 맥박이 뛴다.
  const latestTs = data.status === 'completed' ? null
    : entries.reduce((m, e) => (m === null || new Date(e.timestamp) > new Date(m) ? e.timestamp : m), null);
  for (const dayKey of sortedDayKeys) {
    const dayEntries = byDay.get(dayKey).slice();
    dayEntries.sort((a, b) => {
      const ai = a.category != null ? (catOrder[a.category] ?? noCategoryOrder) : noCategoryOrder;
      const bi = b.category != null ? (catOrder[b.category] ?? noCategoryOrder) : noCategoryOrder;
      return ai - bi;
    });

    // 그날 요약 — 기록 몇 개를, 몇 시부터 몇 시까지 했는지.
    const ts = dayEntries.map(e => new Date(e.timestamp).getTime());
    const t0 = new Date(Math.min(...ts)).toISOString(), t1 = new Date(Math.max(...ts)).toISOString();
    const span = dayEntries.length > 1 ? ` · ${formatTimeOnly(t0)} ~ ${formatTimeOnly(t1)}` : '';
    html += `<div class="logDay">${formatDayLabel(dayEntries[0].timestamp)}<span class="logDaySum">기록 ${dayEntries.length}개${escapeHtml(span)}</span></div>`;

    for (const e of dayEntries) {
      const catLabel = e.category ? escapeHtml(e.category) : '체크포인트';
      const isDone = e.category === '완료';
      const catIcon = categorySvg(entryIconName(e.category, e.categorySymbol));
      // 시작 시점을 안 쓰는 단계(앱 카테고리 설정에서 끔)는 값이 있어도 —로 둔다.
      const length = tracksLength(e.category) ? escapeHtml(normalizeLength(e.videoLength) ?? '') : '';
      const time = formatTimeOnly(e.timestamp);
      const elapsed = escapeHtml(e.elapsed ?? '');
      const memo = (e.memo ?? '').trim();
      // 메모가 있을 때만 아이콘을 두고, 누르면 그 자리에 말풍선으로 펼친다.
      const memoCell = memo
        ? `<span class="memo"><button type="button" class="memoBtn" aria-label="메모 보기">${MEMO_SVG}</button><div class="memoPopover">${escapeHtml(memo)}</div></span>`
        : '<span class="memo"></span>';

      html += `
        <div class="logRow${isDone ? ' done' : ''}${e.timestamp === latestTs ? ' latest' : ''}" style="${rowColorVar(e.category)}--r:${rowIndex++}">
          <span class="cat"><span class="catIcon">${catIcon}</span><span class="catName">${catLabel}</span></span>
          <span class="at">${length || '-'}</span>
          <span class="time mono" data-ts="${escapeHtml(e.timestamp)}">${time}</span>
          <span class="gap">${elapsed || '-'}</span>
          ${memoCell}
        </div>
      `;
    }
  }
  const logBody = document.getElementById('logBody');
  logBody.innerHTML = html;
  // 메모가 하나도 없으면 열을 0으로 접는다 — 좁은 화면에서 카테고리 이름 자리를 뺏지 않게.
  logBody.style.setProperty('--memoCol', hasMemo ? '20px' : '0px');
  document.getElementById('logMeta').textContent = `${entries.length}개`;
  document.getElementById('logCard').style.display = '';
  initInfoPopover();
  initMemoPopover();
  paintTimes();
}

/** 메모 아이콘 (작업 기록 표의 카테고리 아이콘과 같은 선 스타일). */
const MEMO_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 3.6h13a1 1 0 0 1 1 1v11.2l-4.6 4.6H5.5a1 1 0 0 1-1-1V4.6a1 1 0 0 1 1-1z"/><path d="M19.4 15.7h-4.5v4.6"/><path d="M8 8.4h8M8 12h5.5"/></svg>';

/** 메모 아이콘을 누르면 그 자리에 말풍선으로 펼친다 (한 번에 하나만 열린다). */

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ===== 강조색 =====
   예전엔 하이라이트 색을 고를 수 있었는데, 이제 앱과 같은 그라데이션(단계 그룹 색
   민트 → 하늘 → 보라 → 분홍) 하나로 간다. 예전에 골라 둔 값은 지워 둔다. */
try { localStorage.removeItem('accent'); } catch (e) {}

function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  try { localStorage.setItem('theme', mode); } catch (e) {}
  // 캔버스 이펙트가 새 테마의 --accent를 바로 쓰게 캐시를 버린다 (선언보다 먼저 불릴 수 있어 방어).
  if (typeof _accCache === 'object' && _accCache) _accCache.t = -1e9;
  // 시작 시간 색은 테마별로 대비를 맞춰둔 값이라 테마가 바뀌면 다시 칠해야 한다.
  paintTimes();
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved || 'dark');
  document.getElementById('themeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) { sfx('tap'); applyTheme(btn.dataset.mode); }
  });
})();

/* ===== 폭죽 (완료된 프로젝트일 때만) ===== */
/** #rrggbb -> 색상환 각도(0~360). 폭죽 색을 지금 고른 하이라이트 색에 맞추는 데 쓴다. */
function hexToHue(hex) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return 160;
  const n = parseInt(m[1], 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (d === 0) return 0;
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h *= 60;
  return h < 0 ? h + 360 : h;
}
/** 지금 하이라이트 색을 중심으로 한 폭죽 색 팔레트 (매번 새로 뽑아 accent 변경에 바로 반응). */
function fxHues() {
  const base = hexToHue(accentColor());
  return [base - 48, base - 24, base, base, base + 24, base + 48].map(h => ((h % 360) + 360) % 360);
}
let fx = null;
let fxTimer = null;

function initFx() {
  if (fx) return fx;
  const cv = document.getElementById('fxCanvas');
  if (!cv) return null;
  const ctx = cv.getContext('2d');
  fx = { cv, ctx, ps: [], rs: [], ms: [], t: null, w: 0, h: 0 };

  fx.sizeFn = () => {
    const dpr = canvasDPR();
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.max(1, w * dpr);
    cv.height = Math.max(1, h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fx.w = w; fx.h = h;
  };
  fx.sizeFn();
  window.addEventListener('resize', fx.sizeFn);

  fx.boom = (x, y, big) => {
    const n = big ? 130 : 80;
    const hues = fxHues();
    const hue = hues[Math.floor(Math.random() * hues.length)];
    const hue2 = Math.random() < 0.35 ? hues[Math.floor(Math.random() * hues.length)] : hue;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.25;
      const sp = (big ? 4.8 : 3.4) * (0.35 + Math.random() * 0.65);
      const h = (i % 2 === 0 ? hue : hue2) + Math.random() * 18 - 9;
      fx.ps.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: 0.0042 + Math.random() * 0.0046, hue: h, r: big ? 2.6 : 2.0, tw: Math.random() < 0.45 ? 6 + Math.random() * 7 : 0, ph: Math.random() * 6.28, t: 0 });
    }
    for (let i = 0; i < (big ? 22 : 12); i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 0.9;
      fx.ps.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: 0.0036 + Math.random() * 0.004, hue: 48 + Math.random() * 12, r: 1.6, tw: 9, ph: Math.random() * 6.28, t: 0 });
    }
    if (big) {
      [420, 780].forEach(t => setTimeout(() => {
        fx.boom(x + (Math.random() - 0.5) * 140, y + (Math.random() - 0.5) * 100, false);
        fx.kick();
      }, t));
    }
  };

  fx.rocket = () => {
    const page = document.querySelector('.page');
    const r = page ? page.getBoundingClientRect() : null;
    const cx = r ? r.left + r.width / 2 : fx.w / 2;
    const half = r ? Math.min(fx.w * 0.48, r.width * 0.75) : fx.w * 0.4;
    const x = Math.max(12, Math.min(fx.w - 12, cx + (Math.random() * 2 - 1) * half));
    fx.rs.push({ x, y: fx.h + 8, vx: (Math.random() - 0.5) * 1.0, vy: -(7.4 + Math.random() * 1.8), ty: fx.h * (0.1 + Math.random() * 0.24) });
  };

  const step = () => {
    ctx.clearRect(0, 0, fx.w, fx.h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = fx.rs.length - 1; i >= 0; i--) {
      const r = fx.rs[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.055;
      ctx.strokeStyle = hexAlpha(accentColor(), 0.9);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 2.6, r.y - r.vy * 2.6); ctx.stroke();
      if (r.vy > -1.6 || r.y <= r.ty) { fx.rs.splice(i, 1); fx.boom(r.x, r.y, Math.random() < 0.55); }
    }
    for (let i = fx.ps.length - 1; i >= 0; i--) {
      const p = fx.ps[i];
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.966; p.vy = p.vy * 0.966 + 0.022;
      p.life -= p.dec;
      p.t += 1;
      if (p.life <= 0) { fx.ps.splice(i, 1); continue; }
      const flick = p.tw ? (0.62 + 0.38 * Math.sin(p.t / p.tw * 6.28 + p.ph)) : 1;
      ctx.strokeStyle = 'hsla(' + p.hue + ',90%,' + (52 + p.life * 26) + '%,' + (p.life * flick) + ')';
      ctx.lineWidth = p.r * p.life + 0.4;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    // 별똥별: 꼬리를 끌며 사선으로 스쳐 지나간다.
    // 꼬리 길이는 vx*tail이라 1400~1800px까지 나온다. 그래서 머리가 화면을 벗어난 걸로
    // 지우면 아직 화면을 가로지르고 있는 꼬리째 사라져 버린다 — 꼬리 끝까지 나간 뒤에 지운다.
    for (let i = fx.ms.length - 1; i >= 0; i--) {
      const m = fx.ms[i];
      m.x += m.vx; m.y += m.vy;
      const tailX = m.x - m.vx * m.tail, tailY = m.y - m.vy * m.tail;
      if (tailX > fx.w || tailY > fx.h) { fx.ms.splice(i, 1); continue; }
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * m.tail, m.y - m.vy * m.tail);
      g.addColorStop(0, 'rgba(255,255,245,0.9)');
      g.addColorStop(0.22, 'rgba(205,226,255,0.55)');
      g.addColorStop(0.5, 'rgba(190,215,255,0.28)');
      g.addColorStop(0.78, 'rgba(180,205,255,0.12)');
      g.addColorStop(1, 'rgba(190,215,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = m.w;
      ctx.beginPath(); ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * m.tail, m.y - m.vy * m.tail); ctx.stroke();
    }
    if (fx.ps.length || fx.rs.length || fx.ms.length) fx.t = requestAnimationFrame(step);
    else { fx.t = null; ctx.clearRect(0, 0, fx.w, fx.h); }
  };
  fx.meteor = () => {
    const speed = 19 + Math.random() * 10;
    // 좁은 화면에선 완만한 사선이 오른쪽 모서리로 바로 빠져나가 안 보인다 → 각도를 세운다.
    const narrow = fx.w < 620;
    // 좁은 화면은 살짝만 세워 사선을 유지한다 (너무 세우면 빗줄기처럼 보인다).
    const angle = (narrow ? 34 + Math.random() * 12 : 24 + Math.random() * 14) * Math.PI / 180;
    fx.ms.push({
      x: Math.random() * fx.w * (narrow ? 1.0 : 0.75) - fx.w * (narrow ? 0.3 : 0.12),
      y: -30 - Math.random() * (narrow ? 30 : 60),
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      tail: 48 + Math.random() * 24, w: 1.7 + Math.random() * 1.2,
    });
  };
  fx.kick = () => { if (!fx.t) fx.t = requestAnimationFrame(step); };
  return fx;
}

function startAmbientFireworks() {
  if (fxTimer || reducedMotion) return;
  // 완료 축하는 8초쯤 이어지다 스스로 멈춘다 (히어로 카드를 다시 누르면 또 8초).
  const until = performance.now() + 8000;
  fxTimer = setInterval(() => {
    if (performance.now() >= until) { clearInterval(fxTimer); fxTimer = null; return; }
    if (document.hidden) return;
    const f = initFx();
    if (!f) return;
    f.rocket(); f.kick();
    setTimeout(() => { f.rocket(); f.kick(); }, 500 + Math.random() * 500);
    if (Math.random() < 0.6) setTimeout(() => { f.rocket(); f.kick(); }, 1300 + Math.random() * 500);
  }, 2800);
}

/** 진행률(%)에 맞춰 반짝이는 점의 각도를 맞춘다. 0에 가까우면 숨긴다. */
function setSparkAngle(pct) {
  const spark = document.getElementById('donutSpark');
  if (!spark) return;
  spark.style.setProperty('--spark', (pct * 3.6).toFixed(2) + 'deg');
  // 다 채워지면 점이 12시 틈의 왼쪽 절반에 얹혀 틈이 오른쪽으로 밀린 것처럼 보인다.
  // 어차피 '지금 어디까지 왔는지' 표시라 100%에서는 할 일이 없다.
  spark.style.display = (pct > 2 && pct < 99.5) ? '' : 'none';
}

/** keepNumber를 주면 링만 0%에서 다시 채우고 가운데 숫자는 최종값 그대로 둔다. */
function runGauge(target, fire, keepNumber = false) {
  const el = document.getElementById('donutPct');
  const dn = document.getElementById('donutGauge');
  if (!el || !dn) return;
  if (reducedMotion) {
    el.textContent = target + '%';
    dn.style.background = donutRing(target);
    setSparkAngle(target);
    return;
  }
  if (keepNumber) el.textContent = target + '%';
  const t0 = performance.now(), dur = 1500;
  let fired = false;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const p = e * target;
    if (!keepNumber) el.textContent = Math.round(p) + '%';
    dn.style.background = donutRing(p);
    // 반짝이는 점을 게이지가 끝나는 각도에 붙여 같이 돌린다 (100% = 360도).
    setSparkAngle(p);
    // 숫자가 끝값(100%)을 찍은 뒤 한 박자(0.28초) 두고 터뜨린다 — 애니메이션이 완전히
    // 끝날 때까지(0.25초 더 기어간다) 기다리면 늦고, 찍는 순간 바로면 너무 붙는다.
    if (fire && !fired && Math.round(p) >= target) {
      fired = true;
      setTimeout(() => {
        const f = initFx();
        if (!f) return;
        const r = dn.getBoundingClientRect();
        f.boom(r.left + r.width / 2, r.top + r.height / 2, true);
        f.kick();
      }, 280);
    }
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function initAmbientLayers() {

/** 카드에 마우스를 올리면 커서 위치를 따라 살짝 기울어진다 (PC 전용). */

function initCardTilt() {

    ...['summaryCard', 'pipelineCard', 'dayCard', 'heatCard', 'logCard']
      .map(id => document.getElementById(id)).filter(Boolean),

/** 지금이 해가 진 뒤인지. */
function isNightNow() {
  const now = new Date();
  const { at } = solarDay(now, SITE_LAT, SITE_LON);
  const rise = at(-0.833, true), set = at(-0.833, false);
  if (rise === null || set === null) return false;
  const t = now.getTime();
  return t < rise || t >= set;
}

/** 누를 때마다 폭죽 하나씩 (프로젝트 완료 여부와 무관). */

}

function celebrate(targetPct, isCompleted, allowFireworks = true) {
  const fire = !reducedMotion && isCompleted && allowFireworks;
  if (fire) {
    const f = initFx();
    // 처음 축포는 너무 몰아치지 않게 — 12발에서 7발로 줄이고 간격도 살짝 넓혔다.
    if (f) [0, 400, 900, 1500, 2200, 3000, 3900].forEach(d => setTimeout(() => { f.rocket(); f.kick(); }, d));
    startAmbientFireworks();
  }
  runGauge(targetPct, fire);
}

/* ==========================================================================
   추가 이펙트 (04 스포트라이트 · 09 별자리 · 10 리퀴드 게이지 · 15 영사기
   17 작업 잔디 · 27 스플라이스 등장 · 29 텔레타이프 · 31 하늘 배경
   32 혜성 커서 · 버튼 이펙트 8종)
   ========================================================================== */

/** 캔버스 실제 크기를 매 프레임 맞춘다 (레이아웃 전 0 측정·리사이즈 대응). */
  // 전부 장식용 레이어라 화면 배율까지 따라갈 필요가 없다. 폰에서는 1로 고정해
  // 백킹 스토어를 1/4로 줄인다 — 전체 화면 캔버스가 여러 장 겹쳐 있어서, 이게 쌓이면
  // GPU가 다른 레이어(카드 배경·도넛·상단 바)를 버리고 안 그려버리는 일이 생긴다.
  function canvasDPR() {
    const cap = matchMedia('(max-width: 560px)').matches ? 1 : 2;
    return Math.min(cap, window.devicePixelRatio || 1);
  }

function fitCanvas(cv) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return null;
  const dpr = canvasDPR();
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w, h, ctx };
}

/** 테마가 바뀌어도 따라오도록 --accent 값을 0.5초 캐시로 읽는다. */
var _accCache = { t: -1e9, v: '#34e0b0' };
function accentColor() {
  const now = performance.now();
  if (now - _accCache.t > 500) {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    _accCache = { t: now, v: v || '#34e0b0' };
  }
  return _accCache.v;
}

/* ===== 04 커서 스포트라이트 ===== */
/** #rrggbb -> rgba() (캔버스 그라디언트는 color-mix를 못 읽는다) */
function hexAlpha(hex, a) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function initSpotlight() {
  if (reducedMotion || !matchMedia('(hover: hover)').matches) return;
  document.querySelectorAll('.card, .statTile').forEach((card) => {
    if (card._spotLayer) return;

    layer.setAttribute('aria-hidden', 'true');
    card.appendChild(layer);

    card.addEventListener('pointermove', (ev) => {

      layer.style.opacity = '1';
      layer.style.background = `radial-gradient(220px circle at ${ev.clientX - r.left}px ${ev.clientY - r.top}px,` +
        ` color-mix(in srgb, ${accentColor()} 16%, transparent), transparent 70%)`;
    });
    card.addEventListener('pointerleave', () => { layer.style.opacity = '0'; });
  });
}

/* ===== 10 리퀴드 진행률 — 버튼으로 도넛 ↔ 물결 전환 ===== */
let liquidRun = 0;
function initGaugeToggle() {
  initLiquidRefill();
  const btn = document.getElementById('gaugeSwap');
  const donut = document.getElementById('donutGauge');
  if (!btn || !donut) return;
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();   // 히어로 카드의 폭죽까지 터지지 않게
    const on = donut.classList.toggle('liquid');
    btn.textContent = on ? '◎ 도넛으로 보기' : '🌊 물결로 보기';
    // 어느 쪽으로 바꾸든 0%에서 다시 차오르게 한다.
    if (on) {
      startLiquid();
    } else {
      liquidRun++;                     // 물결 루프 정지
      runGauge(heroPct, false, true);  // 링만 0%부터 다시 채우고 숫자는 그대로
    }
  });
}

/** 리퀴드 상태에서 도넛을 누르면 물을 다시 밑에서부터 채운다. */
function initLiquidRefill() {
  const donut = document.getElementById('donutGauge');
  if (!donut) return;
  donut.addEventListener('click', (ev) => {
    if (!donut.classList.contains('liquid')) return;
    ev.stopPropagation();
    startLiquid();
  });
}

function startLiquid() {
  const cv = document.getElementById('liquidCanvas');
  if (!cv) return;
  const my = ++liquidRun;
  const t0 = performance.now();
  const draw = (now) => {
    if (my !== liquidRun) return;
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w: s, ctx } = f;
    const t = Math.max(0, now - t0) / 1000;
    const target = Math.max(0, Math.min(1, heroPct / 100));
    const fill = reducedMotion ? target : target * Math.min(1, 1 - Math.pow(1 - Math.min(1, t / 1.6), 3));
    const acc = accentColor();
    ctx.clearRect(0, 0, s, s);
    ctx.save();
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2 - 1, 0, 6.284); ctx.clip();
    // 파도가 수면 위아래로 AMP만큼 출렁이므로, 수위를 그만큼 넉넉한 범위에 매핑한다.
    // 그러지 않으면 100%에서 꼭대기에 파도 골만큼 빈 틈이 남고, 0%에서도 마루가 비쳐 보인다.
    const AMP = 9;
    const level = (s + 2 * AMP) * (1 - fill) - AMP;
    const grad = ctx.createLinearGradient(0, level, 0, s);
    grad.addColorStop(0, acc);
    grad.addColorStop(1, hexAlpha(acc, 0.45));
    [[9, 1.5, 0.55, 0.92], [6, 2.3, -0.9, 0.45]].forEach(([amp, freq, spd, alpha]) => {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, s);
      for (let x = 0; x <= s; x += 4) {
        ctx.lineTo(x, level + Math.sin((x / s) * freq * 6.284 + t * spd * 2.4) * (reducedMotion ? 0 : amp));
      }
      ctx.lineTo(s, s); ctx.closePath(); ctx.fill();
    });
    ctx.restore();
    ctx.globalAlpha = 1;
    if (!reducedMotion) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ===== 31 살아있는 하늘 배경 — 지금 시각의 하늘색을 상단에 옅게 ===== */
function initSkyTop() {
  if (reducedMotion) return;
  const layer = document.createElement('div');
  layer.className = 'skyTop';
  layer.setAttribute('aria-hidden', 'true');
  document.body.appendChild(layer);
  // 지금 색과 40분 뒤 색을 함께 깔아 일출·일몰 전후로 하늘이 실제처럼 번지게 한다.
  // (sunTint는 서울 기준 태양 고도 공식이라 계절에 따라 일출·일몰이 자동으로 옮겨진다.)
  const paint = () => {
    const now = new Date();
    const soon = new Date(now.getTime() + 40 * 60000);
    const a = sunTint(now.toISOString(), SKY_TRUE);
    const b = sunTint(soon.toISOString(), SKY_TRUE);
    layer.style.background = `linear-gradient(180deg, ${a.color} 0%, ${b.color} 46%, transparent 100%)`;
    layer.title = a.phase;
  };
  paint();
  setInterval(paint, 60000);   // 1분마다 갱신 — 일출·일몰 무렵엔 눈에 보이게 변한다
}

/* ===== 32 혜성 커서 — 지나간 자리에 잔상 ===== */
function initComet() {
  if (reducedMotion || !matchMedia('(hover: hover)').matches) return;
  const cv = document.createElement('canvas');
  cv.id = 'cometCanvas';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  const trail = [];
  let lastMove = 0;
  window.addEventListener('pointermove', (ev) => {
    trail.push({ x: ev.clientX, y: ev.clientY });
    if (trail.length > 24) trail.shift();
    lastMove = performance.now();
  }, { passive: true });

  const draw = (now) => {
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w, h, ctx } = f;
    ctx.clearRect(0, 0, w, h);
    const acc = accentColor();
    for (let i = 1; i < trail.length; i++) {
      const a = i / trail.length;
      ctx.strokeStyle = acc;
      ctx.globalAlpha = a * 0.5;
      ctx.lineWidth = 1 + a * 4;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (trail.length > 1 && now - lastMove > 45) trail.shift();
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ===== 버튼 이펙트 : 꽃잎 · 반딧불이용 파티클 레이어 ===== */
let fx2 = null;
function initFx2() {
  if (fx2) return fx2;
  const cv = document.createElement('canvas');
  cv.id = 'fx2Canvas';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  fx2 = { cv, parts: [], loop: null };
  return fx2;
}

/** 지금 계절 (버튼 이름·이모지·꽃잎 색이 같은 값을 쓴다) */
function currentSeason() {
  const m = new Date().getMonth();
  if (m >= 2 && m <= 4) return { label: '🌸 꽃잎', color: '#f7c8d8', speed: 1 };
  if (m >= 5 && m <= 7) return { label: '🍃 초록잎', color: '#8fd6a8', speed: 1.15 };
  if (m >= 8 && m <= 10) return { label: '🍁 낙엽', color: '#f2b84a', speed: 1.9 };
  return { label: '❄️ 눈', color: '#eef5f2', speed: 0.8 };
}

function fx2Spawn(kind) {
  if (reducedMotion) return;
  const f = initFx2();
  const W = window.innerWidth, H = window.innerHeight;
  const rand = (a, b) => a + Math.random() * (b - a);
  // 계절에 맞춰 꽃잎 / 낙엽 / 눈으로 바뀐다.
  const season = currentSeason();
  if (kind === 'petal') {
    for (let i = 0; i < 26; i++) f.parts.push({
      kind, x: rand(0, W), y: rand(-H * 0.6, -10), vx: rand(-0.35, 0.35) * season.speed, vy: rand(0.7, 1.7) * season.speed,
      r: rand(3, 6.5), rot: rand(0, 6.28), spin: rand(-0.03, 0.03), sway: rand(0.5, 1.5),
      tw: rand(0, 6.28), life: 1, decay: 0.0016, color: season.color, delay: i * 90,
    });
  } else {
    for (let i = 0; i < 22; i++) f.parts.push({
      kind: 'firefly', x: rand(0.05, 0.95) * W, y: rand(0.15, 0.95) * H,
      vx: rand(-0.35, 0.35), vy: rand(-0.45, 0.2), tw: rand(0, 6.28),
      r: rand(1.4, 2.8), life: 1, decay: rand(0.0022, 0.0045), delay: i * 45,
    });
  }
  if (f.loop) return;
  let last = performance.now();
  const draw = (now) => {
    const fit = fitCanvas(f.cv);
    if (!fit) { f.loop = requestAnimationFrame(draw); return; }
    const { w, h, ctx } = fit;
    const dt = Math.min(40, Math.max(0, now - last)); last = now;
    const acc = accentColor();
    ctx.clearRect(0, 0, w, h);
    f.parts = f.parts.filter((p) => {
      if (p.delay > 0) { p.delay -= dt; return true; }
      if (p.kind === 'petal') {
        p.tw += 0.03 * dt / 16;
        p.x += (p.vx + Math.sin(p.tw) * p.sway) * dt / 16;
        p.y += p.vy * dt / 16; p.rot += p.spin * dt / 16;
        if (p.y > h + 20) p.life = 0;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.6, p.r * 0.8, 0, 0, 6.284); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
      } else {
        p.tw += 0.05 * dt / 16;
        p.vx = Math.max(-0.7, Math.min(0.7, p.vx + (Math.random() - 0.5) * 0.05));
        p.vy = Math.max(-0.7, Math.min(0.7, p.vy + (Math.random() - 0.5) * 0.05));
        p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.life -= p.decay * dt / 16;
        // 반짝임에 맞춰 밝기가 오르내리고, 겹칠수록 빛이 더해지는 glow.
        const glow = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(p.tw));
        const al = glow * Math.max(0, p.life);
        const R = p.r * (7 + glow * 5);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        g.addColorStop(0, hexAlpha('#ffffff', 0.85 * al));
        g.addColorStop(0.16, hexAlpha(acc, 0.5 * al));
        g.addColorStop(0.45, hexAlpha(acc, 0.14 * al));
        g.addColorStop(1, hexAlpha(acc, 0));
        ctx.fillStyle = g;
        ctx.fillRect(p.x - R, p.y - R, R * 2, R * 2);
        ctx.globalAlpha = al;
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 16; ctx.shadowColor = acc;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.85 + glow * 0.35), 0, 6.284); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      return p.life > 0 && p.y < h + 120;
    });
    if (f.parts.length) f.loop = requestAnimationFrame(draw);
    else { ctx.clearRect(0, 0, w, h); f.loop = null; }
  };
  f.loop = requestAnimationFrame(draw);
}

/** 화면 전체 위에 잠깐 얹는 레이어. */
function fxLayer(css, ms) {
  const el = document.createElement('div');
  el.className = 'fxLayer';
  el.setAttribute('aria-hidden', 'true');
  el.style.cssText += css;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);

}

/** 🌠 별똥별 소나기 — 기존 별똥별을 20개 연달아 */
function meteorShower() {
  if (reducedMotion) return;
  const f = initFx();
  if (!f) return;
  for (let i = 0; i < 7; i++) {
    const d = i * 420 + Math.random() * 220;
    setTimeout(() => { f.meteor(); f.kick(); }, d);
  }

/** ✂️ 화면 컷편집 */
function fxScreenCut() {
  if (reducedMotion) return;
  const page = document.querySelector('.page');
  const line = fxLayer('left:-20%;right:-20%;top:46%;height:2px;background:#fff;box-shadow:0 0 16px 4px rgba(255,255,255,.7);transform:rotate(-8deg)', 700);
  if (line && line.animate) line.animate([
    { opacity: 0, transform: 'rotate(-8deg) scaleX(0)' },
    { opacity: 1, transform: 'rotate(-8deg) scaleX(1)', offset: 0.45 },
    { opacity: 0, transform: 'rotate(-8deg) scaleX(1)' },
  ], { duration: 650, easing: 'ease-out' });
  if (!page) return;
  setTimeout(() => {
    page.style.transition = 'transform .45s cubic-bezier(.2,1.5,.4,1)';
    page.style.transform = 'translateX(14px) skewX(-1.5deg)';
    setTimeout(() => { page.style.transform = ''; }, 220);
    setTimeout(() => { page.style.transition = ''; }, 720);
  }, 300);
}

/** 🎰 숫자 슬롯 — 화면의 숫자가 돌다 멈춘다 */
function fxSlot() {
  if (reducedMotion) return;
  const digits = '0123456789';
  // 날짜·경과 시간·비율까지, 화면에서 숫자가 들어간 잎 요소를 모두 돌린다.
  const targets = [...document.querySelectorAll('.page *')]
    .filter(el => el.children.length === 0
      && !el.closest('.topRight')
      && /\d/.test(el.textContent || '')
      && (el.textContent || '').length <= 24)
    .slice(0, 160);
  targets.forEach((el, i) => {
    const final = el.dataset.slotFinal || el.textContent;
    el.dataset.slotFinal = final;
    const run = el._slotRun = (el._slotRun || 0) + 1;
    const t0 = performance.now(), dur = 700 + (i % 7) * 90;
    const step = (now) => {
      if (el._slotRun !== run) return;
      if (Math.max(0, now - t0) >= dur) { el.textContent = final; return; }
      el.textContent = final.replace(/\d/g, () => digits[Math.floor(Math.random() * 10)]);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { if (el._slotRun === run) el.textContent = final; }, dur + 200);
  });
}

/* ===== 06 + 12 은하수 패럴랙스 (밤에만) — 별 수는 마지막 기록 이후 흐른 시간에 비례 ===== */
function initGalaxy(data) {
  if (reducedMotion) return;
  const entries = data.entries || [];
  const lastTs = entries.length ? new Date(entries[entries.length - 1].timestamp).getTime() : Date.now();
  const cv = document.createElement('canvas');
  cv.id = 'galaxyCanvas';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);

  const layers = [
    { r: 0.5, depth: 0.25, spd: 0.004, share: 0.55 },
    { r: 0.9, depth: 0.55, spd: 0.008, share: 0.3 },
    { r: 1.5, depth: 1.0, spd: 0.014, share: 0.15 },
  ].map((L) => ({ ...L, stars: Array.from({ length: 130 }, () => ({ x: Math.random(), y: Math.random(), tw: Math.random() * 6.28 })) }));

  let px = 0.5, py = 0.5;      // 커서 위치 (원본)
  let sx = 0.5, sy = 0.5;      // 별이 실제로 따라가는, 부드럽게 뒤쫓는 값
  window.addEventListener('pointermove', (ev) => {
    px = ev.clientX / window.innerWidth; py = ev.clientY / window.innerHeight;
  }, { passive: true });

  let last = 0;
  const draw = (now) => {
    // 흐르는 속도를 '프레임당'이 아니라 '초당'으로 잡는다. 무거운 이펙트가 돌면
    // 프레임이 듬성해지는데, 프레임당으로 재면 그때마다 별이 느려졌다 빨라졌다 하고
    // 긴 멈춤 뒤엔 튀어 보인다. dt는 0.05초로 잘라 한 번에 확 건너뛰지도 않게 한다.
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w, h, ctx } = f;
    ctx.clearRect(0, 0, w, h);

    // 시차(parallax)도 커서를 바로 따라가면 마우스를 옮길 때마다 별이 툭 끊긴다.
    const ease = Math.min(1, dt * 6);
    sx += (px - sx) * ease; sy += (py - sy) * ease;

    // 그려지든 말든 모든 별을 똑같이 흘려보낸다 — 그려지는 개수가 달라져도
    // 뒤쪽 별이 옛날 자리에서 갑자기 나타나지 않게.
    for (const L of layers) {
      for (const st of L.stars) {
        st.x += L.spd * dt;
        if (st.x > 1.05) st.x = -0.05;
      }
    }

    // 낮에는 은하수를 접는다
    if (!document.hidden && isNightNow()) {
      const idleHours = Math.max(0, (Date.now() - lastTs) / 3600000);
      const fill = Math.min(1, 0.12 + idleHours / 72);   // 3일 방치 = 가득
      const band = ctx.createLinearGradient(0, h * 0.1, w, h * 0.7);
      band.addColorStop(0, 'rgba(120,140,220,0)');
      band.addColorStop(0.45, `rgba(150,170,235,${(0.05 + fill * 0.07).toFixed(3)})`);
      band.addColorStop(1, 'rgba(120,140,220,0)');
      ctx.fillStyle = band;
      ctx.fillRect(0, 0, w, h);
      layers.forEach((L) => {
        const n = Math.round(L.stars.length * L.share * fill * 2.2);
        const ox = (sx - 0.5) * -30 * L.depth, oy = (sy - 0.5) * -20 * L.depth;
        for (let i = 0; i < n && i < L.stars.length; i++) {
          const st = L.stars[i];
          ctx.globalAlpha = (0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now / 900 + st.tw))) * (0.5 + L.depth * 0.5);
          ctx.fillStyle = '#eef5f2';
          ctx.beginPath(); ctx.arc(st.x * w + ox, st.y * h + oy, L.r, 0, 6.284); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

function showTravelQuote() {
  if (document.querySelector('.quoteToast')) return;
  // 지난번에 본 명언은 바로 다시 안 나오게.
  let last = -1;
  try { last = Number(localStorage.getItem('lastQuote') ?? -1); } catch (e) {}
  let pick = Math.floor(Math.random() * TRAVEL_QUOTES.length);
  if (pick === last) pick = (pick + 1) % TRAVEL_QUOTES.length;
  try { localStorage.setItem('lastQuote', String(pick)); } catch (e) {}
  const [q, by, icon] = TRAVEL_QUOTES[pick];
  const el = document.createElement('div');
  el.className = 'quoteToast';
  el.setAttribute('role', 'status');
  el.innerHTML = `
    <span class="quoteBadge" aria-hidden="true">${icon}</span>
    <span class="quoteBody">
      <span class="over">TRAVEL QUOTE UNLOCKED</span>
      <span class="q">“${escapeHtml(q)}”</span>
      <span class="by">— ${escapeHtml(by)}</span>
    </span>
    <span class="quoteBar" aria-hidden="true"><i></i></span>`;
  document.body.appendChild(el);
  const close = () => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 450);
  };
  el.addEventListener('click', close);
  // 붙인 직전 상태가 한 번 그려진 뒤에 올려야 떨어지는 전환이 보인다.
  // (rAF는 백그라운드·일부 폰 브라우저에서 멈춰 있어 카드가 아예 안 뜰 수 있어 타이머로.)
  el.getBoundingClientRect();
  setTimeout(() => { el.classList.add('show'); sfx('achieve'); }, 30);
  setTimeout(close, 4500);
}
setTimeout(showTravelQuote, 900);
