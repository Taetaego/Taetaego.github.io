<script>
let reducedMotion = false;
let heroPct = 0;
let heroCompleted = false;

/* ===== 효과음 — 음원 파일 없이 Web Audio로 그때그때 합성한다. 기본은 꺼져 있고 🔇 버튼으로 켠다. ===== */
const Sfx = (() => {
  let on = false, ctx = null, master = null, noiseBuf = null;
  try { on = localStorage.getItem('sfx') === 'on'; } catch (e) {}
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // 음 하나 — f에서 to로 미끄러지며, 짧게 올라갔다가 d초 동안 사그라든다.
  function tone({ f = 440, to = null, d = 0.1, type = 'sine', v = 0.2, at = 0, a = 0.005 }) {
    const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + d + 0.03);
  }
  // 잡음 한 줌 — 필터로 깎아 가위·박수·바람 소리를 만든다.
  function noise({ d = 0.1, v = 0.2, at = 0, type = 'bandpass', f = 2000, to = null, q = 1, a = 0.002 }) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const t = ctx.currentTime + at;
    const src = ctx.createBufferSource(), bf = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    bf.type = type; bf.Q.value = q; bf.frequency.setValueAtTime(f, t);
    if (to) bf.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(bf).connect(g).connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.03);
  }
  const SOUNDS = {
    tap: () => tone({ f: 900, to: 620, d: 0.05, type: 'triangle', v: 0.12 }),
    tick: () => { tone({ f: 1500, d: 0.03, type: 'square', v: 0.05 }); tone({ f: 2200, d: 0.08, v: 0.1, at: 0.03 }); },
    boing: () => { tone({ f: 200, to: 460, d: 0.12, v: 0.2 }); tone({ f: 460, to: 300, d: 0.18, v: 0.14, at: 0.1 }); },
    like: () => { tone({ f: 520, to: 1150, d: 0.08, v: 0.25 }); tone({ f: 1400, d: 0.14, type: 'triangle', v: 0.08, at: 0.06 }); },
    fill: () => { tone({ f: 220, to: 880, d: 0.7, type: 'triangle', v: 0.1, a: 0.05 }); tone({ f: 1320, d: 0.35, v: 0.08, at: 0.62 }); },
    count: () => { for (let i = 0; i < 6; i++) tone({ f: 620 + i * 110, d: 0.05, type: 'square', v: 0.045, at: i * 0.075 }); },
    snip: () => { for (let i = 0; i < 3; i++) noise({ d: 0.035, type: 'highpass', f: 5200 + i * 400, v: 0.22, at: i * 0.15 }); },
    cut: () => {
      noise({ d: 0.1, f: 3400, q: 2, v: 0.35 });
      tone({ f: 150, to: 55, d: 0.3, v: 0.3, at: 0.28 });
      noise({ d: 0.12, type: 'lowpass', f: 500, v: 0.2, at: 0.28 });
    },
    whoosh: () => noise({ d: 1.1, f: 350, to: 2600, q: 1.2, v: 0.16, a: 0.35 }),
    chime: () => [1046, 1318, 1568].forEach((f, i) => tone({ f, d: 0.6, v: 0.09, at: i * 0.07 })),
    drop: () => { tone({ f: 1300, to: 320, d: 0.16, v: 0.22 }); tone({ f: 600, to: 900, d: 0.1, v: 0.06, at: 0.12 }); },
    sprout: (at, k) => tone({ f: 500 + k * 90, to: (500 + k * 90) * 1.7, d: 0.07, v: 0.08, at }),
    flip: () => { noise({ d: 0.06, f: 1800, q: 3, v: 0.22 }); tone({ f: 720, to: 420, d: 0.07, type: 'triangle', v: 0.08 }); },
    sparkle: () => { for (let i = 0; i < 5; i++) tone({ f: 2000 + Math.random() * 2200, d: 0.09, v: 0.045, at: 0.05 + i * 0.045 }); },
    rewind: (dur = 0.9) => {
      tone({ f: 1000, to: 260, d: dur, type: 'sawtooth', v: 0.035, a: 0.03 });
      noise({ d: dur, f: 2600, to: 700, q: 5, v: 0.1, a: 0.03 });
    },
    play: () => { tone({ f: 880, d: 0.09, type: 'square', v: 0.06 }); tone({ f: 1320, d: 0.14, type: 'square', v: 0.05, at: 0.1 }); },
    clap: () => { noise({ d: 0.14, f: 1400, q: 0.8, v: 0.7 }); noise({ d: 0.05, type: 'highpass', f: 4000, v: 0.3 }); tone({ f: 170, to: 70, d: 0.12, v: 0.3 }); },
    achieve: () => {
      [523, 659, 784].forEach((f, i) => tone({ f, d: 0.12, type: 'square', v: 0.05, at: i * 0.08 }));
      tone({ f: 1046, d: 0.45, type: 'square', v: 0.05, at: 0.24 });
      tone({ f: 2093, d: 0.5, v: 0.05, at: 0.26 });
    },
    pop: () => tone({ f: 420, to: 950, d: 0.07, v: 0.18 }),
    fireworks: () => {
      tone({ f: 700, to: 2200, d: 0.55, v: 0.05, a: 0.05 });
      noise({ d: 0.9, type: 'lowpass', f: 700, to: 120, v: 0.55, at: 0.55 });
      for (let i = 0; i < 9; i++) noise({ d: 0.03, type: 'highpass', f: 3500, v: 0.12, at: 0.75 + Math.random() * 0.6 });
    },
  };
  return {
    get on() { return on; },
    play(name, ...args) {
      if (!on || !SOUNDS[name]) return;
      // 한 번도 누르지 않은 상태(첫 방문 명언 카드 등)에선 소리를 못 내니, 쌓아뒀다 늦게 울리지 않게 건너뛴다.
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      if (!ensure() || ctx.state !== 'running' && ctx.state !== 'suspended') return;
      try { SOUNDS[name](...args); } catch (e) {}
    },
    toggle() {
      on = !on;
      try { localStorage.setItem('sfx', on ? 'on' : 'off'); } catch (e) {}
      if (on) this.play('chime');
      return on;
    },
  };
})();
const sfx = (name, ...args) => Sfx.play(name, ...args);

function initSfxBtn() {
  const btn = document.getElementById('sfxBtn');
  if (!btn) return;
  const paint = () => {
    btn.textContent = Sfx.on ? '🔊' : '🔇';
    btn.setAttribute('aria-pressed', String(Sfx.on));
    btn.title = Sfx.on ? '효과음 끄기' : '효과음 켜기';
  };
  paint();
  btn.addEventListener('click', () => { Sfx.toggle(); paint(); });
}

async function main() {
  reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const summaryCard = document.getElementById('summaryCard');

  // 폭죽 버튼·반딧불이는 status.json과 무관하므로, 데이터를 못 불러와도 살아있게 밖에 둔다.
  document.getElementById('fireBtn').addEventListener('click', () => { sfx('fireworks'); launchFireworks(); });
  initFxButtons();
  initSfxBtn();
  initAmbientLayers();
  initSkyTop();
  initComet();

  initPastProjects();

  try {
    const data = await fetchData('status.json');
    // 한 번만 걸면 되는 것들 — 여기서 붙여둬야 프로젝트를 바꿔도 중복으로 안 걸린다.
    initDayBandReplay();
    setInterval(() => { updateDayNow(); updateSinceStart(); updateLive(); }, 60000);
    initRowPulse();
    initSlate();
    initRewind();
    initGalaxy(data);
    initTodoPoke();
    initCounterReplay();
    initCardTilt();
    initThumbLike();
    document.getElementById('doneList').addEventListener('click', (ev) => {
      const viz = ev.target.closest('.spanViz');
      if (!viz || reducedMotion) return;
      viz.classList.remove('replay'); void viz.offsetWidth; viz.classList.add('replay');
      // 이름만 껐다 켠다 — 점마다 박힌 animation-delay를 지우지 않도록.
      viz.querySelectorAll('.spanFill, .spanDot, .spanEnd.finish').forEach(el => {
        el.style.animationName = 'none'; void el.offsetWidth; el.style.animationName = '';
      });
    });
    summaryCard.addEventListener('click', (ev) => {
      // 도넛을 누른 건 게이지를 다시 채워보려는 것이지 축하해달라는 게 아니다.
      // (물결 모드일 땐 initLiquidRefill이 먼저 잡아서 여기까지 오지 않는다.)
      if (ev.target.closest('#donutGauge')) { sfx('fill'); runGauge(heroPct, false, true); return; }
      const since = ev.target.closest('.sinceBlock');
      if (since) { sfx('count'); animateCounter(since.querySelector('.sinceVal')); return; }
      // 카드를 누르면 게이지만 다시 채우고, 완료된 프로젝트면 다 찼을 때 도넛 안에서만 한 발 터진다.
      // 화면 전체로 쏘아 올리는 축포·잔잔한 불꽃은 처음 열었을 때만 (celebrate).
      sfx('fill');
      runGauge(heroPct, heroCompleted && !reducedMotion);
    });
    // 폭죽은 페이지를 처음 열었을 때 완료 상태인 경우에만. 목록에서 골라 들어간
    // 프로젝트가 완료됐다고 해서 다시 터지지는 않는다.
    shownSignature = snapshotSignature(data);
    renderProject(data, { fireworks: true });
    initHeat();
    loadActivity();
    initAutoRefresh();
  } catch (e) {
    summaryCard.style.display = '';
    summaryCard.innerHTML = '<div class="empty">아직 기록된 작업이 없어요</div>';
  } finally {
    // 카드 배치가 끝난 뒤에 꺼내야 버튼·푸터가 제자리에서 나타난다.
    document.getElementById('fxBar').style.display = '';
    document.getElementById('madeBy').style.display = '';
    initSpotlight();
  }
}

/** 한 프로젝트를 화면에 그린다. 프로젝트를 바꿀 때마다 다시 부르므로
    여기에는 데이터를 그리는 일만 두고, 리스너·애니메이션 루프는 main()에서 한 번만 건다.
    fireworks가 true일 때만, 그리고 완료 상태일 때만 축포가 터진다. */
// 편집 잔디의 '단계' 탭이 단계 이름을 그룹으로 묶을 때 쓴다. 회차마다 같은 목록이다.
let heatGroups = { byName: new Map(), order: [] };

function renderProject(data, { fireworks = false } = {}) {
  const summaryCard = document.getElementById('summaryCard');
  if ((data.allCategories || []).length) {
    const order = [...new Set(data.allCategories.map(c => c.group))];
    heatGroups = { byName: new Map(data.allCategories.map(c => [c.name, c.group])), order };
  }
  if (data.status === 'none') {
    for (const id of OPTIONAL_CARDS) hideCard(id);
    summaryCard.style.display = '';
    summaryCard.innerHTML = '<div class="empty">편집 중인 프로젝트가 없어요</div>';
    document.title = '태태고 편집실';
    return;
  }
  // 새 프로젝트에 없는 항목이 이전 프로젝트 화면 그대로 남지 않게 먼저 접는다.
  for (const id of OPTIONAL_CARDS) hideCard(id);
  renderYouTubeThumb(null);

  renderSummary(summaryCard, data);
  renderThumb(data);
  // 도넛·물결 버튼은 renderSummary가 매번 새로 만드는 요소라, 여기서 다시 걸어야 한다.
  // main()에서 한 번만 걸면 첫 렌더 전이라 붙을 대상이 없고, 프로젝트를 바꾸면
  // 리스너를 달아둔 요소째 사라진다.
  initGaugeToggle();
  initDonutSpin();
  renderCompletion(data);
  placeStatsCard(data);
  renderPipeline(data);
  renderStats(data);
  renderDayBand(data);
  renderLog(data);
  initDoneGlow(data);
  celebrate(heroPct, heroCompleted, fireworks);
}

const OPTIONAL_CARDS = ['doneCard', 'pipelineCard', 'dayCard', 'logCard'];
function hideCard(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}

/** 데이터 파일은 앱이 발행할 때마다 바뀐다. GitHub Pages가 max-age=600을 붙여 두어서
    중간 CDN이 발행 직후 10분까지 옛 사본을 줄 수 있다 — 주소에 시각을 붙여 늘 새로 받는다. */
function fetchData(path) {
  const sep = path.includes('?') ? '&' : '?';
  return fetch(`${path}${sep}t=${Date.now()}`, { cache: 'no-store' }).then((res) => {
    if (!res.ok) throw new Error(`${path} ${res.status}`);
    return res.json();
  });
}

/* ===== 자리를 비웠다 돌아오면 최신 기록으로 =====
   폰은 다른 앱으로 넘어가면 탭을 얼려 두었다가, 돌아올 때 다시 불러오지 않고 그 화면을
   그대로 녹여서 보여준다 (뒤로가기 캐시도 마찬가지). status.json은 페이지를 열 때 한 번만
   받으니, 그 사이 앱에서 기록을 남겼어도 새로고침 전까지 옛 화면이 남아 있었다.
   그래서 다시 보이게 되는 순간과, 켜 둔 채로 있을 땐 1분마다 새 기록이 있는지 본다. */
let shownSignature = '';   // 지금 화면에 그려진 스냅샷
let refreshing = false;

/** 발행 시각(lastUpdate)은 내용이 같아도 발행할 때마다 바뀌니 비교에서 뺀다. */
function snapshotSignature(data) {
  const { lastUpdate, ...rest } = data || {};
  return JSON.stringify(rest);
}

async function refreshCurrentProject() {
  // 목록에서 지난 프로젝트를 골라 보고 있으면 그 화면을 뺏지 않는다.
  if (pastCurrentId || refreshing || document.hidden) return;
  refreshing = true;
  try {
    const data = await fetchData('status.json');
    const sig = snapshotSignature(data);
    // 받아오는 사이에 지난 프로젝트를 열었을 수도 있다.
    if (sig === shownSignature || pastCurrentId) return;
    // 폭죽은 첫 방문과 '완료되는 순간'에만. 자리를 비운 사이 완료됐다면 지금이 그 순간이다.
    const justCompleted = data.status === 'completed' && !heroCompleted;
    shownSignature = sig;
    pastIndex = null;   // 프로젝트가 늘었을 수 있으니 목록도 다음에 열 때 새로 받는다
    loadActivity();     // 새 기록이 생겼으니 잔디도 다시
    renderProject(data, { fireworks: justCompleted });
  } catch (e) {
    // 오프라인이거나 잠깐 실패한 거면 다음 기회에 다시 본다.
  } finally {
    refreshing = false;
  }
}

function initAutoRefresh() {
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCurrentProject(); });
  // 뒤로가기 캐시에서 되살아난 경우엔 visibilitychange가 오지 않을 때가 있다.
  window.addEventListener('pageshow', (ev) => { if (ev.persisted) refreshCurrentProject(); });
  // 데스크톱은 다른 창에 갔다 와도 탭이 계속 '보이는' 상태라 창 포커스로도 확인한다.
  window.addEventListener('focus', refreshCurrentProject);
  setInterval(refreshCurrentProject, 60000);
}

/* ===== 편집 잔디 (채널 전체) ===== */
let heatData = null;        // projects/activity.json
let heatRange = 'all';
const HEAT_CELL = 15, HEAT_GAP = 3;

async function loadActivity() {
  try {
    heatData = await fetchData('projects/activity.json');
  } catch (e) {
    heatData = null;   // 예전 앱이 올린 사이트라 파일이 없으면 카드를 숨긴다
  }
  renderHeat();
  renderPace();
}

let heatTab = 'overview';

function initHeat() {
  const tabs = document.getElementById('heatTabs');
  tabs.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-tab]');
    if (!b || b.dataset.tab === heatTab) return;
    heatTab = b.dataset.tab;
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    document.getElementById('heatOverview').hidden = heatTab !== 'overview';
    document.getElementById('heatStages').hidden = heatTab !== 'stages';
    renderHeat();
  });
  const toggle = document.getElementById('heatRange');
  toggle.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-range]');
    if (!b || b.dataset.range === heatRange) return;
    heatRange = b.dataset.range;
    toggle.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    renderHeat({ animate: false });
  });
  // 폭이 바뀌어 들어가는 주 수가 달라질 때만 다시 그린다.
  let t = 0, lastWeeks = 0;
  addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => { if (heatWeeks() !== lastWeeks) renderHeat({ animate: false }); }, 150);
  });
  const orig = renderHeat;
  renderHeat = (opts) => { lastWeeks = heatWeeks(); orig(opts); };
  document.getElementById('heatCard').addEventListener('click', heatBurst);
}

/** 잔디 위 숫자 타일은 따로 논다 — 누르면 휙 뒤집혀 뒷면의 숫자를 보여주고,
    누른 자리에서 타일 색 불꽃이 튄다. 잠시 뒤(또는 다시 누르면) 앞면으로 돌아온다. */
function heatTileFlip(tile, ev) {
  if (!tile.dataset.bk) return;
  const k = tile.querySelector('.k'), v = tile.querySelector('.v');
  const toBack = !tile.classList.contains('flipped');
  const swap = () => {
    tile.classList.toggle('flipped', toBack);
    k.textContent = toBack ? tile.dataset.bk : tile.dataset.fk;
    v.textContent = toBack ? tile.dataset.bv : tile.dataset.fv;
    v.title = v.textContent;
  };
  clearTimeout(tile._back);
  sfx('flip');
  if (toBack) sfx('sparkle');
  if (reducedMotion) swap();
  else {
    tile.getAnimations().forEach(a => a.cancel());
    tile.animate([{ transform: 'perspective(400px) rotateX(0)' }, { transform: 'perspective(400px) rotateX(90deg)' }],
      { duration: 140, easing: 'ease-in' }).onfinish = () => {
      swap();
      tile.animate([
        { transform: 'perspective(400px) rotateX(-90deg)' },
        { transform: 'perspective(400px) rotateX(12deg)', offset: 0.7 },
        { transform: 'perspective(400px) rotateX(0)' },
      ], { duration: 320, easing: 'ease-out' });
    };
    if (toBack) heatTileSparks(tile, ev);
  }
  if (toBack) tile._back = setTimeout(() => { if (tile.classList.contains('flipped')) heatTileFlip(tile, null); }, 3000);
}

function heatTileSparks(tile, ev) {
  const card = document.getElementById('heatCard');
  const cr = card.getBoundingClientRect(), tr = tile.getBoundingClientRect();
  const x = (ev ? ev.clientX : tr.left + tr.width / 2) - cr.left;
  const y = (ev ? ev.clientY : tr.top + tr.height / 2) - cr.top;
  const color = getComputedStyle(tile).getPropertyValue('--tc').trim() || 'var(--accent)';
  for (let i = 0; i < 12; i++) {
    const sp = document.createElement('span');
    sp.className = 'heatSpark';
    sp.style.left = `${x}px`; sp.style.top = `${y}px`; sp.style.background = color; sp.style.color = color;
    card.appendChild(sp);
    const a = (i / 12) * Math.PI * 2 + Math.random() * 0.4, d = 26 + Math.random() * 22;
    sp.animate([
      { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.2)`, opacity: 0 },
    ], { duration: 520 + Math.random() * 200, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }).onfinish = () => sp.remove();
  }
}

/** 잔디 카드를 누르면 누른 자리에서 물결이 퍼지고, 기록 있는 날마다 새싹이 돋는다.
    칸을 누르면 그날 날짜·기록 수를 말풍선으로 띄운다. */
function heatBurst(ev) {
  if (ev.target.closest('button') || heatTab !== 'overview') return;
  const tile = ev.target.closest('.heatTile');
  if (tile) { heatTileFlip(tile, ev); return; }
  const card = document.getElementById('heatCard');
  const grid = document.getElementById('heatGrid');
  const cr = card.getBoundingClientRect();
  const x = ev.clientX, y = ev.clientY;
  card.querySelectorAll('.heatTip').forEach(t => t.remove());
  const hit = ev.target.closest('.heatCell');
  if (hit && !hit.classList.contains('future')) {
    const r = hit.getBoundingClientRect();
    const tip = document.createElement('span');
    tip.className = 'heatTip';
    tip.textContent = hit.title;
    // 카드 밖으로 삐져나가지 않게 가로 위치를 안쪽으로 당긴다.
    const cellX = r.left + r.width / 2 - cr.left;
    tip.style.top = `${r.top - cr.top}px`;
    card.appendChild(tip);
    const half = tip.offsetWidth / 2;
    const cx = Math.min(Math.max(cellX, half + 6), cr.width - half - 6);
    tip.style.left = `${cx}px`;
    // 말풍선 몸통은 안쪽으로 당겨도, 꼬리는 누른 칸을 그대로 가리키게 한다.
    tip.style.setProperty('--tail', `${Math.max(-half + 10, Math.min(half - 10, cellX - cx)).toFixed(1)}px`);
    setTimeout(() => tip.remove(), 1850);
  }
  sfx('drop');
  if (reducedMotion) return;
  const SPROUT = { l1: '🌱', l2: '🌱', l3: '🌿', l4: '🌸' };
  let sprouts = 0, maxDelay = 0;
  for (const cell of grid.children) {
    if (cell.classList.contains('future')) continue;
    const r = cell.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const delay = Math.hypot(cx - x, cy - y) * 1.6;
    maxDelay = Math.max(maxDelay, delay);
    cell.style.animation = 'none';
    void cell.offsetWidth;   // 연달아 눌러도 처음부터 다시 퍼지게
    cell.style.animation = `heatRipple .6s ease ${delay.toFixed(0)}ms both`;
    const lv = [...cell.classList].find(c => SPROUT[c]);
    if (lv && sprouts < 60) {
      sprouts++;
      const sp = document.createElement('span');
      sp.className = 'heatSprout';
      sp.textContent = SPROUT[lv];
      sp.style.left = `${cx - cr.left}px`; sp.style.top = `${cy - cr.top}px`;
      sp.style.animationDelay = `${(delay + 80).toFixed(0)}ms`;
      sp.style.setProperty('--sx', `${((Math.random() * 2 - 1) * 12).toFixed(1)}px`);
      sp.style.setProperty('--sr', `${((Math.random() * 2 - 1) * 25).toFixed(0)}deg`);
      card.appendChild(sp);
      setTimeout(() => sp.remove(), delay + 1300);
      if (sprouts <= 14) sfx('sprout', (delay + 80) / 1000, sprouts % 7);
    }
  }
  clearTimeout(heatBurst.t);
  heatBurst.t = setTimeout(() => { for (const c of grid.children) c.style.animation = 'none'; }, maxDelay + 700);
}

function heatWeeks() {
  const grid = document.getElementById('heatGrid');
  const w = grid.clientWidth || grid.parentElement.clientWidth - 32;
  return Math.max(8, Math.floor((w + HEAT_GAP) / (HEAT_CELL + HEAT_GAP)));
}

const dayKeyOf = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

function renderHeat({ animate = true } = {}) {
  const card = document.getElementById('heatCard');
  if (!heatData || !(heatData.records || []).length) { card.style.display = 'none'; return; }
  card.style.display = '';

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const since = heatRange === 'all' ? null : new Date(today.getTime() - (Number(heatRange) - 1) * 86400000);
  const recs = heatData.records.map(([t, c, ep]) => ({ d: new Date(t * 1000), c, ep }));
  const inRange = since ? recs.filter(r => r.d >= since) : recs;

  // ── 타일 ──
  const perDay = new Map();
  for (const r of recs) { const k = dayKeyOf(r.d); perDay.set(k, (perDay.get(k) || 0) + 1); }
  const activeDays = new Set(inRange.map(r => dayKeyOf(r.d)));
  const hours = new Array(24).fill(0);
  const cats = new Map();
  for (const r of inRange) {
    hours[r.d.getHours()]++;
    const name = heatData.categories[r.c];
    if (name && name !== '완료') cats.set(name, (cats.get(name) || 0) + 1);
  }
  const peakHour = inRange.length ? hours.indexOf(Math.max(...hours)) : null;
  const topCat = [...cats.entries()].sort((a, b) => b[1] - a[1])[0];
  const eps = new Set(inRange.map(r => r.ep));
  const { current, longest } = heatStreaks(perDay, today, since);
  // 0시·12시는 '오전 12시'처럼 헷갈리게 읽히니 밤/낮으로.
  const hourLabel = (h) => h === null ? '—' : h === 0 ? '밤 12시' : h === 12 ? '낮 12시' : `${h < 12 ? '오전' : '오후'} ${h % 12}시`;
  // 타일마다 제 색 — 앱 편집 잔디 타일과 같은 짝.
  // 뒷면 숫자 — 타일을 누르면 뒤집혀서 보인다.
  const doneIdx = heatData.categories.indexOf('완료');
  const doneEps = new Set(inRange.filter(r => r.c === doneIdx).map(r => r.ep)).size;
  const firstDay = inRange.length ? new Date(Math.min(...inRange.map(r => r.d.getTime()))) : today;
  firstDay.setHours(0, 0, 0, 0);
  const spanDays = since ? Number(heatRange) : Math.round((today - firstDay) / 86400000) + 1;
  const tiles = [
    ['에피소드', `${eps.size}개`, 'var(--grp-1)', '완료 · 편집 중', `${doneEps} · ${eps.size - doneEps}`],
    ['작업 기록', `${inRange.length}개`, 'var(--grp-2)', '작업한 날 평균',
      activeDays.size ? `${(inRange.length / activeDays.size).toFixed(1)}개` : '—'],
    ['활성 일수', `${activeDays.size}일`, 'var(--grp-3)', `${spanDays}일 중`,
      spanDays ? `${Math.round(activeDays.size / spanDays * 100)}%` : '—'],
    ['최다 작업 시간', hourLabel(peakHour), 'var(--grp-4)', '그 시간에 시작', peakHour === null ? '—' : `${hours[peakHour]}번`],
    ['최다 단계', topCat ? topCat[0] : '—', 'var(--gold)', '그 단계 기록', topCat ? `${topCat[1]}개` : '—'],
    ['연속 작업', current >= 2 ? `🔥 ${current}일` : `최장 ${longest}일`, '#ff8a3d',
      current >= 2 ? '최장 기록' : '지금 연속', current >= 2 ? `${longest}일` : `${current}일`],
  ];
  document.getElementById('heatTiles').innerHTML = tiles
    .map(([k, v, c, bk, bv]) => `<div class="heatTile" style="--tc:${c}" data-fk="${escapeHtml(k)}" data-fv="${escapeHtml(v)}" data-bk="${escapeHtml(bk)}" data-bv="${escapeHtml(bv)}"><span class="k">${k}</span><span class="v" title="${escapeHtml(v)}">${escapeHtml(v)}</span></div>`)
    .join('');

  // ── 칸: 일~토 7줄, 가장 오른쪽 줄이 이번 주 ──
  const grid = document.getElementById('heatGrid');
  const weeks = heatWeeks();
  grid.style.setProperty('--weeks', weeks);
  const start = new Date(today); start.setDate(today.getDate() - today.getDay() - (weeks - 1) * 7);
  const level = (n) => n === 0 ? 0 : n <= 2 ? 1 : n <= 4 ? 2 : n <= 7 ? 3 : 4;
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  let html = '';
  for (let w = 0; w < weeks; w++) {
    for (let dow = 0; dow < 7; dow++) {
      const d = new Date(start); d.setDate(start.getDate() + w * 7 + dow);
      const n = perDay.get(dayKeyOf(d)) || 0;
      const cls = ['heatCell', `l${level(n)}`];
      if (d > today) cls.push('future');
      else if (since && d < since) cls.push('out');
      if (d.getTime() === today.getTime()) cls.push('today');
      const tip = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[dow]}) · ${n ? `기록 ${n}개` : '쉼'}`;
      const delay = animate ? ` style="animation-delay:${w * 14}ms"` : ' style="animation:none"';
      html += `<span class="${cls.join(' ')}" title="${tip}"${delay}></span>`;
    }
  }
  grid.innerHTML = html;

  // ── 한 줄 요약 ──
  const h = Math.floor(heatData.originalMinutes / 60), m = heatData.originalMinutes % 60;
  const dayish = heatData.originalMinutes >= 1440
    ? ` — 꼬박 ${formatSpan(heatData.originalMinutes * 60)} 넘게 찍었어요` : '';
  const fin = heatData.finalMinutes ? ` · 완성 영상 <b>${formatMinutes(heatData.finalMinutes)}</b>` : '';
  document.getElementById('heatFoot').innerHTML =
    `지금까지 촬영 원본 <b>${h ? `${h}시간 ` : ''}${m}분</b>${dayish}${fin}`;

  if (heatTab === 'stages') renderStageBars(recs, today, since, animate);
}

/** 단계 탭 — 날짜마다 막대 하나, 기록 수만큼 높이, 단계 그룹 색으로 쌓는다.
    '전체'면 첫 기록 날부터 오늘까지(최대 120일). */
function renderStageBars(recs, today, since, animate) {
  const chart = document.getElementById('barChart');
  const legend = document.getElementById('barLegend');
  const first = since || (() => { const d = new Date(recs[0].d); d.setHours(0, 0, 0, 0); return d; })();
  let days = Math.round((today - first) / 86400000) + 1;
  days = Math.max(7, Math.min(days, 120));
  const start = new Date(today); start.setDate(today.getDate() - (days - 1));

  // 그룹 목록: 현재 카테고리의 그룹 순서 + 완료 + 목록에 없는 옛 단계
  const groups = [...heatGroups.order, '완료', '기타'];
  const colorOf = (g) => g === '완료' ? 'var(--gold)'
    : g === '기타' ? 'var(--ink3)'
    : `var(--grp-${Math.min(heatGroups.order.indexOf(g), 3) + 1})`;
  const groupOf = (r) => {
    const name = heatData.categories[r.c];
    if (name === '완료') return '완료';
    return heatGroups.byName.get(name) || '기타';
  };

  const perDay = Array.from({ length: days }, () => new Map());
  const totals = new Map(), dayCount = new Map();
  for (const r of recs) {
    const d = new Date(r.d); d.setHours(0, 0, 0, 0);
    const i = Math.round((d - start) / 86400000);
    if (i < 0 || i >= days) continue;
    const g = groupOf(r);
    perDay[i].set(g, (perDay[i].get(g) || 0) + 1);
    totals.set(g, (totals.get(g) || 0) + 1);
  }
  perDay.forEach(m => m.forEach((_, g) => dayCount.set(g, (dayCount.get(g) || 0) + 1)));
  const maxDay = Math.max(1, ...perDay.map(m => [...m.values()].reduce((a, b) => a + b, 0)));
  const step = Math.max(1, Math.ceil(maxDay / 3));
  const top = step * 3;

  const lines = [0, 1, 2, 3].map(k => {
    const pct = 100 - (k * step / top) * 100;
    return `<div class="barGridLine" style="top:calc(${pct.toFixed(1)}% * (150 - 20) / 150)"><span>${k * step}</span></div>`;
  }).join('');
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const cols = perDay.map((m, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const total = [...m.values()].reduce((a, b) => a + b, 0);
    const segs = groups.filter(g => m.get(g)).map(g =>
      `<i style="height:${(m.get(g) / top * 100).toFixed(2)}%;background:${colorOf(g)}"></i>`).join('');
    const tip = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]}) · ` +
      (total ? groups.filter(g => m.get(g)).map(g => `${g} ${m.get(g)}`).join(' · ') : '쉼');
    const isToday = d.getTime() === today.getTime() ? ' today' : '';
    const anim = animate ? ` style="animation-delay:${Math.round(i * 600 / days)}ms"` : ' style="animation:none"';
    return `<div class="barCol${isToday}" title="${tip}"${anim}>${segs}</div>`;
  }).join('');
  const ticks = 5;
  const labels = Array.from({ length: ticks }, (_, k) => {
    const i = Math.round(k * (days - 1) / (ticks - 1));
    const d = new Date(start); d.setDate(start.getDate() + i);
    const left = ((i + 0.5) / days * 100).toFixed(1);
    // 양 끝 라벨은 가운데 정렬하면 카드 밖으로 삐져나가 잘린다 — 안쪽으로 붙인다.
    const shift = k === 0 ? 'translateX(0);left:0' : k === ticks - 1 ? 'translateX(0);left:auto;right:0' : '';
    return `<span style="left:${left}%${shift ? `;transform:${shift}` : ''}">${d.getMonth() + 1}월 ${d.getDate()}일</span>`;
  }).join('');
  chart.style.setProperty('--bars', days);
  chart.innerHTML = `${lines}<div class="barCols" style="--bars:${days}">${cols}</div><div class="barAxis">${labels}</div>`;

  const all = [...totals.values()].reduce((a, b) => a + b, 0) || 1;
  legend.innerHTML = groups.filter(g => totals.get(g)).map(g => `
    <div class="barRow">
      <span class="dot" style="background:${colorOf(g)}"></span>
      <span class="nm">${escapeHtml(g)}</span>
      <span class="sub">기록 ${totals.get(g)}개 · ${dayCount.get(g)}일</span>
      <span class="pc">${(totals.get(g) / all * 100).toFixed(1)}%</span>
    </div>`).join('');
}

/** 오늘(오늘 아직 안 했으면 어제)까지 이어진 연속 작업 일수와, 기간 안 최장 연속. */
function heatStreaks(perDay, today, since) {
  const has = (d) => (perDay.get(dayKeyOf(d)) || 0) > 0;
  let current = 0;
  const d = new Date(today);
  if (!has(d)) d.setDate(d.getDate() - 1);
  while (has(d) && (!since || d >= since)) { current++; d.setDate(d.getDate() - 1); }
  const keys = [...perDay.keys()].map(k => { const [y, mo, da] = k.split('-').map(Number); return new Date(y, mo - 1, da); })
    .filter(x => !since || x >= since).sort((a, b) => a - b);
  let longest = 0, run = 0, prev = null;
  for (const x of keys) {
    run = prev && Math.round((x - prev) / 86400000) === 1 ? run + 1 : 1;
    longest = Math.max(longest, run); prev = x;
  }
  return { current, longest };
}

/* ===== 지난 프로젝트 목록 ===== */
let pastIndex = null;      // projects/index.json — 창을 처음 열 때만 받아온다
let pastCurrentId = null;  // 지금 화면에 떠 있는 프로젝트

function initPastProjects() {
  const btn = document.getElementById('pastBtn');
  const back = document.getElementById('pastModal');
  const close = document.getElementById('pastClose');
  if (!btn || !back) return;

  const open = async () => {
    sfx('whoosh');
    back.hidden = false;
    if (!pastIndex) {
      document.getElementById('pastBody').innerHTML = '<div class="empty">불러오는 중…</div>';
      try {
        pastIndex = await fetchData('projects/index.json');
      } catch (e) {
        document.getElementById('pastBody').innerHTML = '<div class="empty">목록을 불러오지 못했어요</div>';
        return;
      }
    }
    renderPastList();
  };
  const shut = () => { back.hidden = true; };

  btn.addEventListener('click', open);
  close.addEventListener('click', shut);
  back.addEventListener('click', (ev) => { if (ev.target === back) shut(); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !back.hidden) shut(); });

  document.getElementById('pastBody').addEventListener('click', async (ev) => {
    const row = ev.target.closest('.pastRow');
    if (!row) return;
    shut();
    await openProject(row.dataset.id);
  });
}

function renderPastList() {
  const body = document.getElementById('pastBody');
  const list = (pastIndex && pastIndex.projects) || [];
  const current = pastCurrentId || (pastIndex && pastIndex.currentId);
  document.getElementById('pastMeta').textContent = `${list.length}개`;
  if (list.length === 0) {
    body.innerHTML = '<div class="empty">아직 프로젝트가 없어요</div>';
    return;
  }
  body.innerHTML = list.map((p) => {
    const done = p.status === 'completed';
    // 목록에는 편집 시간 · 완료 날짜 · 전편 이후 간격만. 나머지는 눌러서 들어가면 다 있다.
    const facts = [];
    if (p.totalDuration != null) facts.push(`<span>편집 <b>${formatSpan(p.totalDuration)}</b></span>`);
    if (p.completedAt) facts.push(`<span>완료 <b class="dFull">${formatDateShort(p.completedAt)}</b><b class="dShort">${formatDateCompact(p.completedAt)}</b></span>`);
    if (p.daysSincePreviousCompletion != null) facts.push(`<span>전편 이후 <b>${p.daysSincePreviousCompletion}일</b></span>`);
    return `
      <button type="button" class="pastRow${p.id === current ? ' current' : ''}" data-id="${escapeHtml(p.id)}">
        <span class="pastTopic">${escapeHtml(p.topic || '(제목 없음)')}</span>
        <span class="pastState ${done ? 'done' : 'wip'}">${done ? '완료' : '편집 중'}</span>
        <span class="pastFacts">${facts.join('')}</span>
      </button>
    `;
  }).join('');
}

/** 고른 프로젝트의 전체 스냅샷을 그때 받아와서 화면을 다시 그린다. */
async function openProject(id) {
  if (!id) return;
  try {
    const data = await fetchData(`projects/${encodeURIComponent(id)}.json`);
    // 목록에서 지금 프로젝트를 다시 고른 거면 첫 화면으로 돌아온 것 — 자동 갱신을 계속 받는다.
    const isCurrent = pastIndex && id === pastIndex.currentId;
    pastCurrentId = isCurrent ? null : id;
    if (isCurrent) shownSignature = snapshotSignature(data);
    renderProject(data, { fireworks: false });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    console.warn('프로젝트를 불러오지 못했습니다', e);

/** 목록용 날짜 (예: "2026년 9월 4일"). 지난 프로젝트는 해를 넘겨 쌓이므로 연도까지 적는다. */
function formatDateShort(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}

/** 좁은 화면용 짧은 날짜 (예: "2026.9.4"). 연도는 그대로 두고 글자 수만 줄인다. */
function formatDateCompact(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}

/** 초 단위 소요시간을 "7일 21시간"처럼. */
function formatSpan(seconds) {
  const totalMinutes = Math.max(0, Math.round(seconds)) / 60;
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = Math.floor(totalMinutes % 60);
  const parts = [];
  if (days) parts.push(`${days}일`);
  if (hours) parts.push(`${hours}시간`);
  if (!parts.length) parts.push(`${minutes}분`);
  return parts.join(' ');
}

/** "4:32" -> 272, "24" -> 24. 숫자로 못 읽으면 null. */
function parseMinutes(s) {
  if (s === null || s === undefined || s === '') return null;
  const str = String(s);
  const total = str.includes(':')
    ? str.split(':').map(Number).reduce((h, m) => h * 60 + m, 0)
    : Number(str);
  return Number.isFinite(total) ? total : null;
}

function formatMinutes(totalMinutes) {
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (hours > 0) parts.push(`${hours}시간`);
  if (minutes > 0 || parts.length === 0) parts.push(`${minutes}분`);
  return parts.join(' ');
}

function normalizeLength(s) {
  if (s === null || s === undefined || s === '') return null;
  const total = parseMinutes(s);
  return total === null ? String(s) : formatMinutes(total);
}

function formatDuration(ms) {
  const totalMinutes = Math.max(0, Math.round(ms / 60000));
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;
  const parts = [];
  if (days > 0) parts.push(`${days}일`);
  if (hours > 0) parts.push(`${hours}시간`);
  if (minutes > 0 || parts.length === 0) parts.push(`${minutes}분`);
  return parts.join(' ');
}

function renderCompletion(data) {
  if (data.status !== 'completed') return;
  const body = document.getElementById('doneList');
  // 완료 시각이 없는 옛 기록이면 그릴 구간이 없으니 시작 시각만 적는다.
  body.innerHTML = data.completedAt
    ? completionSpanHtml(data)
    : `<div>시작 시각: ${escapeHtml(formatDateTime(data.createdAt))}</div>`;
  document.getElementById('doneCard').style.display = '';
}

/** 시작 → 완료 구간을 막대 하나로. 막대는 하루마다 눈금으로 끊고, 그 위에 실제로 작업을
    기록한 순간을 점으로 찍어 "며칠에 걸쳐 언제 몰아서 했는지"가 한눈에 보이게 한다.
    막대가 왼쪽에서 차오르고, 점은 막대가 지나가는 순서대로 켜진다. */
function completionSpanHtml(data) {
  const t0 = new Date(data.createdAt).getTime();
  const t1 = new Date(data.completedAt).getTime();
  const span = Math.max(1, t1 - t0);
  const at = (t) => Math.max(0, Math.min(100, ((t - t0) / span) * 100));
  const FILL_S = 2.0;   // 막대가 다 차는 시간 (CSS spanFill과 같게)
  // 막대는 완료로 갈수록 가속한다 — 위치 = 진행^2.4 (CSS의 linear() 곡선과 같은 식).
  // 그래서 점이 켜지는 시각도 거꾸로 풀어 위치^(1/2.4) × 시간으로 잡아야 막대 끝과 맞는다.
  const FILL_EXP = 2.4;
  const reachAt = (x) => Math.pow(x / 100, 1 / FILL_EXP) * FILL_S;

  // 자정마다 눈금
  const ticks = [];
  const mid = new Date(t0); mid.setHours(24, 0, 0, 0);
  for (let t = mid.getTime(); t < t1; t += 86400000) ticks.push(at(t));

  const dots = (data.entries || [])
    .map(e => new Date(e.timestamp).getTime())
    .filter(t => Number.isFinite(t) && t >= t0 && t <= t1)
    .map(t => at(t));

  return `
    <div class="spanViz" role="img" aria-label="${escapeHtml(`${formatDateTime(data.createdAt)} 시작, ${formatDateTime(data.completedAt)} 완료, 총 ${formatDuration(span)}`)}">
      <div class="spanTotal">
        <span class="lbl">총 소요시간</span>
        <span class="val">${escapeHtml(formatDuration(span))}</span>
        <span class="days mono">작업 기록 ${dots.length}개</span>
      </div>
      <div class="spanTrack">
        <span class="spanFill"></span>
        ${ticks.map(x => `<i class="spanTick" style="left:${x.toFixed(2)}%"></i>`).join('')}
        ${dots.map(x => `<i class="spanDot" style="left:${x.toFixed(2)}%;animation-delay:${reachAt(x).toFixed(2)}s"></i>`).join('')}
        <span class="spanEnd start"></span>
        <span class="spanEnd finish" style="animation-delay:${FILL_S}s"></span>
      </div>
      <div class="spanEnds">
        <div><span class="k">시작</span><span class="d">${escapeHtml(formatDayLabel(data.createdAt))}</span><span class="t mono">${escapeHtml(formatTimeOnly(data.createdAt))}</span></div>
        <div class="r"><span class="k">완료</span><span class="d">${escapeHtml(formatDayLabel(data.completedAt))}</span><span class="t mono">${escapeHtml(formatTimeOnly(data.completedAt))}</span></div>
      </div>
    </div>`;
}

/** 영상 길이 카드는 끝난 프로젝트에선 완료 카드 바로 밑으로, 아니면 오른쪽 열 맨 위로. */
function placeStatsCard(data) {
  const stats = document.getElementById('statsWrap');
  const done = document.getElementById('doneCard');
  const right = document.querySelector('.colRight');
  if (!stats || !done || !right) return;
  if (data.status === 'completed') {
    if (done.nextElementSibling !== stats) done.after(stats);
  } else if (right.firstElementChild !== stats) {
    right.prepend(stats);
  }
}

/** 미리보기 한 칸. 완료된 프로젝트는 유튜브 썸네일(눌러서 영상으로),
    아직 진행 중이면 앱에서 넣어둔 편집 캡처를 보여준다. 둘 다 없으면 자리째 접는다. */
function renderThumb(data) {
  if (data.youtubeId) { renderYouTubeThumb(data.youtubeId); return; }
  renderStillThumb(data.previewImage);
}

/** 앱에서 넣어둔 편집 중 캡처. 누를 곳이 없으니 링크도 재생 표시도 없다. */
function renderStillThumb(path) {
  const link = document.getElementById('ytThumb');
  const img = document.getElementById('ytImg');
  const tag = document.getElementById('thumbTag');
  if (!link || !img) return;
  if (!path) { renderYouTubeThumb(null); return; }

  img.onerror = () => { link.hidden = true; };
  img.onload = null;
  link.classList.add('still');
  link.removeAttribute('href');
  link.removeAttribute('target');
  if (tag) tag.hidden = false;
  img.alt = '편집 중 캡처';
  img.src = path;
  link.hidden = false;
}

/** 완성 영상 썸네일. 링크가 없으면 자리째 접는다 (프로젝트를 바꿔도 남지 않게). */
function renderYouTubeThumb(videoId) {
  const link = document.getElementById('ytThumb');
  const img = document.getElementById('ytImg');
  const tag = document.getElementById('thumbTag');
  if (!link || !img) return;
  link.classList.remove('still');
  if (tag) tag.hidden = true;
  img.alt = '완성 영상 썸네일';
  if (!videoId) {
    // 앞 영상의 onerror가 남아 있으면 src를 걷어낼 때 엉뚱한 요청이 한 번 더 나간다.
    img.onerror = null; img.onload = null;
    link.hidden = true; img.removeAttribute('src');
    link.removeAttribute('href');
    return;
  }
  link.target = '_blank';

  link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
  const url = (name) => `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/${name}.jpg`;

  // 폰에서는 maxres(1280x720)를 쓰지 않는다. 썸네일 자리가 340px 남짓이라 화질 차이는
  // 거의 없는데, 큰 이미지를 디코딩하면 그만큼 GPU 메모리를 먹어 다른 레이어(도넛 링·
  // 카드 배경)가 스크롤 뒤 다시 그려질 때 밀려나는 일이 생긴다. hq(480x360)면 충분하다.
  const wide = matchMedia('(min-width: 900px)').matches;

  // maxres가 없는 영상이 있다. 보통은 404라 onerror로 잡히지만, 가끔 120x90짜리
  // 회색 자리표를 200으로 돌려주기도 해서 그때는 크기를 보고 걸러낸다.
  const fallback = () => {
    if (img.dataset.fallback === '1') return;
    img.dataset.fallback = '1';
    img.src = url('hqdefault');
  };
  img.onerror = fallback;
  img.onload = () => { if (img.naturalWidth <= 121) fallback(); };
  delete img.dataset.fallback;
  if (wide) {
    img.src = url('maxresdefault');
  } else {
    img.dataset.fallback = '1';   // 이미 hq다 — 더 떨어질 곳이 없다
    img.src = url('hqdefault');
  }
  link.hidden = false;
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMin = Math.round((now - then) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return diffHour + '시간 전';
  // 하루가 넘으면 "3일 전"으로 뭉뚱그리지 않고 남는 시간까지 보여준다.
  const days = Math.floor(diffHour / 24);
  const hours = diffHour % 24;
  return hours ? `${days}일 ${hours}시간 전` : `${days}일 전`;
}

const WEEKDAYS = ['일','월','화','수','목','금','토'];

function formatTimeOnly(iso) {
  const d = new Date(iso);
  const h24 = d.getHours();
  const period = h24 < 12 ? '오전' : '오후';
  let h12 = h24 % 12;
  if (h12 === 0) h12 = 12;
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${period} ${h12}:${mi}`;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]}) ${formatTimeOnly(iso)}`;
}

function formatDayLabel(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
}

    행 왼쪽 바와 같은 그룹 색을 그대로 따라간다. */
const SYMBOL_SVG = {

  'map': '<path d="M9 4 3 6.6v13.6L9 17.6l6 2.6 6-2.6V4l-6 2.6z"/><path d="M9 4v13.6M15 6.6v13.6"/>',
  'music.note': '<path d="M9 18.2V6.1l11-2v12.1"/><circle cx="6" cy="18.2" r="3"/><circle cx="17" cy="16.2" r="3"/>',
  'checkmark.seal': '<path d="M12 2.8l2.3 1.8 2.9-.2.9 2.8 2.5 1.5-1 2.7 1 2.7-2.5 1.5-.9 2.8-2.9-.2L12 21.2l-2.3-1.8-2.9.2-.9-2.8-2.5-1.5 1-2.7-1-2.7 2.5-1.5.9-2.8 2.9.2z"/><path d="M8.7 12.1l2.3 2.3 4.3-4.5"/>',
  'text.below.photo': '<rect x="3" y="3.8" width="18" height="10.4" rx="2"/><path d="M3 17.6h18M3 20.6h12"/>',
  'flag': '<path d="M5 21.2V3.6"/><path d="M5 4.6h11l-1.6 3.6L16 12H5z"/>',
  'trophy': '<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5.4H4.4v1.4a3.4 3.4 0 0 0 3 3.4"/><path d="M17 5.4h2.6v1.4a3.4 3.4 0 0 1-3 3.4"/><path d="M12 14v3.4"/><path d="M8.6 20.4h6.8l-.7-3H9.3z"/>',
};

/** 작업 기록 표 아이콘 이름을 정한다.
    "완료"는 카테고리 목록에 없어 앱이 flag를 보내지만, 끝을 알리는 기록이라 트로피로 바꾼다. */
function entryIconName(category, symbolName) {
  return category === '완료' ? 'trophy' : symbolName;
}

function categorySvg(symbolName) {
  const inner = SYMBOL_SVG[symbolName] || '<circle cx="12" cy="12" r="7.5"/>';
  return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${inner}</svg>`;
}

/** 카테고리 이름 -> "--rowc:<그룹색>;" 인라인 스타일 조각을 만드는 함수를 돌려준다.
    작업 기록 표와 전체 진행 단계가 같은 색을 쓰도록 한 곳에서 정의한다.
    그룹 이름이 바뀌어도 깨지지 않게 이름이 아닌 '등장 순서'로 토큰을 고르고,
    목록에 없는 카테고리("완료" 등)는 아예 정의하지 않아 기본 회색으로 떨어지게 한다. */
function makeGroupColorVar(data) {
  const groupNames = [...new Set((data.allCategories || []).map(c => c.group))];
  const groupByCat = {};
  (data.allCategories || []).forEach(c => { groupByCat[c.name] = c.group; });
  return (catName) => {
    // 프로젝트 완료 기록은 카테고리 목록에 없지만, 끝을 알리는 줄이라 금색을 따로 준다.
    if (catName === '완료') return '--rowc:var(--gold);';
    const gi = groupNames.indexOf(groupByCat[catName]);
    return gi < 0 ? '' : `--rowc:var(--grp-${Math.min(gi, 3) + 1});`;
  };
}

function pipelineProgress(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return null;
  const touchedNames = new Set((data.entries || []).map(e => e.category).filter(Boolean));
  let lastTouchedIndex = -1;
  cats.forEach((c, i) => { if (touchedNames.has(c.name)) lastTouchedIndex = Math.max(lastTouchedIndex, i); });
  // 완료 처리된 회차는 건너뛴 단계가 있어도(나중에 생긴 단계 등) 끝난 것이다 — 100%로 본다.
  if (data.status === 'completed') {
    const tw = cats.reduce((sum, c) => sum + catWeight(c), 0);
    return { done: cats.length, total: cats.length, pct: 100, lastTouchedIndex: cats.length - 1,
             stage: null, weights: cats.map(catWeight), totalWeight: tw };
  }
  // 마지막으로 손댄 단계는 지금 '진행 중'이라 아직 완료가 아니다.
  // 프로젝트가 완료 처리됐을 때만 그 단계까지 완료로 센다.
  const done = Math.max(data.status === 'completed' ? lastTouchedIndex + 1 : lastTouchedIndex, 0);
  // %는 단계 개수가 아니라 앱에서 정한 비중의 합으로 낸다 (비중이 없던 예전 데이터는 전부 1).
  const totalWeight = cats.reduce((sum, c) => sum + catWeight(c), 0);
  const doneWeight = cats.slice(0, done).reduce((sum, c) => sum + catWeight(c), 0);
  // 지금 하고 있는 단계는 통째로 비었다고 보지 않고, 그 안에서 어디까지 왔는지까지 센다.
  const stage = data.status === 'completed' || lastTouchedIndex < 0
    ? null
    : stageDetail(data, cats[lastTouchedIndex]);
  const stageWeight = stage ? catWeight(cats[lastTouchedIndex]) * stage.frac : 0;
  const pct = totalWeight > 0 ? Math.round(((doneWeight + stageWeight) / totalWeight) * 100) : 0;
  return { done, total: cats.length, pct, lastTouchedIndex, stage, weights: cats.map(catWeight), totalWeight };
}

/** 지금 하고 있는 단계 안에서 얼마나 왔는지 — [시작 시점 / 기준 영상 길이].
    기준 영상 길이는 컷 편집이면 촬영 원본 × 배율(앱 설정), 그 뒤 단계면 컷편집 후 영상 길이다.
    시작 시점을 안 남기는 단계(기록에 —로 뜨는 단계)나 기준 길이를 아직 모를 때는 없는 셈 친다. */
function stageDetail(data, cat) {
  if (!cat || cat.tracksLength === false) return null;

  // 그룹 이름은 앱에서 바꿀 수 있어 값으로 받아 온다. 예전 스냅샷이면 첫 그룹이 컷 편집이다.
  const cuttingGroup = data.cuttingGroup || ((data.allCategories || [])[0] || {}).group;
  let base;
  if (cat.group === cuttingGroup) {
    const original = parseMinutes(data.originalLength);
    const ratio = Number(data.cutBaselineRatio);
    base = original === null ? null : original * (Number.isFinite(ratio) && ratio > 0 ? ratio : 0.2);
  } else {
    base = parseMinutes(data.detailCutLength);
  }
  if (!base || base <= 0) return null;

  // 같은 단계를 여러 번 적었으면 마지막에 남긴 시작 시점이 '지금 어디까지'다.
  const marks = (data.entries || [])
    .filter(e => e.category === cat.name && parseMinutes(e.videoLength) !== null);
  if (!marks.length) return null;

  const at = parseMinutes(marks[marks.length - 1].videoLength);
  return { at, base, frac: Math.max(0, Math.min(1, at / base)) };
}

/** 카테고리 비중. 값이 없거나 이상하면 1로 본다. */
function catWeight(c) {
  const w = Number(c && c.weight);
  return Number.isFinite(w) && w > 0 ? w : 1;
}

/** 단계 구분 눈금의 두께(도). 12시 표시도 같은 눈금을 쓴다. */
const TICK = 1.6;

/** 진행률(%)을 링 그라디언트로. 12시는 눈금이 끊어주므로 링 자체는 360도를 다 쓴다.
    conic-gradient의 딱 떨어지는 색 경계는 브라우저가 계단 현상을 풀어주지 않아서
    지글지글해 보인다 — 경계 앞뒤로 0.35도씩 섞어 매끈하게 만든다. (0%·100%에서 생기는
    아주 가는 번짐은 12시 눈금이 덮는다.) */
const RING_FEATHER = 0.35;
function donutRing(pct) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const deg = p * 3.6;
  const a = (deg - RING_FEATHER).toFixed(2), b = (deg + RING_FEATHER).toFixed(2);
  // 채운 만큼 민트 → 하늘 → 보라 → 분홍으로 흐른다 (앱 링과 같은 그라데이션).
  const d = Math.max(Number(a), 0.01);
  return `conic-gradient(var(--grp-1) 0deg, var(--grp-2) ${(d * 0.36).toFixed(2)}deg, ` +
    `var(--grp-3) ${(d * 0.7).toFixed(2)}deg, var(--grp-4) ${a}deg, var(--surface2) ${b}deg 360deg)`;
}

/** 도넛 링을 끊어주는 눈금. 단계 경계마다 하나씩, 그리고 12시(시작점)에도 하나.
    예전엔 conic-gradient의 딱 떨어지는 색 경계로 그렸는데, 브라우저가 그 경계를
    부드럽게 풀어주지 않아 가는 눈금이 계단처럼 깨져 보였다. 이제는 링 위에 SVG 조각을
    얹는다 — 벡터라 어느 크기·어느 화면 배율에서도 가장자리가 매끈하다.
    조각 모양은 예전과 같다: 가운데서 퍼지는 부채꼴이라 바깥쪽이 조금 더 두껍다. */
function donutTicks(progress) {
  const angles = [0];   // 12시 시작점
  if (progress && progress.totalWeight) {
    let acc = 0;
    progress.weights.slice(0, -1).forEach((w) => {
      acc += (w / progress.totalWeight) * 360;
      angles.push(acc);
    });
  }
  // viewBox 100 기준. 안쪽 원(.in)이 반지름 약 38이라 그보다 조금 안에서 시작하면
  // 링 폭 전체를 빈틈 없이 끊고, 남는 부분은 안쪽 원이 덮는다.
  const R_OUT = 50, R_IN = 34, half = (TICK / 2) * Math.PI / 180;
  const pt = (r, t) => `${(50 + r * Math.sin(t)).toFixed(3)} ${(50 - r * Math.cos(t)).toFixed(3)}`;
  const d = angles.map((deg) => {
    const t = deg * Math.PI / 180;
    return `M${pt(R_IN, t - half)}L${pt(R_OUT, t - half)}L${pt(R_OUT, t + half)}L${pt(R_IN, t + half)}Z`;
  }).join('');
  return `<svg class="donutTicks" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="${d}"/></svg>`;
}

function renderSummary(cardEl, data) {
  const isCompleted = data.status === 'completed';
  const progress = pipelineProgress(data);
  const pct = progress ? progress.pct : 0;
  const statusLabel = isCompleted ? '완료' : '편집 중';
  const stageText = isCompleted ? null : data.currentStage;
  // 시작하고 얼마나 지났는지. 완료된 프로젝트는 완료 카드에 총 소요시간이 따로 있다.
  const sinceIso = isCompleted ? null : data.createdAt;
  const stageCat = stageText ? (data.allCategories || []).find(c => c.name === stageText) : null;
  const stageIcon = stageText ? categorySvg(stageCat ? stageCat.symbolName : null) : '';
  heroPct = pct;
  // 다른 탭에 있어도 진행률이 보이도록 탭 제목에도 넣는다.
  document.title = `태태고 편집실 · 진행률 ${pct}%`;
  heroCompleted = isCompleted;

  const entries = data.entries || [];
  const lastEntryTime = entries.length ? entries[entries.length - 1].timestamp : null;
  // 완료된 프로젝트는 '발행한 때'가 아니라 '끝낸 때'를 기준으로 세야 한다 —
  // 지난 프로젝트를 열어보면 발행 시각은 방금이라 "완료 · 방금 전"이 돼버린다.
  const chipTime = isCompleted
    ? (data.completedAt ?? data.lastUpdate)
    : (lastEntryTime ?? data.lastUpdate);

  // ② 마지막 기록이 30분 안이면 LIVE. 1분마다 updateLive()가 다시 본다.
  const liveSince = !isCompleted && lastEntryTime ? lastEntryTime : '';

  // 완료된 회차는 오른쪽이 휑하지 않게 총 소요·완성 길이를 올린다.
  let doneStats = '';
  if (isCompleted && data.completedAt) {
    const span = (new Date(data.completedAt) - new Date(data.createdAt)) / 1000;
    const finalLen = normalizeLength(data.finalLength);
    doneStats = `
      <div class="heroStat"><span class="stageLabel">총 소요</span><b>${escapeHtml(formatSpan(span))}</b></div>
      ${finalLen ? `<div class="heroStat"><span class="stageLabel">완성 영상</span><b>${escapeHtml(finalLen)}</b></div>` : ''}`;
  }

  cardEl.style.display = '';
  cardEl.innerHTML = `
    <span class="heroBg" aria-hidden="true"></span>
    <div class="donut" id="donutGauge" style="background: ${donutRing(0)}">
      <canvas id="liquidCanvas"></canvas>
      <span class="donutGlow" aria-hidden="true"></span>
      <span class="donutSpark" id="donutSpark" aria-hidden="true"><span class="tip"></span></span>
      <div class="in">
        <span class="pct mono" id="donutPct">0%</span>
        <span class="steps mono">${progress ? `${progress.done} / ${progress.total}` : '0 / 0'}</span>
      </div>
      ${donutTicks(progress)}
    </div>
    <div class="heroRight">
      <div class="chipRow">
        <span class="statusChip${isCompleted ? '' : ' wip'}">${statusLabel}${chipTime ? ` · ${relativeTime(chipTime)}` : ''}</span>
        <span class="liveBadge" data-since="${escapeHtml(liveSince)}" data-session="${escapeHtml(sessionStart(entries))}" ${isLive(liveSince) ? '' : 'hidden'}><i></i>LIVE <span class="rec">${recCode(sessionStart(entries))}</span></span>
      </div>
      <span class="topic">${escapeHtml(data.projectTopic ?? '제목 없음')}</span>
      ${stageText ? `
        <div style="display:flex;flex-direction:column;gap:2px">
          <span class="stageLabel">현재 단계</span>
          <span class="stageName"><span class="stageIcon">${stageIcon}</span>${escapeHtml(stageText)}</span>
        </div>` : ''}
      ${sinceIso || doneStats ? `
        <div class="heroStats">
          ${sinceIso ? `
            <div class="sinceBlock heroStat" title="${escapeHtml(formatDateTime(sinceIso))} 시작">
              <span class="stageLabel">에피소드 편집 시작 후</span>
              <span class="sinceVal" data-count="${elapsedMinutes(sinceIso)}" data-fmt="span" data-since="${escapeHtml(sinceIso)}">${elapsedText(sinceIso)}</span>
            </div>
            <div class="heroStat paceBlock" id="paceBlock" hidden></div>` : ''}
          ${doneStats}
        </div>` : ''}
      <button type="button" class="gaugeSwap" id="gaugeSwap">🌊 물결로 보기</button>
    </div>
    ${entries.length >= 2 ? `<span class="heroWave" title="편집 파형 — 이번 에피소드를 시간순으로 펼친 것. 작업 기록이 몰린 때일수록 크게 솟아요" role="img" aria-label="편집 파형">${waveSvg(entries.map(e => e.timestamp), data.createdAt, isCompleted ? (data.completedAt ?? lastEntryTime) : new Date().toISOString())}</span>` : ''}
  `;
  cardEl.classList.toggle('hasWave', entries.length >= 2);
  setHeroBackdrop(cardEl, data);
  paceData = isCompleted ? null : data;
  renderPace();
}

/* ===== 페이스 — 지금 단계에 닿기까지 걸린 시간을 지난 회차들과 비교한다 ===== */
let paceData = null;   // 지금 히어로에 떠 있는 편집 중 회차 (완료 회차면 null)

function paceEstimate(data, act) {
  if (!data || !act || !(act.records || []).length || !data.currentStage) return null;
  const stageIdx = act.categories.indexOf(data.currentStage);
  const doneIdx = act.categories.indexOf('완료');
  if (stageIdx < 0 || doneIdx < 0) return null;
  // 회차별로 기록을 모은다 — 세 번째 값이 회차 번호.
  const eps = new Map();
  for (const [ts, cat, ep] of act.records) {
    if (!eps.has(ep)) eps.set(ep, []);
    eps.get(ep).push([ts, cat]);
  }
  // 첫 기록이 이 회차 시작 시각과 가장 가까운 회차가 지금 회차다.
  const start = new Date(data.createdAt).getTime() / 1000;
  let cur = null, best = Infinity;
  for (const [ep, rs] of eps) {
    const d = Math.abs(Math.min(...rs.map(r => r[0])) - start);
    if (d < best) { best = d; cur = ep; }
  }
  if (cur === null || best > 3600) return null;
  const firstAt = (rs, idx) => { const t = rs.filter(r => r[1] >= idx).map(r => r[0]); return t.length ? Math.min(...t) : null; };
  const curRs = eps.get(cur);
  const curStart = Math.min(...curRs.map(r => r[0]));
  const curReach = firstAt(curRs, stageIdx);
  if (curReach === null) return null;
  // 완료까지 간 지난 회차만 비교 대상으로 쓴다.
  const past = [];
  for (const [ep, rs] of eps) {
    if (ep === cur) continue;
    const s0 = Math.min(...rs.map(r => r[0]));
    const reach = firstAt(rs, stageIdx), end = firstAt(rs, doneIdx);
    if (reach === null || end === null) continue;
    past.push({ toStage: reach - s0 });
  }
  if (!past.length) return null;
  const avg = k => past.reduce((a, p) => a + p[k], 0) / past.length;
  return {
    diff: avg('toStage') - (curReach - curStart),   // +면 지난 평균보다 빠르다
    n: past.length,
  };
}

function renderPace() {
  const el = document.getElementById('paceBlock');
  if (!el) return;
  const p = paceEstimate(paceData, heatData);
  if (!p) { el.hidden = true; return; }
  const fast = p.diff >= 0;
  const gap = Math.abs(p.diff);
  const paceText = gap < 3 * 3600 ? '지난 평균과 비슷한 페이스' : `지난 평균보다 ${formatSpan(gap)} ${fast ? '빨라요' : '늦어요'}`;
  el.hidden = false;
  el.title = `'${paceData.currentStage}' 단계에 닿기까지 걸린 시간을 지난 에피소드 ${p.n}개 평균과 비교해요`;
  el.innerHTML = `
    <span class="stageLabel">페이스</span>
    <span class="paceChip ${gap < 3 * 3600 ? '' : fast ? 'fast' : 'slow'}">${fast && gap >= 3 * 3600 ? '⚡ ' : ''}${escapeHtml(paceText)}</span>`;
}

/** ① 히어로 배경 — 완성 영상이면 유튜브 썸네일, 편집 중이면 캡처를 흐리게 깐다.
    캡처는 같은 출처라 64px로 줄여서 넣는다 (늘리면 자연히 흐릿하고 가볍다). */
function setHeroBackdrop(card, data) {
  card.classList.remove('hasBg');
  card.style.removeProperty('--heroImg');
  const yt = data.youtubeId;
  const src = yt ? `https://img.youtube.com/vi/${encodeURIComponent(yt)}/mqdefault.jpg` : data.previewImage;
  card._bgSrc = src || null;
  if (!src) return;
  const img = new Image();
  img.onload = () => {
    if (card._bgSrc !== src) return;          // 그사이 다른 회차로 바뀌었다
    let url = src;
    if (!yt) {
      try {
        const c = document.createElement('canvas');
        c.width = 64; c.height = Math.max(1, Math.round(64 * img.naturalHeight / img.naturalWidth));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL('image/jpeg', 0.7);
      } catch (e) { /* 줄이지 못하면 원본 그대로 */ }
    }
    card.style.setProperty('--heroImg', `url("${url}")`);
    card.classList.add('hasBg');
  };
  img.src = src;
}

/** 편집 파형 SVG — 기록을 시간축 칸에 모아 좌우로 번지게 한 뒤 막대 높이로 (앱과 같은 식). */
function waveSvg(timestamps, startIso, endIso) {
  const bars = matchMedia('(max-width: 560px)').matches ? 56 : 96;
  const start = new Date(startIso).getTime();
  const span = Math.max(new Date(endIso).getTime() - start, 60000);
  const raw = new Array(bars).fill(0);
  for (const t of timestamps) {
    const i = Math.min(bars - 1, Math.max(0, Math.floor((new Date(t).getTime() - start) / span * bars)));
    raw[i] += 1;
  }
  const k = [0.08, 0.2, 0.44, 1, 0.44, 0.2, 0.08];
  const smooth = raw.map((_, i) => k.reduce((acc, w, j) => acc + (raw[i + j - 3] || 0) * w, 0));
  const peak = Math.max(...smooth, 0.001);
  const W = bars * 10, H = 40;
  let rects = '';
  smooth.forEach((v, i) => {
    const ripple = 0.06 + 0.05 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.63));
    const h = Math.max(2, Math.min(1, v / peak * 0.94 + ripple) * H);
    rects += `<rect x="${i * 10 + 2}" y="${((H - h) / 2).toFixed(1)}" width="6" height="${h.toFixed(1)}" rx="3"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="waveGrad" x1="0" x2="1">` +
    `<stop offset="0" style="stop-color:var(--grp-1)"/><stop offset=".35" style="stop-color:var(--grp-2)"/>` +
    `<stop offset=".7" style="stop-color:var(--grp-3)"/><stop offset="1" style="stop-color:var(--grp-4)"/>` +
    `</linearGradient></defs><g fill="url(#waveGrad)">${rects}</g></svg>`;
}

/** 이번 작업 세션의 시작 — 마지막 기록에서 거꾸로, 간격이 90분 넘게 벌어지기 전까지. */
function sessionStart(entries) {
  const ts = entries.map(e => new Date(e.timestamp).getTime()).sort((a, b) => a - b);
  if (!ts.length) return '';
  let start = ts[ts.length - 1];
  for (let i = ts.length - 2; i >= 0; i--) {
    if (start - ts[i] > 90 * 60 * 1000) break;
    start = ts[i];
  }
  return new Date(start).toISOString();
}

/** 카메라식 타임코드 HH:MM:SS. */
function recCode(sinceIso) {
  if (!sinceIso) return '';
  const sec = Math.max(0, Math.floor((Date.now() - new Date(sinceIso).getTime()) / 1000));
  const p = (n) => String(n).padStart(2, '0');
  return `${p(Math.floor(sec / 3600))}:${p(Math.floor(sec % 3600 / 60))}:${p(sec % 60)}`;
}

/** LIVE가 떠 있는 동안만 초 단위로 타임코드를 돌린다. */
setInterval(() => {
  document.querySelectorAll('.liveBadge:not([hidden]) .rec').forEach(el => {
    el.textContent = recCode(el.parentElement.dataset.session);
  });
}, 1000);

/** ② 마지막 기록이 30분 안인가. */
function isLive(since) {
  return !!since && Date.now() - new Date(since).getTime() < 30 * 60 * 1000;
}

/** ② LIVE 배지는 시간이 지나면 저절로 꺼져야 한다 — 1분마다 다시 본다. */
function updateLive() {
  document.querySelectorAll('.liveBadge[data-since]').forEach(el => { el.hidden = !isLive(el.dataset.since); });
}

function renderPipeline(data) {
  const cats = data.allCategories || [];
  if (cats.length === 0) return;

  // 완료 개수·현재 단계는 도넛과 같은 계산을 써야 두 곳이 어긋나지 않는다.
  const progress = pipelineProgress(data);
  const lastTouchedIndex = progress.lastTouchedIndex;

  const groups = {};
  cats.forEach((c, i) => { (groups[c.group] = groups[c.group] || []).push({ name: c.name, symbolName: c.symbolName, index: i }); });

  // 아이콘 색은 카테고리 칩·작업 기록과 같은 그룹 색을 따른다.
  const iconColorVar = makeGroupColorVar(data);

  // 단계마다 걸린 시간 — 그 단계 첫 기록부터 다음 단계 첫 기록까지. 지금 단계는 지금까지.
  const firstAt = new Map();
  for (const e of data.entries || []) {
    const t = new Date(e.timestamp).getTime();
    if (e.category && !(firstAt.get(e.category) <= t)) firstAt.set(e.category, t);
  }
  const touched = cats.map((c, i) => ({ i, t: firstAt.get(c.name) })).filter(x => x.t != null);
  const durOf = (index) => {
    const k = touched.findIndex(x => x.i === index);
    if (k < 0) return null;
    const next = touched[k + 1];
    const end = next ? next.t : data.status === 'completed' ? new Date(data.completedAt ?? data.lastUpdate).getTime() : Date.now();
    return Math.max(0, (end - touched[k].t) / 1000);
  };
  // 가장 오래 붙잡고 있던 완료 단계엔 🔥 — 이번 회차의 고비.
  const doneDurs = touched.filter(x => x.i < lastTouchedIndex).map(x => durOf(x.i));
  const maxDur = doneDurs.length > 1 ? Math.max(...doneDurs) : null;
  const durTag = (index, isDone, isCurrent) => {
    if (!isDone && !isCurrent) return '';
    const d = durOf(index);
    if (d == null) return '';
    const txt = isCurrent ? `${formatSpan(d)}째` : formatSpan(d);
    const hot = isDone && maxDur != null && d === maxDur;
    return `<span class="pipeDur mono${isCurrent ? ' now' : ''}${hot ? ' hot' : ''}" title="${isCurrent ? '이 단계 시작 후' : '이 단계에 걸린 시간'}">${hot ? '🔥 ' : ''}${escapeHtml(txt)}</span>`;
  };

  let html = '';
  for (const groupName of Object.keys(groups)) {
    const items = groups[groupName].map(c => {
      const isDone = c.index < lastTouchedIndex || (c.index === lastTouchedIndex && data.status === 'completed');
      const isCurrent = c.index === lastTouchedIndex && data.status !== 'completed';
      const cls = isDone ? 'done' : (isCurrent ? 'current' : 'todo');
      const n = String(c.index + 1).padStart(2, '0');
      return `<div class="pipeItem ${cls}" style="${iconColorVar(c.name)}--i:${c.index}"><span class="dot">${isDone ? '✓' : ''}</span><span class="n mono">${n}</span><span class="pipeIcon">${categorySvg(c.symbolName)}</span><span class="name">${escapeHtml(c.name)}</span>${durTag(c.index, isDone, isCurrent)}</div>`;
    }).join('');
    // 그룹 제목도 그 그룹의 카테고리 색을 쓰고, 등장 순서(--i)는 그 그룹 첫 단계에 맞춘다
    // (제목이 자기 그룹 항목들보다 살짝 먼저 올라오도록 CSS에서 딜레이를 조금 당긴다).
    html += `
      <div class="pipeGroup" style="${iconColorVar(groups[groupName][0].name)}--i:${groups[groupName][0].index}">
        <div class="pipeGroupTitle">${escapeHtml(groupName)}</div>
        <div class="pipeList">${items}</div>
      </div>
    `;
  }

  document.getElementById('pipelineBody').innerHTML = html;
  document.getElementById('pipelineMeta').textContent = `${progress.done}/${progress.total} 완료`;
  document.getElementById('pipelineCard').style.display = '';
}

/** count: {n, fmt} 를 주면 로드 시 0에서 n까지 올라가는 카운트업이 붙는다. */
/** 그 시각부터 지금까지 — "3일 5시간"처럼. */
function elapsedText(iso) {
  return formatSpan(Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000));
}

/** 그 시각부터 지금까지 흐른 분. */
function elapsedMinutes(iso) {
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
}

/** '시작 후' 타일은 가만히 둬도 시간이 흐르니 1분마다 다시 쓴다.
    눌러서 다시 셀 때도 지금 값까지 올라가도록 카운트업 목표값도 같이 옮긴다. */
function updateSinceStart() {
  const el = document.querySelector('.sinceVal[data-since]');
  if (!el) return;
  el.dataset.count = elapsedMinutes(el.dataset.since);
  el.textContent = elapsedText(el.dataset.since);
}

/** 숫자 값이면 카운트업용 정보를, 아니면 null (— 같은 빈 값은 애니메이션 없음). */
function counter(raw, fmt) {
  const n = fmt === 'count' ? raw : parseMinutes(raw);
  return n === null || n === undefined ? null : { n, fmt };
}

/** 영상 길이 막대가 차는 시간과 줄마다 밀리는 시간. CSS .lenFill과 같게 둔다. */
const LEN_FILL_MS = 1800;
const LEN_STAGGER_MS = 140;

function renderStats(data) {
  // 촬영 원본 → 컷편집 후 → 완성. 원본을 가득 찬 막대로 두고 나머지는 그 대비 길이로
  // 그려서, 몇 시간짜리가 몇 분으로 줄었는지 숫자를 안 읽어도 보이게 한다.
  const original = parseMinutes(data.originalLength);
  const rows = [
    { label: '촬영 원본', raw: data.originalLength, ratio: null, kind: 'orig' },
    { label: '컷편집 후', raw: data.detailCutLength, ratio: data.detailCutRatio, kind: 'cut' },
    { label: '완성', raw: data.finalLength, ratio: data.finalRatioVsOriginal, kind: 'final' },
  ];
  const mins = rows.map(r => parseMinutes(r.raw));
  // 원본을 안 적었으면 셋 중 가장 긴 걸 가득 찬 막대로 삼는다.
  const base = original || Math.max(0, ...mins.filter(m => m != null));
  const html = rows.map((r, i) => {
    const m = mins[i];
    // 아주 짧아도 막대가 보이게 최소 폭은 남긴다.
    const pct = m != null && base > 0 ? Math.max(2, Math.min(100, (m / base) * 100)) : 0;
    const count = counter(r.raw, 'duration');
    const delayMs = i * LEN_STAGGER_MS;
    const attrs = count
      ? ` data-count="${count.n}" data-fmt="${count.fmt}" data-dur="${LEN_FILL_MS}" data-delay="${delayMs}"`
      : '';
    return `<div class="lenRow ${r.kind}">`
      + `<span class="label">${r.label}</span>`
      + `<span class="lenBar"><span class="lenFill" style="width:${pct.toFixed(1)}%;animation-delay:${delayMs}ms"></span></span>`
      + `<span class="lenVal"><span class="value"${attrs}>${normalizeLength(r.raw) ?? '-'}</span>`
      // 비율도 같은 시간·같은 지연으로 0%부터 같이 오른다.
      + (r.ratio != null
        ? `<span class="ratio"><span class="of">원본의</span> <span class="mono" data-count="${Math.round(r.ratio)}" data-fmt="pct" data-dur="${LEN_FILL_MS}" data-delay="${delayMs}">${Math.round(r.ratio)}%</span></span>`
        : '')
      + `</span></div>`;
  }).join('');
  // 머리글에 '원본 → 완성'을 한 줄로 박아 둔다 — 막대를 읽기 전에 결론이 먼저 보이게.
  const from = normalizeLength(data.originalLength);
  const to = normalizeLength(data.finalLength) ?? normalizeLength(data.detailCutLength);
  const summary = from && to && from !== to
    ? `<span class="lenSummary">${from}<i>→</i>${to}</span>` : '';
  document.getElementById('statsBody').innerHTML =
    `<div class="statTile lenTile"><div class="cardHead"><span class="cardTitle">영상 길이</span>${summary}</div>`
    + `<div class="lenRows">${html}</div></div>`;
  runCounters();
}

/** 통계 타일 숫자를 0에서 목표값까지 올린다 (reduced-motion이면 건너뜀). */
/** 타일 숫자 하나를 0에서 목표값까지 올린다. 애니메이션 도중 다시 부르면 이전 것은 버린다. */
function animateCounter(el) {
  const target = Number(el.dataset.count);
  if (!Number.isFinite(target) || target <= 0) return;
  const render = (n) => {
    el.textContent = el.dataset.fmt === 'count' ? `${n}개`
      : el.dataset.fmt === 'pct' ? `${n}%`
      : el.dataset.fmt === 'span' ? formatSpan(n * 60)
      : formatMinutes(n);
  };
  if (reducedMotion) { render(target); return; }

  // 연타로 rAF 루프가 여러 개 겹쳐 숫자가 튀는 걸 막는다.
  const run = el._countRun = (el._countRun || 0) + 1;
  // 여기서 0으로 미리 덮지 않는다 — 탭이 백그라운드라 rAF가 멈추면
  // 이미 렌더된 실제 값이 그대로 남아야 하기 때문.
  // 막대와 박자를 맞춰야 하는 숫자는 data-dur·data-delay로 시간과 시작 지연을 받는다.
  // 지연 동안의 0도 rAF 안에서만 그리니 위의 '미리 덮지 않는다' 원칙은 그대로다.
  const dur = Number(el.dataset.dur) || 1600;
  const t0 = performance.now() + (Number(el.dataset.delay) || 0);
  const tick = (now) => {
    if (el._countRun !== run) return;
    const k = Math.max(0, Math.min(1, (now - t0) / dur));
    render(Math.round((1 - Math.pow(1 - k, 3)) * target));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function runCounters() {
  document.querySelectorAll('.statTile [data-count], .sinceVal[data-count]').forEach(animateCounter);
}

/** 통계 타일을 누르면 카운트업을 다시 재생한다. */
function initCounterReplay() {
  const body = document.getElementById('statsBody');
  if (!body) return;
  body.addEventListener('click', (ev) => {
    const tile = ev.target.closest('.statTile');
    if (!tile) return;
    if (!tile.classList.contains('lenTile') || reducedMotion) sfx('count');
    tile.querySelectorAll('[data-count]').forEach(animateCounter);
    if (reducedMotion) return;
    // 영상 길이 카드는 막대를 다시 채우는 대신 가위가 원본을 싹둑 자른다.
    if (tile.classList.contains('lenTile')) { lenSnip(tile); return; }
    // animation 전체가 아니라 이름만 껐다 켠다 — 전체를 덮으면 인라인 animation-delay까지
    // 지워져서, 다시 볼 때 줄마다 밀리던 시작이 사라지고 옆 숫자와 박자가 어긋난다.
    tile.querySelectorAll('.lenFill').forEach(el => {
      el.style.animationName = 'none'; void el.offsetWidth; el.style.animationName = '';
    });
  });
}

/** 가위가 원본 막대 끝에서 완성(없으면 컷편집 후) 길이까지 달려가 자르고,
    잘린 조각은 떨어지고, 자른 비율이 뱃지로 튀어나온다. 잠시 뒤 막대는 원래대로. */
function lenSnip(tile) {
  const bar = tile.querySelector('.lenRow.orig .lenBar');
  const fill = bar && bar.querySelector('.lenFill');
  // 완성 길이가 있으면 완성까지, 아직이면 컷편집 후 길이까지 자른다.
  const shortest = [...tile.querySelectorAll('.lenRow.final, .lenRow.cut')]
    .filter(r => r.querySelector('.value').textContent.trim() !== '-')
    .map(r => r.querySelector('.lenFill'))
    .find(f => f && parseFloat(f.style.width) > 0);
  if (!fill || !shortest || tile._snipping) return;
  const keep = parseFloat(shortest.style.width) / 100;
  if (!(keep > 0 && keep < 0.98)) return;
  tile._snipping = true;
  sfx('snip');

  const tr = tile.getBoundingClientRect(), br = bar.getBoundingClientRect();
  const x0 = br.left - tr.left, y0 = br.top - tr.top, w = br.width, h = br.height;
  const cutX = x0 + w * keep;

  const sc = document.createElement('span');
  sc.className = 'lenScissors';
  sc.textContent = '✂️';
  sc.style.left = `${cutX}px`; sc.style.top = `${y0 + h / 2}px`;
  tile.appendChild(sc);
  const travel = 520;
  sc.animate([
    { transform: `translate(${x0 + w - cutX}px, -50%) scaleX(-1) rotate(0deg)`, opacity: 0 },
    { opacity: 1, offset: 0.1 },
    { transform: `translate(${(x0 + w - cutX) * 0.6}px, -50%) scaleX(-1) rotate(-18deg)`, offset: 0.3 },
    { transform: `translate(${(x0 + w - cutX) * 0.3}px, -50%) scaleX(-1) rotate(8deg)`, offset: 0.6 },
    { transform: 'translate(0, -50%) scaleX(-1) rotate(-22deg)', offset: 0.85 },
    { transform: 'translate(0, -50%) scaleX(-1) rotate(0deg)', opacity: 1 },
  ], { duration: travel, easing: 'ease-in-out', fill: 'forwards' });

  setTimeout(() => {
    // 원본 막대는 자른 자리까지만 남기고, 나머지는 조각으로 떨어뜨린다.
    sfx('cut');
    fill.style.transition = 'none';
    fill.style.clipPath = `inset(0 ${((1 - keep) * 100).toFixed(2)}% 0 0)`;
    const piece = document.createElement('span');
    piece.className = 'lenPiece';
    Object.assign(piece.style, { left: `${cutX}px`, top: `${y0}px`, width: `${x0 + w - cutX}px`, height: `${h}px` });
    tile.appendChild(piece);
    piece.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(14px, 46px) rotate(9deg)', opacity: 0 },
    ], { duration: 800, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'forwards' });
    sc.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-6px, -90%) scaleX(-1) rotate(-30deg)' }],
      { duration: 400, delay: 150, fill: 'forwards' });

    const badge = document.createElement('span');
    badge.className = 'lenBadge';
    badge.textContent = `✂️ ${Math.round((1 - keep) * 100)}% 싹둑!`;
    badge.style.left = `${Math.min(Math.max(cutX, 60), tr.width - 60)}px`;
    badge.style.top = `${y0}px`;
    tile.appendChild(badge);

    setTimeout(() => {
      fill.style.transition = 'clip-path .7s cubic-bezier(.2,.8,.2,1)';
      fill.style.clipPath = 'inset(0 0 0 0)';
      setTimeout(() => {
        fill.style.transition = ''; fill.style.clipPath = '';
        sc.remove(); piece.remove(); badge.remove();
        tile._snipping = false;
      }, 750);
    }, 1300);
  }, travel);
}

/** 도넛을 잡고 돌릴 수 있게 한다. 놓으면 원래 각도로 튕겨 돌아온다.
    드래그였을 땐 히어로 카드의 폭죽 클릭이 같이 터지지 않게 막는다. */
function initDonutSpin() {
  const donut = document.getElementById('donutGauge');
  if (!donut || reducedMotion) return;
  let dragging = false, base = 0, current = 0, moved = false;

  const angleAt = (ev) => {
    const r = donut.getBoundingClientRect();
    return Math.atan2(ev.clientY - (r.top + r.height / 2), ev.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  donut.addEventListener('pointerdown', (ev) => {
    // 손가락·펜은 스크롤이 우선이다. 예전엔 여기서 preventDefault를 해버려서
    // 도넛에 손을 대고 화면을 내리면 링이 따라 돌고, 손을 뗀 자리가 도넛 밖이면
    // pointerup을 못 받아 회전이 그대로 굳어 있었다.
    if (ev.pointerType !== 'mouse') return;
    dragging = true; moved = false;
    base = angleAt(ev) - current;
    try { donut.setPointerCapture(ev.pointerId); } catch (e) { /* 포인터 캡처 실패해도 드래그는 계속 */ }
    donut.style.transition = 'none';
    ev.preventDefault();
  });
  donut.addEventListener('pointermove', (ev) => {
    if (!dragging) return;
    const next = angleAt(ev) - base;
    if (Math.abs(next - current) > 1.5) moved = true;
    current = next;
    donut.style.transform = `rotate(${current}deg) translateZ(0)`;
  });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    current = 0;
    donut.style.transition = 'transform 1s cubic-bezier(.2,1.5,.4,1)';
    donut.style.transform = 'rotate(0deg) translateZ(0)';
  };
  donut.addEventListener('pointerup', release);
  donut.addEventListener('pointercancel', release);
  // 캡처를 잃거나 창 밖에서 손을 떼도 회전이 남지 않게.
  donut.addEventListener('lostpointercapture', release);
  window.addEventListener('pointerup', release);
  window.addEventListener('blur', release);
  donut.addEventListener('click', (ev) => {
    if (moved) { ev.stopPropagation(); moved = false; }
  }, true);
}

/* ===== 작업 시작 시각을 그날의 해에 맞춰 물들이기 =====
   일출·일몰은 날짜별 표가 아니라 위경도+날짜로 계산되는 공식이라 데이터가 늘지 않는다.
   고정 시간대(6시~18시 식)로 하면 한국 기준 일몰이 12월 17:17 / 6월 19:57로 2시간 반
   차이나서 겨울 저녁이 '낮'으로 칠해지기 때문에 실제 값을 쓴다. */
const SITE_LAT = 37.5665, SITE_LON = 126.9780;   // 서울 기준

/** 그날의 태양 고도별 시각. at(고도, 오전이면 true)로 뽑아 쓴다.
    (SunCalc와 같은 표준 태양 위치 공식) */
function solarDay(date, lat, lon) {
  const rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545;
  const toJulian = (d) => d.valueOf() / dayMs - 0.5 + J1970;
  const fromJulian = (j) => (j + 0.5 - J1970) * dayMs;
  const lw = -lon * rad, phi = lat * rad;
  const n = Math.round(toJulian(date) - J2000 - 0.0009 - lw / (2 * Math.PI));
  const ds = 0.0009 + lw / (2 * Math.PI) + n;
  const M = (357.5291 + 0.98560028 * ds) * rad;
  const C = (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) * rad;
  const L = M + C + Math.PI + 102.9372 * rad;
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const dec = Math.asin(Math.sin(L) * Math.sin(23.4397 * rad));
  const noon = fromJulian(Jnoon);
  const at = (h, rising) => {
    const cosW = (Math.sin(h * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    if (cosW > 1 || cosW < -1) return null;   // 백야 / 극야
    const a = 0.0009 + (Math.acos(cosW) + lw) / (2 * Math.PI) + n;
    const setMs = fromJulian(J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L));
    return rising ? noon - (setMs - noon) : setMs;
  };
  return { noon, at };
}

/* 실제 하늘색을 따라가는 14개 스톱. 색상·채도는 진짜 하늘값을 쓰고 명도만 테마별로
   읽히게 올렸다 (다크 최저 7.0:1, 라이트 최저 5.0:1). 라이트는 원래 하늘색이 이미
   흰 배경에서 잘 읽혀 거의 그대로 쓴다. */
const SKY_DARK = ['#94a1dc','#95a1db','#a69dd5','#bc99b6','#e98a71','#f2a870','#f5c860','#ffe9a0','#f7d070','#f0a850','#f38567','#d88fa3','#bd95cf','#9e9ed7'];
const SKY_LIGHT = ['#131a3a','#1b2450','#3a3070','#8a5a82','#c6411f','#b15510','#916809','#8a6a00','#8f6808','#a25f0e','#ce3710','#be4365','#6a3a80','#25255a'];
// 구간 i는 stops[i] ~ stops[i+1] 사이를 뜻한다 (마지막은 자정으로 되돌아감).
const SKY_PHASE = ['한밤','동트기 전','새벽','동틀 무렵','아침','오전','늦은 오전','한낮','오후','해 질 무렵','노을','땅거미','밤','한밤'];

const hexToRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/** 하루를 태양 고도 기준 14구간으로 나눠 [시각, 색인덱스] 목록을 만든다. */
function skyStops(date) {
  const { noon, at } = solarDay(date, SITE_LAT, SITE_LON);
  const H = 3600000;
  const rise = at(-0.833, true), set = at(-0.833, false);
  const mid = noon - 12 * H;
  const lerpT = (a, b, k) => (a === null || b === null ? null : a + (b - a) * k);
  return [
    [mid, 0],
    [at(-18, true), 1], [at(-12, true), 2], [at(-6, true), 3],
    [rise, 4],
    [lerpT(rise, noon, 0.30), 5], [lerpT(rise, noon, 0.65), 6],
    [noon, 7],
    [lerpT(noon, set, 0.55), 8], [lerpT(noon, set, 0.88), 9],
    [set, 10],
    [at(-6, false), 11], [at(-12, false), 12], [at(-18, false), 13],
    [mid + 24 * H, 0],
  ].filter(([t]) => t !== null && Number.isFinite(t));
}

// 상단 띠·시간대 카드처럼 장식으로 쓰는 자리엔 밝기 보정 없이 진짜 하늘색을 쓴다.
const SKY_TRUE = ['#131a3a','#1b2450','#3a3070','#8a5a82','#e8846a','#f2a870','#f5c860','#ffe9a0','#f7d070','#f0a850','#f0603a','#c04a6a','#6a3a80','#25255a'];

const themeSkyPalette = () =>
  document.documentElement.getAttribute('data-theme') === 'light' ? SKY_LIGHT : SKY_DARK;

/** 그 시각의 하늘색과 구간 이름. palette를 주면 그 팔레트로 계산한다. */
function sunTint(iso, palette = themeSkyPalette()) {
  const d = new Date(iso), t = d.getTime();
  const stops = skyStops(d);
  const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

  const { noon, at } = solarDay(d, SITE_LAT, SITE_LON);
  const rise = at(-0.833, true), set = at(-0.833, false);
  const hm = (ms) => formatTimeOnly(new Date(ms).toISOString());
  const detail = rise && set ? ` (해 뜸 ${hm(rise)} · 해 짐 ${hm(set)})` : '';

  // 첫 스톱(자정) 이전이나 마지막(다음 자정) 이후면 양끝이 같은 자정색이라 그대로 쓴다.
  if (stops.length < 2 || t <= stops[0][0] || t >= stops[stops.length - 1][0]) {
    return { color: rgb(hexToRgb(palette[0])), phase: '한밤' + detail };
  }
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    if (t < t0 || t >= t1) continue;
    const k = (t - t0) / (t1 - t0);
    const a = hexToRgb(palette[c0]), b = hexToRgb(palette[c1]);
    return {
      color: rgb(a.map((v, j) => Math.round(v + (b[j] - v) * k))),
      phase: SKY_PHASE[c0] + detail,
    };
  }
  return { color: rgb(hexToRgb(palette[0])), phase: '한밤' + detail };
}

/** 작업 기록의 시작 시간들을 그 시각의 하늘색으로 칠한다 (테마가 바뀌면 다시 칠한다). */
function paintTimes() {
  document.querySelectorAll('.logRow .time[data-ts]').forEach((el) => {
    const { color, phase } = sunTint(el.dataset.ts);
    el.style.color = color;
    el.title = phase;
  });
}
