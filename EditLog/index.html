/** 캔버스 실제 크기를 매 프레임 맞춘다 (레이아웃 전 0 측정·리사이즈 대응). */
function fitCanvas(cv) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return null;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w, h, ctx };
}

/** 테마가 바뀌어도 따라오도록 --accent 값을 0.5초 캐시로 읽는다. */
var _accCache = { t: -1e9, v: '#34e0b0' };
function accentColor() {
  const now = performance.now();
  if (now - _accCache.t > 500) {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    _accCache = { t: now, v: v || '#34e0b0' };
  }
  return _accCache.v;
}

/* ===== 04 커서 스포트라이트 ===== */
/** #rrggbb -> rgba() (캔버스 그라디언트는 color-mix를 못 읽는다) */
function hexAlpha(hex, a) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function initSpotlight() {
  if (reducedMotion || !matchMedia('(hover: hover)').matches) return;
  document.querySelectorAll('.card, .statTile').forEach((card) => {
    if (card._spotLayer) return;
    const layer = document.createElement('span');
    layer.className = 'spotLayer';
    layer.setAttribute('aria-hidden', 'true');
    card.appendChild(layer);
    card._spotLayer = layer;
    card.addEventListener('pointermove', (ev) => {
      const r = card.getBoundingClientRect();
      layer.style.opacity = '1';
      layer.style.background = `radial-gradient(220px circle at ${ev.clientX - r.left}px ${ev.clientY - r.top}px,` +
        ` color-mix(in srgb, ${accentColor()} 16%, transparent), transparent 70%)`;
    });
    card.addEventListener('pointerleave', () => { layer.style.opacity = '0'; });
  });
}

/* ===== 10 리퀴드 진행률 — 버튼으로 도넛 ↔ 물결 전환 ===== */
let liquidRun = 0;
function initGaugeToggle() {
  initLiquidRefill();
  const btn = document.getElementById('gaugeSwap');
  const donut = document.getElementById('donutGauge');
  if (!btn || !donut) return;
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();   // 히어로 카드의 폭죽까지 터지지 않게
    const on = donut.classList.toggle('liquid');
    btn.textContent = on ? '◎ 도넛으로 보기' : '🌊 물결로 보기';
    if (on) startLiquid(); else liquidRun++;
  });
}

/** 리퀴드 상태에서 도넛을 누르면 물을 다시 밑에서부터 채운다. */
function initLiquidRefill() {
  const donut = document.getElementById('donutGauge');
  if (!donut) return;
  donut.addEventListener('click', (ev) => {
    if (!donut.classList.contains('liquid')) return;
    ev.stopPropagation();
    startLiquid();
  });
}

function startLiquid() {
  const cv = document.getElementById('liquidCanvas');
  if (!cv) return;
  const my = ++liquidRun;
  const t0 = performance.now();
  const draw = (now) => {
    if (my !== liquidRun) return;
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w: s, ctx } = f;
    const t = Math.max(0, now - t0) / 1000;
    const target = Math.max(0, Math.min(1, heroPct / 100));
    const fill = reducedMotion ? target : target * Math.min(1, 1 - Math.pow(1 - Math.min(1, t / 1.6), 3));
    const acc = accentColor();
    ctx.clearRect(0, 0, s, s);
    ctx.save();
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2 - 1, 0, 6.284); ctx.clip();
    const level = s * (1 - fill);
    const grad = ctx.createLinearGradient(0, level, 0, s);
    grad.addColorStop(0, acc);
    grad.addColorStop(1, hexAlpha(acc, 0.45));
    [[9, 1.5, 0.55, 0.92], [6, 2.3, -0.9, 0.45]].forEach(([amp, freq, spd, alpha]) => {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, s);
      for (let x = 0; x <= s; x += 4) {
        ctx.lineTo(x, level + Math.sin((x / s) * freq * 6.284 + t * spd * 2.4) * (reducedMotion ? 0 : amp));
      }
      ctx.lineTo(s, s); ctx.closePath(); ctx.fill();
    });
    ctx.restore();
    ctx.globalAlpha = 1;
    if (!reducedMotion) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ===== 31 살아있는 하늘 배경 — 지금 시각의 하늘색을 상단에 옅게 ===== */
function initSkyTop() {
  if (reducedMotion) return;
  const layer = document.createElement('div');
  layer.className = 'skyTop';
  layer.setAttribute('aria-hidden', 'true');
  document.body.appendChild(layer);
  // 지금 색과 40분 뒤 색을 함께 깔아 일출·일몰 전후로 하늘이 실제처럼 번지게 한다.
  // (sunTint는 서울 기준 태양 고도 공식이라 계절에 따라 일출·일몰이 자동으로 옮겨진다.)
  const paint = () => {
    const now = new Date();
    const soon = new Date(now.getTime() + 40 * 60000);
    const a = sunTint(now.toISOString(), SKY_TRUE);
    const b = sunTint(soon.toISOString(), SKY_TRUE);
    layer.style.background = `linear-gradient(180deg, ${a.color} 0%, ${b.color} 46%, transparent 100%)`;
    layer.title = a.phase;
  };
  paint();
  setInterval(paint, 60000);   // 1분마다 갱신 — 일출·일몰 무렵엔 눈에 보이게 변한다
}

/* ===== 32 혜성 커서 — 지나간 자리에 잔상 ===== */
function initComet() {
  if (reducedMotion || !matchMedia('(hover: hover)').matches) return;
  const cv = document.createElement('canvas');
  cv.id = 'cometCanvas';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  const trail = [];
  let lastMove = 0;
  window.addEventListener('pointermove', (ev) => {
    trail.push({ x: ev.clientX, y: ev.clientY });
    if (trail.length > 24) trail.shift();
    lastMove = performance.now();
  }, { passive: true });

  const draw = (now) => {
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w, h, ctx } = f;
    ctx.clearRect(0, 0, w, h);
    const acc = accentColor();
    for (let i = 1; i < trail.length; i++) {
      const a = i / trail.length;
      ctx.strokeStyle = acc;
      ctx.globalAlpha = a * 0.5;
      ctx.lineWidth = 1 + a * 4;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (trail.length > 1 && now - lastMove > 45) trail.shift();
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ===== 버튼 이펙트 : 꽃잎 · 반딧불이용 파티클 레이어 ===== */
let fx2 = null;
function initFx2() {
  if (fx2) return fx2;
  const cv = document.createElement('canvas');
  cv.id = 'fx2Canvas';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  fx2 = { cv, parts: [], loop: null };
  return fx2;
}

/** 지금 계절 (버튼 이름·이모지·꽃잎 색이 같은 값을 쓴다) */
function currentSeason() {
  const m = new Date().getMonth();
  if (m >= 2 && m <= 4) return { label: '🌸 꽃잎', color: '#f7c8d8', speed: 1 };
  if (m >= 5 && m <= 7) return { label: '🍃 초록잎', color: '#8fd6a8', speed: 1.15 };
  if (m >= 8 && m <= 10) return { label: '🍁 낙엽', color: '#f2b84a', speed: 1.9 };
  return { label: '❄️ 눈', color: '#eef5f2', speed: 0.8 };
}

function fx2Spawn(kind) {
  if (reducedMotion) return;
  const f = initFx2();
  const W = window.innerWidth, H = window.innerHeight;
  const rand = (a, b) => a + Math.random() * (b - a);
  // 계절에 맞춰 꽃잎 / 낙엽 / 눈으로 바뀐다.
  const season = currentSeason();
  if (kind === 'petal') {
    for (let i = 0; i < 26; i++) f.parts.push({
      kind, x: rand(0, W), y: rand(-H * 0.6, -10), vx: rand(-0.35, 0.35) * season.speed, vy: rand(0.7, 1.7) * season.speed,
      r: rand(3, 6.5), rot: rand(0, 6.28), spin: rand(-0.03, 0.03), sway: rand(0.5, 1.5),
      tw: rand(0, 6.28), life: 1, decay: 0.0016, color: season.color, delay: i * 90,
    });
  } else {
    for (let i = 0; i < 15; i++) f.parts.push({
      kind: 'firefly', x: rand(0.05, 0.95) * W, y: rand(0.15, 0.95) * H,
      vx: rand(-0.35, 0.35), vy: rand(-0.45, 0.2), tw: rand(0, 6.28),
      r: rand(1.4, 2.8), life: 1, decay: rand(0.0022, 0.0045), delay: i * 45,
    });
  }
  if (f.loop) return;
  let last = performance.now();
  const draw = (now) => {
    const fit = fitCanvas(f.cv);
    if (!fit) { f.loop = requestAnimationFrame(draw); return; }
    const { w, h, ctx } = fit;
    const dt = Math.min(40, Math.max(0, now - last)); last = now;
    const acc = accentColor();
    ctx.clearRect(0, 0, w, h);
    f.parts = f.parts.filter((p) => {
      if (p.delay > 0) { p.delay -= dt; return true; }
      if (p.kind === 'petal') {
        p.tw += 0.03 * dt / 16;
        p.x += (p.vx + Math.sin(p.tw) * p.sway) * dt / 16;
        p.y += p.vy * dt / 16; p.rot += p.spin * dt / 16;
        if (p.y > h + 20) p.life = 0;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.6, p.r * 0.8, 0, 0, 6.284); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
      } else {
        p.tw += 0.05 * dt / 16;
        p.vx = Math.max(-0.7, Math.min(0.7, p.vx + (Math.random() - 0.5) * 0.05));
        p.vy = Math.max(-0.7, Math.min(0.7, p.vy + (Math.random() - 0.5) * 0.05));
        p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.life -= p.decay * dt / 16;
        ctx.globalAlpha = (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(p.tw))) * Math.max(0, p.life);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 14; ctx.shadowColor = acc;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.284); ctx.fill();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
      return p.life > 0 && p.y < h + 120;
    });
    if (f.parts.length) f.loop = requestAnimationFrame(draw);
    else { ctx.clearRect(0, 0, w, h); f.loop = null; }
  };
  f.loop = requestAnimationFrame(draw);
}

/** 화면 전체 위에 잠깐 얹는 레이어. */
function fxLayer(css, ms) {
  const el = document.createElement('div');
  el.className = 'fxLayer';
  el.setAttribute('aria-hidden', 'true');
  el.style.cssText += css;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
  return el;
}

/** 🌠 별똥별 소나기 — 기존 별똥별을 20개 연달아 */
function meteorShower() {
  if (reducedMotion) return;
  const f = initFx();
  if (!f) return;
  for (let i = 0; i < 7; i++) {
    const d = i * 420 + Math.random() * 220;
    setTimeout(() => { f.meteor(); f.kick(); }, d);
  }
}

/** ✂️ 화면 컷편집 */
function fxScreenCut() {
  if (reducedMotion) return;
  const page = document.querySelector('.page');
  const line = fxLayer('left:-20%;right:-20%;top:46%;height:2px;background:#fff;box-shadow:0 0 16px 4px rgba(255,255,255,.7);transform:rotate(-8deg)', 700);
  if (line && line.animate) line.animate([
    { opacity: 0, transform: 'rotate(-8deg) scaleX(0)' },
    { opacity: 1, transform: 'rotate(-8deg) scaleX(1)', offset: 0.45 },
    { opacity: 0, transform: 'rotate(-8deg) scaleX(1)' },
  ], { duration: 650, easing: 'ease-out' });
  if (!page) return;
  setTimeout(() => {
    page.style.transition = 'transform .45s cubic-bezier(.2,1.5,.4,1)';
    page.style.transform = 'translateX(14px) skewX(-1.5deg)';
    setTimeout(() => { page.style.transform = ''; }, 220);
    setTimeout(() => { page.style.transition = ''; }, 720);
  }, 300);
}

/** 🎰 숫자 슬롯 — 화면의 숫자가 돌다 멈춘다 */
function fxSlot() {
  if (reducedMotion) return;
  const digits = '0123456789';
  // 날짜·경과 시간·비율까지, 화면에서 숫자가 들어간 잎 요소를 모두 돌린다.
  const targets = [...document.querySelectorAll('.page *')]
    .filter(el => el.children.length === 0
      && !el.closest('.topRight')
      && /\d/.test(el.textContent || '')
      && (el.textContent || '').length <= 24)
    .slice(0, 160);
  targets.forEach((el, i) => {
    const final = el.dataset.slotFinal || el.textContent;
    el.dataset.slotFinal = final;
    const run = el._slotRun = (el._slotRun || 0) + 1;
    const t0 = performance.now(), dur = 700 + (i % 7) * 90;
    const step = (now) => {
      if (el._slotRun !== run) return;
      if (Math.max(0, now - t0) >= dur) { el.textContent = final; return; }
      el.textContent = final.replace(/\d/g, () => digits[Math.floor(Math.random() * 10)]);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { if (el._slotRun === run) el.textContent = final; }, dur + 200);
  });
}

/* ===== 06 + 12 은하수 패럴랙스 (밤에만) — 별 수는 마지막 기록 이후 흐른 시간에 비례 ===== */
function initGalaxy(data) {
  if (reducedMotion) return;
  const entries = data.entries || [];
  const lastTs = entries.length ? new Date(entries[entries.length - 1].timestamp).getTime() : Date.now();
  const cv = document.createElement('canvas');
  cv.id = 'galaxyCanvas';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);

  const layers = [
    { r: 0.5, depth: 0.25, spd: 0.004, share: 0.55 },
    { r: 0.9, depth: 0.55, spd: 0.008, share: 0.3 },
    { r: 1.5, depth: 1.0, spd: 0.014, share: 0.15 },
  ].map((L) => ({ ...L, stars: Array.from({ length: 130 }, () => ({ x: Math.random(), y: Math.random(), tw: Math.random() * 6.28 })) }));

  let px = 0.5, py = 0.5;
  window.addEventListener('pointermove', (ev) => {
    px = ev.clientX / window.innerWidth; py = ev.clientY / window.innerHeight;
  }, { passive: true });

  const draw = (now) => {
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w, h, ctx } = f;
    ctx.clearRect(0, 0, w, h);
    // 낮에는 은하수를 접는다 (별똥별과 같은 규칙)
    if (!document.hidden && isNightNow()) {
      const idleHours = Math.max(0, (Date.now() - lastTs) / 3600000);
      const fill = Math.min(1, 0.12 + idleHours / 72);   // 3일 방치 = 가득
      const band = ctx.createLinearGradient(0, h * 0.1, w, h * 0.7);
      band.addColorStop(0, 'rgba(120,140,220,0)');
      band.addColorStop(0.45, `rgba(150,170,235,${(0.05 + fill * 0.07).toFixed(3)})`);
      band.addColorStop(1, 'rgba(120,140,220,0)');
      ctx.fillStyle = band;
      ctx.fillRect(0, 0, w, h);
      layers.forEach((L) => {
        const n = Math.round(L.stars.length * L.share * fill * 2.2);
        const ox = (px - 0.5) * -30 * L.depth, oy = (py - 0.5) * -20 * L.depth;
        for (let i = 0; i < n && i < L.stars.length; i++) {
          const st = L.stars[i];
          st.x += L.spd / 60;
          if (st.x > 1.05) st.x = -0.05;
          ctx.globalAlpha = (0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now / 900 + st.tw))) * (0.5 + L.depth * 0.5);
          ctx.fillStyle = '#eef5f2';
          ctx.beginPath(); ctx.arc(st.x * w + ox, st.y * h + oy, L.r, 0, 6.284); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ===== 13 완료 카드 러닝 라이트 ===== */
function initRunningLight(data) {
  if (data.status !== 'completed' || reducedMotion) return;
  const card = document.getElementById('doneCard');
  if (card) card.classList.add('running');
}

/** 🌧️ 비 — 빗줄기만, 짧게 지나간다 */
function fxRain() {
  if (reducedMotion) return;
  const DUR = 8000, RAMP_UP = 900, RAMP_DOWN = 1500;
  let cv = document.getElementById('rainCanvas');
  if (cv) { cv._until = performance.now() + DUR; return; }
  cv = document.createElement('canvas');
  cv.id = 'rainCanvas';
  cv.setAttribute('aria-hidden', 'true');
  cv._start = performance.now();
  cv._until = cv._start + DUR;
  document.body.appendChild(cv);
  const drops = Array.from({ length: 90 }, () => ({
    x: Math.random(), y: Math.random(), v: 0.006 + Math.random() * 0.014,
    len: 12 + Math.random() * 30, w: 0.8 + Math.random() * 1.2,
  }));
  const draw = (now) => {
    if (now >= cv._until) { cv.remove(); return; }
    const f = fitCanvas(cv);
    if (!f) { requestAnimationFrame(draw); return; }
    const { w, h, ctx } = f;
    // 시작할 땐 빗줄기 수를 서서히 늘리고, 끝날 땐 서서히 줄인다 (뚝 나타났다 뚝 끊기지 않게).
    const rampUp = Math.max(0, Math.min(1, (now - cv._start) / RAMP_UP));
    const rampDown = Math.max(0, Math.min(1, (cv._until - now) / RAMP_DOWN));
    const level = Math.min(rampUp, rampDown);
    const activeCount = Math.round(drops.length * level);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = `rgba(190,215,255,${0.45 * level})`;
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      d.y += d.v;
      if (d.y > 1.1) { d.y = -0.1; d.x = Math.random(); }
      if (i >= activeCount) continue;
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x * w, d.y * h);
      ctx.lineTo(d.x * w + 3, d.y * h - d.len);
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

function initFxButtons() {
  const wire = (id, fn) => {
    const b = document.getElementById(id);
    if (b) b.addEventListener('click', fn);
  };
  wire('btnMeteor', meteorShower);
  const petalBtn = document.getElementById('btnPetal');
  if (petalBtn) petalBtn.textContent = currentSeason().label;
  wire('btnPetal', () => fx2Spawn('petal'));
  wire('btnFly', () => fx2Spawn('firefly'));
  wire('btnCut', fxScreenCut);
  wire('btnSlot', fxSlot);
  wire('btnRain', fxRain);
}

main();
